name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # 实网测试按天跑，不挂在普通主分支检查上：第三方限流或改版会让每次代码检查变红，
  # 那只会训练所有人忽略红灯。
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Unit and parser tests
        run: >-
          go test
          -skip 'TestRunFIOD1LatencyWithRealFIO|TestDetectFIOEngineAgreesWithEnghelp|TestRunRepresentativeFIOJobsWithRealFIO|TestExecuteSysbenchCPUUsesStableOfficialWorkload|TestRunSysbenchWithRealBinary|TestRunStreamWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...
      # 翻译覆盖率使用当前报告样本；样本缺失时测试使用当前 renderer contract，
      # 不把已删除样本重新作为测试目标。
      - name: i18n coverage
        if: matrix.go == 'stable'
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: |
          go test ./internal/report/ -run '^TestLocalizeCoversRealReports$' -v
          go test ./internal/i18n/ -v
      - run: go vet ./...
      - run: go build ./cmd/ecs
      - run: sh -n install.sh
      - run: sh -n run.sh
      - run: bash -n scripts/package.sh
      - run: bash -n scripts/build_tools.sh
      - run: bash -n scripts/build_corpus.sh
      - name: Verify tools package layout regression
        run: bash scripts/package_tools_test.sh

  # 跑分提交校验：新增提交必须格式合法、指纹自洽、不与已有记录重复。
  # 指纹由内容派生，因此手改数值而不重算会被当场发现。
  submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate submissions
        run: go test ./internal/score/ -run TestSubmissionCorpus -v
        env:
          ECS_SUBMISSION_DIR: submissions

      # 离群检测只标记不阻断：可能是新硬件或特殊配置，由维护者判断。
      # --annotate 把结果转成 GitHub 检查注解，直接显示在检查页面上。
      - name: Check for outliers
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --annotate --verbose \
              --output /tmp/baseline-check.json \
              submissions
          else
            echo "当前没有排行榜提交，跳过离群检测"
          fi

      # 排行榜参考重建只在主分支 push 做：检查阶段不改工作区，避免把生成文件
      # 混进正在审核的代码变更。
      - name: Rebuild leaderboard reference
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --source "社区提交聚合" \
              --output submissions/baseline.json \
              submissions
            # 排行榜参考随二进制发布，因此同步写进内嵌副本。
            cp submissions/baseline.json internal/score/embedded/baseline.json
            go build ./... && go test ./internal/score/
          else
            echo "当前没有排行榜提交，保持无基线状态"
          fi

      - name: Commit rebuilt leaderboard reference
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- submissions/baseline.json internal/score/embedded/baseline.json; then
            echo "排行榜参考无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/baseline.json internal/score/embedded/baseline.json
          git commit -m "CI：按最新提交重建排行榜参考"
          git push

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Race tests
        run: >-
          go test -race
          -skip 'TestRunFIOD1LatencyWithRealFIO|TestDetectFIOEngineAgreesWithEnghelp|TestRunRepresentativeFIOJobsWithRealFIO|TestExecuteSysbenchCPUUsesStableOfficialWorkload|TestRunSysbenchWithRealBinary|TestRunStreamWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make cross

  # 实网协议/解析检查：确认第三方数据源与公共服务的当前响应仍能解析。
  # 只在定时任务与手动触发时运行；普通 push 不触发外部网络请求。
  live:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Live upstream protocol checks
        run: >-
          go test -tags=live ./internal/probe/
          -run '^TestLive(IPLookup|IPQualityProviders|CommunityGateway|MediaStrongRules|IPerfNodeReachability|STUNServers)$'
          -v -timeout 20m
