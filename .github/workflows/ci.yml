name: ci

# 这个 commit 能不能进 main？
#
# 只回答这一个问题。排行榜重建与写回在 leaderboard.yml，发布在 release.yml。
# 红灯语义：ci 红表示代码或构建问题，应阻断合并；leaderboard 红表示排行榜
# 处理失败；release 红表示发布门禁未通过。各 workflow 的职责边界保持独立。
#
# compat 验证最低源码兼容版本；它必须使用 GOTOOLCHAIN=local，避免 go.mod
# 要求更高版本时悄悄切换工具链而失去验证意义。unit 与其余普通 CI job 从仓库根
# .go-version 读取，不跟随 stable/latest 漂移；compat 只验证最低支持版本。

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 行为：程序做的事对不对。
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      # 翻译覆盖率用当前报告样本；样本缺失时测试回落到当前 renderer contract。
      - name: Unit and parser tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # 最低源码兼容版本测试。
  compat:
    name: compat (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Unit and parser tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # 静态规则、格式、数据契约。与 release preflight 是同一个脚本；安全扫描在
  # 独立的 security workflow 中运行，不改变本 workflow 的 required gate。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci/check.sh

  # 与真实基准工具的集成。工具由脚本自己装齐，装什么不写在 YAML 里。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci/integration.sh

  # 并发问题。
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - run: go test -race ./...

  # 七个发布架构现在都编得过吗。
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/cross.sh

  # 跑分提交校验：格式合法、指纹自洽、不与已有记录重复。指纹由内容派生，
  # 手改数值而不重算会被当场发现。只读：写权限属于 leaderboard.yml。
  submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Validate submissions
        env:
          ECS_SUBMISSION_DIR: submissions
        run: go test ./internal/score -run '^TestSubmissionCorpus$' -count=1 -v

      # 离群检测只标记不阻断：可能是新硬件或特殊配置，由维护者判断。
      # --annotate 把结果转成 GitHub 检查注解，直接显示在检查页面上。
      - name: Check for outliers
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --annotate --verbose \
              --output /tmp/baseline-check.json \
              submissions
          else
            echo "当前没有排行榜提交，跳过离群检测"
          fi

  # branch protection 的单点引用：加新 job 时只改这里的 needs，
  # 不必去仓库设置里逐个勾选。
  required:
    if: always()
    needs: [unit, compat, quality, integration, race, cross, submissions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          COMPAT_RESULT: ${{ needs.compat.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RACE_RESULT: ${{ needs.race.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          SUBMISSIONS_RESULT: ${{ needs.submissions.result }}
        run: |
          set -euo pipefail
          summary=(
            "unit=$UNIT_RESULT"
            "compat=$COMPAT_RESULT"
            "quality=$QUALITY_RESULT"
            "integration=$INTEGRATION_RESULT"
            "race=$RACE_RESULT"
            "cross=$CROSS_RESULT"
            "submissions=$SUBMISSIONS_RESULT"
          )
          printf '上游 job 结果：%s\n' "${summary[*]}"
          for item in "${summary[@]}"; do
            if [[ "${item#*=}" != "success" ]]; then
              printf '有 job 未通过：%s\n' "${summary[*]}" >&2
              exit 1
            fi
          done
          echo "全部通过"
