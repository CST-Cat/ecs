name: ci

# 这个 commit 能不能进 main？
#
# main push 和 PR 跑完整回归；bsd 分支使用独立的 bsd.yml，只验收真实 FreeBSD
# 功能。排行榜重建与写回在 leaderboard.yml，发布在 release.yml。
# 红灯语义：ci 红表示代码或构建问题，应阻断合并；leaderboard 红表示排行榜
# 处理失败；release 红表示发布门禁未通过。各 workflow 的职责边界保持独立。
#
# compat 验证最低源码兼容版本；它必须使用 GOTOOLCHAIN=local，避免 go.mod
# 要求更高版本时悄悄切换工具链而失去验证意义。unit 与其余普通 CI job 使用仓库
# canonical toolchain Go 1.27.1，并关闭不必要的 latest 探测；compat 仍固定验证
# 最低支持版本 1.22.x。

on:
  push:
    branches: ["main", "bsd", "win/candidate-c", "win-candidate-c"]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Unit and parser tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  compat:
    name: compat (${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Unit and parser tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - run: ./scripts/ci/check.sh

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - run: ./scripts/ci/integration.sh

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - run: go test -race ./...

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux_amd64
          - linux_arm64
          - linux_armv7
          - linux_386
          - linux_s390x
          - linux_riscv64
          - linux_ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - run: ./scripts/cross.sh --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

  # main 推送仍在两个正式 FreeBSD 架构上做真实运行验收（与 bsd.yml 的分支 CI
  # 同一形态：宿主机交叉构建，真实 FreeBSD VM 内执行消费）。
  freebsd:
    name: freebsd runtime (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      # BUILD verifies the exact FreeBSD target on the fast host. Runtime support
      # is proven below by executing these artifacts inside the real target VM;
      # compiling the Go toolchain under QEMU only measures emulator speed.
      - name: BUILD
        id: freebsd_build
        env:
          FREEBSD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$FREEBSD_ARCH" in
            x86_64) goarch=amd64 ;;
            aarch64) goarch=arm64 ;;
            *) echo "unsupported FreeBSD CI arch: $FREEBSD_ARCH" >&2; exit 1 ;;
          esac
          rm -rf .ci/freebsd-runtime
          mkdir -p .ci/freebsd-runtime
          GOOS=freebsd GOARCH="$goarch" CGO_ENABLED=0 \
            go build -o .ci/freebsd-runtime/ecs ./cmd/ecs
          GOOS=freebsd GOARCH="$goarch" CGO_ENABLED=0 \
            go test -c -tags=integration \
              -o .ci/freebsd-runtime/probe.test ./internal/probe
          test -s .ci/freebsd-runtime/ecs
          test -s .ci/freebsd-runtime/probe.test

      - name: Start FreeBSD 15.1 VM
        id: freebsd_vm
        if: ${{ always() && steps.freebsd_build.outcome == 'success' }}
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          cpu: 4
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            # FreeBSD runtime VM prepare contract/v1; bump this token if it changes.
            pw useradd ecsci -m -s /bin/sh

      - name: VM CONTRACT
        id: freebsd_vm_contract
        if: ${{ always() && steps.freebsd_build.outcome == 'success' && steps.freebsd_vm.outcome == 'success' }}
        shell: freebsd {0}
        run: |
          set -eu
          case "${{ matrix.arch }}" in
            x86_64) target=freebsd_amd64 ;;
            aarch64) target=freebsd_arm64 ;;
            *) echo "unsupported FreeBSD CI arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          /bin/sh "$GITHUB_WORKSPACE/scripts/ci/freebsd_vm_contract.sh" "$target"

      - name: SYSTEM
        id: freebsd_system
        if: ${{ always() && steps.freebsd_build.outcome == 'success' && steps.freebsd_vm.outcome == 'success' && steps.freebsd_vm_contract.outcome == 'success' }}
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /bin/sh '$GITHUB_WORKSPACE/scripts/ci/freebsd_runtime.sh' system"

      - name: PING
        id: freebsd_ping
        if: ${{ always() && steps.freebsd_build.outcome == 'success' && steps.freebsd_vm.outcome == 'success' && steps.freebsd_vm_contract.outcome == 'success' }}
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /bin/sh '$GITHUB_WORKSPACE/scripts/ci/freebsd_runtime.sh' ping"

      - name: ROUTE
        id: freebsd_route
        if: ${{ always() && steps.freebsd_build.outcome == 'success' && steps.freebsd_vm.outcome == 'success' && steps.freebsd_vm_contract.outcome == 'success' }}
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /bin/sh '$GITHUB_WORKSPACE/scripts/ci/freebsd_runtime.sh' route"

      - name: BACKTRACE
        id: freebsd_backtrace
        if: ${{ always() && steps.freebsd_build.outcome == 'success' && steps.freebsd_vm.outcome == 'success' && steps.freebsd_vm_contract.outcome == 'success' }}
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /bin/sh '$GITHUB_WORKSPACE/scripts/ci/freebsd_runtime.sh' backtrace"

      - name: Require FreeBSD functionality
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.freebsd_build.outcome }}
          CONTRACT_OUTCOME: ${{ steps.freebsd_vm_contract.outcome }}
          SYSTEM_OUTCOME: ${{ steps.freebsd_system.outcome }}
          PING_OUTCOME: ${{ steps.freebsd_ping.outcome }}
          ROUTE_OUTCOME: ${{ steps.freebsd_route.outcome }}
          BACKTRACE_OUTCOME: ${{ steps.freebsd_backtrace.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "BUILD=$BUILD_OUTCOME" \
            "CONTRACT=$CONTRACT_OUTCOME" \
            "SYSTEM=$SYSTEM_OUTCOME" \
            "PING=$PING_OUTCOME" \
            "ROUTE=$ROUTE_OUTCOME" \
            "BACKTRACE=$BACKTRACE_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            if [[ "$outcome" == "success" ]]; then
              printf '[PASS] %s\n' "$name"
            else
              printf '[FAIL] %s (%s)\n' "$name" "$outcome" >&2
              failed=1
            fi
          done
          exit "$failed"

  windows-runtime:
    name: windows runtime (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Build ecs.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          go build -trimpath -o ecs.exe ./cmd/ecs
          if (-not (Test-Path -LiteralPath ecs.exe -PathType Leaf)) { throw 'ecs.exe was not built' }

      - name: Runtime command contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Invoke-Ecs {
            param([Parameter(Mandatory, Position = 0)][string[]]$Arguments)
            $output = @(& .\ecs.exe @Arguments 2>&1)
            if ($LASTEXITCODE -ne 0) {
              $details = $output -join "`n"
              throw "ecs.exe $($Arguments -join ' ') failed with exit code $LASTEXITCODE`n$details"
            }
            return $output
          }

          function Get-SystemFieldRaw {
            param(
              [Parameter(Mandatory)][object]$Result,
              [Parameter(Mandatory)][string]$Key
            )
            $fieldMatches = @($Result.fields | Where-Object { [string]$_.key -eq $Key })
            if ($fieldMatches.Count -ne 1) { throw "system JSON must contain one field named $Key" }
            $value = $fieldMatches[0].value
            if ($null -eq $value -or $value.PSObject.Properties.Name -notcontains 'raw') {
              throw "system JSON field $Key is not a raw value"
            }
            $raw = [string]$value.raw
            if ([string]::IsNullOrWhiteSpace($raw)) { throw "system JSON field $Key is empty" }
            return $raw
          }

          function Convert-PositiveMachineBytes {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<number>[0-9]+(?:\.[0-9]+)?)\s*(?<unit>B|KiB|MiB|GiB|TiB|PiB)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable byte value: $Raw" }
            $number = [double]::Parse($match.Groups['number'].Value, [Globalization.CultureInfo]::InvariantCulture)
            $exponent = switch ($match.Groups['unit'].Value) {
              'B' { 0 }
              'KiB' { 1 }
              'MiB' { 2 }
              'GiB' { 3 }
              'TiB' { 4 }
              'PiB' { 5 }
              default { throw "$Name has an unknown byte unit: $Raw" }
            }
            $bytes = $number * [math]::Pow(1024, $exponent)
            if ([double]::IsNaN($bytes) -or [double]::IsInfinity($bytes) -or $bytes -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $bytes
          }

          function Convert-PositiveMachineSeconds {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<seconds>[0-9]+(?:\.[0-9]+)?)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable seconds value: $Raw" }
            $seconds = [double]::Parse($match.Groups['seconds'].Value, [Globalization.CultureInfo]::InvariantCulture)
            if ([double]::IsNaN($seconds) -or [double]::IsInfinity($seconds) -or $seconds -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $seconds
          }

          function Assert-WindowsSystemFacts {
            param([Parameter(Mandatory)][object]$Report)
            $systemMatches = @($Report.results | Where-Object { [string]$_.id -eq 'system' })
            if ($systemMatches.Count -ne 1) { throw 'system JSON has no unique system result' }
            $system = $systemMatches[0]
            $os = Get-SystemFieldRaw -Result $system -Key 'os'
            if ($os -notmatch '(?i)^Windows(?:\s+Server)?\b') { throw "system OS is not Windows: $os" }
            if ((Get-SystemFieldRaw -Result $system -Key 'arch') -ne 'amd64') { throw 'system arch is not amd64' }
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'memory_total') -Name 'memory_total')
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'disk_total') -Name 'disk_total')
            [void](Convert-PositiveMachineSeconds -Raw (Get-SystemFieldRaw -Result $system -Key 'uptime_seconds') -Name 'uptime_seconds')
            $logicalMatches = @($system.measurements | Where-Object { [string]$_.key -eq 'logical_cpus' })
            if ($logicalMatches.Count -ne 1) { throw 'system JSON must contain one logical_cpus measurement' }
            $logicalCPUs = [double]$logicalMatches[0].value
            if ([double]::IsNaN($logicalCPUs) -or [double]::IsInfinity($logicalCPUs) -or $logicalCPUs -le 0) {
              throw "logical_cpus is not positive: $($logicalMatches[0].value)"
            }
          }

          function Assert-EcsLoopbackLatencyReport {
            param(
              [Parameter(Mandatory)][string]$Root,
              [Parameter(Mandatory)][string]$Language
            )
            $reportItem = Get-ChildItem -LiteralPath $Root -Filter '*.json' -File -Recurse | Select-Object -First 1
            if ($null -eq $reportItem) { throw "loopback $Language JSON report was not written" }
            $report = Get-Content -Raw -LiteralPath $reportItem.FullName | ConvertFrom-Json
            if ([string]$report.schema_version -ne 'ecs.report/v1') {
              throw "loopback $Language JSON has unexpected schema_version: $($report.schema_version)"
            }
            $latencyMatches = @($report.results | Where-Object { [string]$_.id -eq 'latency' })
            if ($latencyMatches.Count -ne 1) { throw "loopback $Language JSON has no unique latency result" }
            $icmpMeasurements = @($latencyMatches[0].measurements | Where-Object {
              [string]$_.key -match '^icmp_.*_loopback_ipv4$' -and [string]$_.method -eq 'icmp-echo-v1'
            })
            if ($icmpMeasurements.Count -eq 0) {
              throw "loopback $Language JSON has no native ICMP measurement"
            }
            $lossMatches = @($latencyMatches[0].measurements | Where-Object { [string]$_.key -eq 'icmp_loss_percent_loopback_ipv4' -and [string]$_.method -eq 'icmp-echo-v1' })
            if ($lossMatches.Count -ne 1 -or [double]$lossMatches[0].value -ne 0) {
              throw "loopback $Language JSON did not report zero native ICMP loss"
            }
            if (@($latencyMatches[0].measurements | Where-Object { [string]$_.key -match '^icmp_' -and [string]$_.method -ne 'icmp-echo-v1' }).Count -ne 0) {
              throw "loopback $Language JSON contains an ICMP measurement with an unexpected method"
            }
          }

          $version = (Invoke-Ecs @('--version')) -join "`n"
          if ($version -notmatch '(?i)ecs\s') { throw "--version output is invalid: $version" }

          $list = (Invoke-Ecs @('list')) -join "`n"
          foreach ($marker in @('standard', 'full', 'system')) {
            if ($list -notmatch [regex]::Escape($marker)) { throw "list output is missing $marker" }
          }

          $planText = (Invoke-Ecs @('plan', '--profile', 'standard')) -join "`n"
          $plan = $planText | ConvertFrom-Json
          if ([string]$plan.schema_version -ne 'ecs.plan/v1' -or [string]$plan.profile -ne 'standard') { throw 'standard plan contract failed' }

          $jsonRoot = Join-Path $env:RUNNER_TEMP 'ecs-system-json'
          $jsonOutput = Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'json', '--output', $jsonRoot, '--no-color')
          $jsonFile = Get-ChildItem -LiteralPath $jsonRoot -Filter '*.json' -File -Recurse | Select-Object -First 1
          if ($null -eq $jsonFile) { throw 'system JSON report was not written' }
          $report = Get-Content -Raw $jsonFile.FullName | ConvertFrom-Json
          Assert-WindowsSystemFacts -Report $report

          $textRoot = Join-Path $env:RUNNER_TEMP 'ecs-system-text'
          [void](Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', $textRoot, '--no-color'))
          $textFile = Get-ChildItem -LiteralPath $textRoot -Filter '*.md' -File -Recurse | Select-Object -First 1
          if ($null -eq $textFile -or $textFile.Length -eq 0) { throw 'system text report was not written' }

          $redirected = Join-Path $env:RUNNER_TEMP 'ecs-redirected.txt'
          & .\ecs.exe run --lang en --only system --yes --format md --output (Join-Path $env:RUNNER_TEMP 'ecs-redirected-report') *> $redirected
          if ($LASTEXITCODE -ne 0) { throw 'redirected ecs.exe run failed' }
          if ((Get-Content -Raw $redirected) -match "`e\[") { throw 'redirected output contains ANSI escape sequences' }

          $env:NO_COLOR = ''
          try {
            $noColorOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-no-color-report')))
            if (($noColorOutput -join "`n") -match "`e\[") { throw 'NO_COLOR did not suppress ANSI output' }
          } finally { Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue }

          $noColorFlagOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-no-color-flag-report'), '--no-color'))
          if (($noColorFlagOutput -join "`n") -match "`e\[") { throw '--no-color did not suppress ANSI output' }

          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          try {
            $port = $listener.LocalEndpoint.Port
            foreach ($language in @('en-US', 'zh-CN')) {
              $latencyRoot = Join-Path $env:RUNNER_TEMP ("ecs-loopback-$language")
              [void](Invoke-Ecs @('run', '--lang', $language, '--only', 'latency', '--exposure', 'any', '--ip-version', '4', '--latency-attempts', '2', '--latency-targets', "loopback=127.0.0.1:$port", '--yes', '--format', 'json', '--output', $latencyRoot, '--no-color'))
              Assert-EcsLoopbackLatencyReport -Root $latencyRoot -Language $language
            }
          } finally { $listener.Stop() }

          Write-Output 'ecs.exe runtime command contract passed: version/list/plan, system JSON/text, redirect, NO_COLOR, --no-color, and native loopback ICMP'

      - name: Process-tree cancellation and Windows console/TTY tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPLoopback$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'TestWindowsNativeICMPLoopback failed' }
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPDeadlineDoesNotHang$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'TestWindowsNativeICMPDeadlineDoesNotHang failed' }
          go test ./internal/probe -run '^TestProbeCommandWindowsProcessTree$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'TestProbeCommandWindowsProcessTree failed' }
          go test ./internal/ui -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'internal/ui tests failed' }
          go test ./cmd/ecs -run '^TestNotifyContextHandlesConsoleInterrupt$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'TestNotifyContextHandlesConsoleInterrupt failed' }

  windows-tools:
    name: windows-tools
    permissions:
      contents: read
    uses: ./.github/workflows/windows-tools.yml

  submissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Validate submissions
        env:
          ECS_SUBMISSION_DIR: submissions
        run: go test ./internal/score -run '^TestSubmissionCorpus$' -count=1 -v
      - name: Check for outliers
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs leaderboard \
              --annotate --verbose \
              --output /tmp/baseline-check.json \
              submissions
          else
            echo "当前没有排行榜提交，跳过离群检测"
          fi

  required:
    if: always()
    needs: [unit, compat, quality, integration, race, cross, freebsd, windows-runtime, windows-tools, submissions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          COMPAT_RESULT: ${{ needs.compat.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RACE_RESULT: ${{ needs.race.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          FREEBSD_RESULT: ${{ needs.freebsd.result }}
          WINDOWS_RUNTIME_RESULT: ${{ needs['windows-runtime'].result }}
          WINDOWS_TOOLS_RESULT: ${{ needs['windows-tools'].result }}
          SUBMISSIONS_RESULT: ${{ needs.submissions.result }}
        run: |
          set -euo pipefail
          summary=(
            "unit=$UNIT_RESULT"
            "compat=$COMPAT_RESULT"
            "quality=$QUALITY_RESULT"
            "integration=$INTEGRATION_RESULT"
            "race=$RACE_RESULT"
            "cross=$CROSS_RESULT"
            "freebsd=$FREEBSD_RESULT"
            "windows-runtime=$WINDOWS_RUNTIME_RESULT"
            "windows-tools=$WINDOWS_TOOLS_RESULT"
            "submissions=$SUBMISSIONS_RESULT"
          )
          printf '上游 job 结果：%s\n' "${summary[*]}"
          for item in "${summary[@]}"; do
            if [[ "${item#*=}" != "success" ]]; then
              printf '有 job 未通过：%s\n' "${summary[*]}" >&2
              exit 1
            fi
          done
          echo "全部通过"
