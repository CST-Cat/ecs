name: ci

# 这个 commit 能不能进 main？
#
# 只回答这一个问题。定时外网监控在 live.yml，排行榜写回在 leaderboard.yml，
# 发布后安全复审在 security.yml，发布在 release.yml。把它们混在一起的后果是
# 第三方接口限流会让普通代码检查变红，而红灯一旦常态化就没人再看。
#
# Go 工具链版本只来自 go.mod。这里不写任何版本号，升级 Go 只需改 go.mod 一行。
# 注意不要设置 GOTOOLCHAIN=local：setup-go 靠读 go.mod 决定装哪个补丁版。

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 行为：程序做的事对不对。
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      # 翻译覆盖率用当前报告样本；样本缺失时测试回落到当前 renderer contract。
      - name: Unit and parser tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # 静态规则、源码安全、格式、数据契约。与 release preflight 是同一个脚本。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: ./scripts/ci/check.sh

  # 与真实基准工具的集成。工具由脚本自己装齐，装什么不写在 YAML 里。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: ./scripts/ci/integration.sh

  # 并发问题。
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...

  # 七个发布架构现在都编得过吗。
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: ./scripts/cross.sh

  # 跑分提交校验：格式合法、指纹自洽、不与已有记录重复。指纹由内容派生，
  # 手改数值而不重算会被当场发现。只读：写权限属于 leaderboard.yml。
  submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate submissions
        env:
          ECS_SUBMISSION_DIR: submissions
        run: go test ./internal/score/ -run TestSubmissionCorpus -v

      # 离群检测只标记不阻断：可能是新硬件或特殊配置，由维护者判断。
      # --annotate 把结果转成 GitHub 检查注解，直接显示在检查页面上。
      - name: Check for outliers
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --annotate --verbose \
              --output /tmp/baseline-check.json \
              submissions
          else
            echo "当前没有排行榜提交，跳过离群检测"
          fi

  # branch protection 的单点引用：加新 job 时只改这里的 needs，
  # 不必去仓库设置里逐个勾选。
  required:
    if: always()
    needs: [unit, quality, integration, race, cross, submissions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "上游 job 结果：$RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "有 job 未通过：$RESULTS" >&2
              exit 1
            fi
          done
          echo "全部通过"
