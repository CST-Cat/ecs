name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # 实网测试按天跑，不挂在普通主分支检查上：第三方限流或改版会让每次代码检查变红，
  # 那只会训练所有人忽略红灯。
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      rebuild_tools:
        description: "Run the full seven-architecture tools build without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A tag run may be the only build producing release assets. Never cancel it
  # automatically; branch and PR runs remain replaceable by newer commits.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Unit and parser tests
        run: >-
          go test
          -skip 'TestRunFIOD1LatencyWithRealFIO|TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestExecuteSysbenchCPUUsesStableOfficialWorkload|TestRunSysbenchWithRealBinary|TestRunStreamWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...
      # 翻译覆盖率使用当前报告样本；样本缺失时测试使用当前 renderer contract，
      # 不把已删除样本重新作为测试目标。
      - name: i18n coverage
        if: matrix.go == 'stable'
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: |
          go test ./internal/report/ -run '^TestLocalizeCoversRealReports$' -v
          go test ./internal/i18n/ -v
      - run: go vet ./...
      - run: go build ./cmd/ecs
      - run: sh -n install.sh
      - run: sh -n run.sh
      - run: bash -n scripts/package.sh
      - run: bash -n scripts/build_tools.sh

  # Tag 发布先判断工具构建输入是否相对上一个稳定 Release 发生变化。
  # 未变化时由 release job 校验并复用旧工具包；变化时才进行七架构完整编译。
  tools_plan:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race, cross]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.plan.outputs.rebuild }}
      source_tag: ${{ steps.plan.outputs.source_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag target and choose tools source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          main_commit=$(git rev-parse refs/remotes/origin/main)
          test "$tag_commit" = "$main_commit" || {
            echo "release tag $GITHUB_REF_NAME ($tag_commit) is not remote main ($main_commit)" >&2
            exit 1
          }

          previous_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "$GITHUB_REF_NAME" ]] && continue
            if gh release view "$candidate" --json isDraft,isPrerelease 2>/dev/null |
              jq -e '.isDraft == false and .isPrerelease == false' >/dev/null; then
              previous_tag=$candidate
              break
            fi
          done < <(git tag --merged "$tag_commit" --list 'v*' --sort=-version:refname)

          if [[ -z "$previous_tag" ]]; then
            echo "No earlier stable release; tools must be built."
            echo "rebuild=true" >>"$GITHUB_OUTPUT"
            echo "source_tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          tool_inputs=(
            .github/workflows/ci.yml
            scripts/build_tools.sh
            scripts/package.sh
            cmd/tools-manifest-check
            internal/toolsmanifest
            LICENSE
            NOTICE
          )
          if ! git diff --quiet "$previous_tag" "$GITHUB_REF_NAME" -- "${tool_inputs[@]}"; then
            echo "Tool build inputs changed since $previous_tag; rebuilding."
            echo "rebuild=true" >>"$GITHUB_OUTPUT"
            echo "source_tag=$previous_tag" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          remote_assets=$(gh release view "$previous_tag" --json assets --jq '.assets[].name')
          expected_assets=(checksums.txt)
          for arch in amd64 arm64 armv7 386 s390x riscv64 ppc64le; do
            expected_assets+=("ecs-tools_linux_${arch}.tar.zst")
          done
          for asset in "${expected_assets[@]}"; do
            if ! grep -F -x "$asset" <<<"$remote_assets" >/dev/null; then
              echo "$previous_tag is missing $asset; rebuilding tools." >&2
              echo "rebuild=true" >>"$GITHUB_OUTPUT"
              echo "source_tag=$previous_tag" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Tool inputs are unchanged; reusing verified assets from $previous_tag."
          echo "rebuild=false" >>"$GITHUB_OUTPUT"
          echo "source_tag=$previous_tag" >>"$GITHUB_OUTPUT"

  # amd64/arm64 使用对应的 GitHub 原生硬件，386 使用 x86-64 的原生 32 位兼容执行。
  # ARMv7 在 ARM64 上用原生交叉编译器构建，仅最终 smoke 使用 qemu-arm；其余架构
  # 仍在目标 userspace/QEMU 中构建。任何下载、编译、smoke 或 manifest 失败都会失败。
  tools:
    if: >-
      always() &&
      needs.test.result == 'success' && needs.race.result == 'success' && needs.cross.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.tools_plan.result == 'success' && needs.tools_plan.outputs.rebuild == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.rebuild_tools))
    needs: [test, race, cross, tools_plan]
    name: tools (${{ matrix.arch }}, ${{ matrix.build_mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            runner_arch: x86_64
            platform: linux/amd64
            image: debian:trixie
            build_mode: native
            emulated: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: arm64
            platform: linux/arm64
            image: debian:trixie
            build_mode: native
            emulated: false
          - arch: armv7
            runner: ubuntu-24.04-arm
            runner_arch: arm64
            platform: linux/arm64
            image: debian:trixie
            build_mode: cross-armv7
            emulated: false
          - arch: "386"
            runner: ubuntu-24.04
            runner_arch: x86_64
            platform: linux/386
            image: debian:trixie
            build_mode: native-compat
            emulated: false
          - arch: s390x
            runner: ubuntu-24.04
            runner_arch: x86_64
            platform: linux/s390x
            image: debian:trixie
            build_mode: target-qemu
            emulated: true
            qemu_platform: s390x
          - arch: riscv64
            runner: ubuntu-24.04
            runner_arch: x86_64
            platform: linux/riscv64
            image: debian:trixie
            build_mode: target-qemu
            emulated: true
            qemu_platform: riscv64
          - arch: ppc64le
            runner: ubuntu-24.04
            runner_arch: x86_64
            platform: linux/ppc64le
            image: debian:sid
            build_mode: target-qemu
            emulated: true
            qemu_platform: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.emulated == true
        with:
          platforms: ${{ matrix.qemu_platform }}
      - name: Verify runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          actual=$(uname -m)
          case "$EXPECTED_RUNNER_ARCH:$actual" in
            x86_64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *)
              echo "expected $EXPECTED_RUNNER_ARCH runner, got $actual" >&2
              exit 1
              ;;
          esac
      - name: Prepare stage directories
        run: mkdir -p .ci-tools-stage artifact
      - name: Build and verify real tools in target container
        if: matrix.build_mode != 'cross-armv7'
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --platform='${{ matrix.platform }}' \
            --security-opt seccomp=unconfined \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/.ci-tools-stage,target=/stage" \
            --workdir /src \
            --env ARCH \
            --env GITHUB_TOKEN \
            '${{ matrix.image }}' \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                autoconf automake binutils build-essential ca-certificates curl \
                git jq libaio-dev libck-dev libluajit-5.1-dev libtool libtool-bin meson ninja-build pkg-config \
                zlib1g-dev
              scripts/build_tools.sh --arch "$ARCH" --stage-root /stage
            '
      - name: Cross-build ARMv7 and smoke with qemu-arm
        if: matrix.build_mode == 'cross-armv7'
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --platform='${{ matrix.platform }}' \
            --security-opt seccomp=unconfined \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/.ci-tools-stage,target=/stage" \
            --workdir /src \
            --env ARCH \
            --env GITHUB_TOKEN \
            '${{ matrix.image }}' \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              dpkg --add-architecture armhf
              apt-get update
              apt-get install -y --no-install-recommends \
                autoconf automake binutils build-essential ca-certificates curl git jq \
                libtool libtool-bin meson ninja-build pkg-config qemu-user-static \
                binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
                libaio-dev:armhf libck-dev:armhf libluajit-5.1-dev:armhf zlib1g-dev:armhf
              export PKG_CONFIG_PATH=
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export STREAM_NT_THREADS=2
              scripts/build_tools.sh \
                --arch "$ARCH" \
                --stage-root /stage \
                --cross-prefix arm-linux-gnueabihf- \
                --target-runner qemu-arm-static
            '
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate generated manifest with ECS parsers
        # The real six-tool smoke tests already ran inside the architecture
        # Docker container. Its binaries are not installed on this host
        # runner, so skip only tests that require host-installed tools while
        # running all manifest, parser, and renderer tests here.
        run: |
          go test \
            -skip 'TestRunFIOD1LatencyWithRealFIO|TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestExecuteSysbenchCPUUsesStableOfficialWorkload|TestRunSysbenchWithRealBinary|TestRunStreamWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback' \
            ./internal/toolsmanifest ./internal/app ./internal/probe ./internal/report

          go run ./cmd/tools-manifest-check \
            --architecture '${{ matrix.arch }}' \
            ".ci-tools-stage/linux_${{ matrix.arch }}/manifest.json"
          jq -e --arg arch '${{ matrix.arch }}' '
            .architecture == $arch and (.tools | length == 6) and
            (.build.toolchain_mode == (if $arch == "armv7" then "cross" else "native" end)) and
            (.build.smoke_runner == (if $arch == "armv7" then "qemu-arm-static" else "direct" end)) and
            (all(.tools[]; .architecture == $arch and (.sha256 | test("^[0-9A-Fa-f]{64}$"))))
          ' ".ci-tools-stage/linux_${{ matrix.arch }}/manifest.json"
      - name: Preserve architecture directory in artifact
        run: cp -a ".ci-tools-stage/linux_${{ matrix.arch }}" artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: ecs-tools-stage-${{ matrix.arch }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # 跑分提交校验：新增提交必须格式合法、指纹自洽、不与已有记录重复。
  # 指纹由内容派生，因此手改数值而不重算会被当场发现。
  submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate submissions
        run: go test ./internal/score/ -run TestSubmissionCorpus -v
        env:
          ECS_SUBMISSION_DIR: submissions

      # 离群检测只标记不阻断：可能是新硬件或特殊配置，由维护者判断。
      # --annotate 把结果转成 GitHub 检查注解，直接显示在检查页面上。
      - name: Check for outliers
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --annotate --verbose \
              --output /tmp/baseline-check.json \
              submissions
          else
            echo "当前没有排行榜提交，跳过离群检测"
          fi

      # 排行榜参考重建只在主分支 push 做：检查阶段不改工作区，避免把生成文件
      # 混进正在审核的代码变更。
      - name: Rebuild leaderboard reference
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if find submissions -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit | grep -q .; then
            go run ./cmd/ecs baseline \
              --source "社区提交聚合" \
              --output submissions/baseline.json \
              submissions
            # 排行榜参考随二进制发布，因此同步写进内嵌副本。
            cp submissions/baseline.json internal/score/embedded/baseline.json
            go build ./... && go test ./internal/score/
          else
            echo "当前没有排行榜提交，保持无基线状态"
          fi

      - name: Commit rebuilt leaderboard reference
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- submissions/baseline.json internal/score/embedded/baseline.json; then
            echo "排行榜参考无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/baseline.json internal/score/embedded/baseline.json
          git commit -m "CI：按最新提交重建排行榜参考"
          git push

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Race tests
        run: >-
          go test -race
          -skip 'TestRunFIOD1LatencyWithRealFIO|TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestExecuteSysbenchCPUUsesStableOfficialWorkload|TestRunSysbenchWithRealBinary|TestRunStreamWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make cross

  # 实网协议/解析检查：确认第三方数据源与公共服务的当前响应仍能解析。
  # 只在定时任务与手动触发时运行；普通 push 不触发外部网络请求。
  live:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.rebuild_tools != true)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Live upstream protocol checks
        run: >-
          go test -tags=live ./internal/probe/
          -run '^TestLive(IPLookup|IPQualityProviders|CommunityGateway|MediaStrongRules|IPerfNodeReachability|STUNServers)$'
          -v -timeout 20m

  release:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.tools_plan.result == 'success' &&
      (needs.tools.result == 'success' || needs.tools.result == 'skipped')
    needs: [tools_plan, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Verify release tag is exactly remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Download verified tools stages
        if: needs.tools_plan.outputs.rebuild == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ecs-tools-stage-*
          path: tools-artifacts
          merge-multiple: false
      - name: Normalize verified tools stages
        if: needs.tools_plan.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools-stage
          for arch in amd64 arm64 armv7 386 s390x riscv64 ppc64le; do
            source_dir="tools-artifacts/ecs-tools-stage-${arch}/linux_${arch}"
            target_dir="tools-stage/linux_${arch}"
            test -d "$source_dir"
            mkdir -p "$target_dir"
            cp -a "$source_dir/." "$target_dir/"
            chmod +x "$target_dir/bin/"*
          done
      - name: Check all tools stages before packaging
        if: needs.tools_plan.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64 armv7 386 s390x riscv64 ppc64le; do
            test -s "tools-stage/linux_${arch}/manifest.json"
            test -x "tools-stage/linux_${arch}/bin/sysbench"
            test -x "tools-stage/linux_${arch}/bin/stream"
            test -x "tools-stage/linux_${arch}/bin/fio"
            test -x "tools-stage/linux_${arch}/bin/iperf3"
            test -x "tools-stage/linux_${arch}/bin/nexttrace-tiny"
            test -x "tools-stage/linux_${arch}/bin/ping"
            test -d "tools-stage/linux_${arch}/LICENSES"
          done
      - name: Build release assets
        env:
          REBUILD_TOOLS: ${{ needs.tools_plan.outputs.rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1
          zstd --version
          chmod +x scripts/package.sh
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          if [[ "$REBUILD_TOOLS" == "true" ]]; then
            scripts/package.sh "${GITHUB_REF_NAME#v}" --tools-stage tools-stage
          else
            scripts/package.sh "${GITHUB_REF_NAME#v}"
          fi
      - name: Reuse and verify unchanged tools archives
        if: needs.tools_plan.outputs.rebuild != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.tools_plan.outputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TAG"
          mkdir reused-tools
          gh release download "$SOURCE_TAG" --dir reused-tools \
            --pattern 'ecs-tools_linux_*.tar.zst' \
            --pattern checksums.txt

          expected_tools=()
          for arch in amd64 arm64 armv7 386 s390x riscv64 ppc64le; do
            expected_tools+=("ecs-tools_linux_${arch}.tar.zst")
          done
          for asset in "${expected_tools[@]}"; do
            test -s "reused-tools/$asset"
          done
          grep -E '^[0-9A-Fa-f]{64}  ecs-tools_linux_(amd64|arm64|armv7|386|s390x|riscv64|ppc64le)\.tar\.zst$' \
            reused-tools/checksums.txt >reused-tools/tools-checksums.txt
          test "$(wc -l <reused-tools/tools-checksums.txt)" -eq 7
          (cd reused-tools && sha256sum -c tools-checksums.txt)
          cp reused-tools/ecs-tools_linux_*.tar.zst dist/

      - name: Finalize checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum ecs_*.tar.gz ecs-tools_*.tar.zst >checksums.txt
          )
      - name: Check release assets before upload
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            ecs_linux_386.tar.gz
            ecs_linux_amd64.tar.gz
            ecs_linux_arm64.tar.gz
            ecs_linux_armv7.tar.gz
            ecs_linux_ppc64le.tar.gz
            ecs_linux_riscv64.tar.gz
            ecs_linux_s390x.tar.gz
            ecs-tools_linux_386.tar.zst
            ecs-tools_linux_amd64.tar.zst
            ecs-tools_linux_arm64.tar.zst
            ecs-tools_linux_armv7.tar.zst
            ecs-tools_linux_ppc64le.tar.zst
            ecs-tools_linux_riscv64.tar.zst
            ecs-tools_linux_s390x.tar.zst
          )
          for asset in "${assets[@]}"; do
            test -s "dist/$asset"
          done
          test -s dist/checksums.txt
          test "$(wc -l <dist/checksums.txt)" -eq "${#assets[@]}"
          for asset in "${assets[@]}"; do
            grep -F "  $asset" dist/checksums.txt >/dev/null
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep an incomplete upload private. It is published only after every
          # expected asset is present and remotely visible. A retried job may
          # safely resume its own draft after an interrupted asset upload.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/ecs_linux_386.tar.gz \
            dist/ecs_linux_amd64.tar.gz \
            dist/ecs_linux_arm64.tar.gz \
            dist/ecs_linux_armv7.tar.gz \
            dist/ecs_linux_ppc64le.tar.gz \
            dist/ecs_linux_riscv64.tar.gz \
            dist/ecs_linux_s390x.tar.gz \
            dist/ecs-tools_linux_386.tar.zst \
            dist/ecs-tools_linux_amd64.tar.zst \
            dist/ecs-tools_linux_arm64.tar.zst \
            dist/ecs-tools_linux_armv7.tar.zst \
            dist/ecs-tools_linux_ppc64le.tar.zst \
            dist/ecs-tools_linux_riscv64.tar.zst \
            dist/ecs-tools_linux_s390x.tar.zst \
            dist/checksums.txt \
            --clobber
          expected_assets=(
            checksums.txt
            ecs_linux_386.tar.gz
