name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # 实网测试按天跑，不挂在 push/PR 上：第三方限流或改版会让每个 PR 变红，
  # 那只会训练所有人忽略红灯。
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # 标准基准适配器的测试跑真实的 fio / sysbench / iperf3，不使用脚本替身。
      # 替身只能证明解析器认得自己造出来的输出，证明不了它认得工具的真实输出。
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench iperf3 traceroute
          fio --version && sysbench --version && iperf3 --version | head -1
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ecs
      - run: sh -n install.sh
      - run: bash -n scripts/package.sh

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench iperf3 traceroute
      - run: go test -race ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make cross

  # 实网测试：真实调用第三方数据源与公共 iperf3 节点，确认上游格式没变、链路还在。
  # 只在定时任务与手动触发时运行；固定样本永远发现不了 check.place 全线 403
  # 或节点域名不存在这类问题。
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench iperf3 traceroute
      - name: Live upstream checks
        run: go test -tags=live ./internal/probe/ -run TestLive -v -timeout 20m

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build release assets
        shell: bash
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/ecs_* dist/checksums.txt
