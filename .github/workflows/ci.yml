name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # 实网测试按天跑，不挂在 push/PR 上：第三方限流或改版会让每个 PR 变红，
  # 那只会训练所有人忽略红灯。
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # 真实外部工具端到端测试集中在 benchmark job，避免 1.22/stable
      # 矩阵和 race 再重复跑完整 fio/ATTO、sysbench 与 iperf3。
      - name: Unit and parser tests
        run: >-
          go test
          -skip 'TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestRunSysbenchWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...
      - name: Install i18n benchmark tools
        if: matrix.go == 'stable'
        run: |
          # memory 报告需要真实 sysbench 输出；mbw 是可选补充口径，发行版有包时一并覆盖。
          sudo apt-get update -qq
          sudo apt-get install -y -qq sysbench
          if apt-cache show mbw >/dev/null 2>&1; then
            sudo apt-get install -y -qq mbw
          fi
      # 翻译覆盖率：跑一遍真实模块产出报告，再检查英文渲染后是否还有中文。
      # 用真实产出而不是源码字面量——源码里大量分支从不触发。
      - name: i18n coverage
        if: matrix.go == 'stable'
        run: |
          mkdir -p /tmp/i18n-samples
          # 内存报告足以覆盖结果、状态、说明和 JSON 翻译；刻意不选 disk，
          # 也不选带宿主机 CPU-steal 动态说明的 cpu，避免矩阵里的压测与
          # 非确定性文本。缺少基准工具时报告仍会记录可见的降级状态，翻译覆盖
          # 依然检查真实落盘 JSON。
          go run ./cmd/ecs --profile quick --exposure local --only memory \
            --cpu-time 1s --disk-mib 32 --format json --output /tmp/i18n-samples --no-color
          ECS_I18N_SAMPLES=/tmp/i18n-samples go test ./internal/report/ -run TestLocalizeCovers -v
          # 再直接扫一遍英文 JSON：翻译覆盖的是渲染层，这里确认落盘文件本身也没有中文。
          go run ./cmd/ecs --lang en --profile quick --exposure local --only memory \
            --cpu-time 1s --disk-mib 32 --format json --output /tmp/i18n-en --no-color
          python3 - <<'SCAN'
          import json,glob,re,sys
          han=re.compile(r'[\u4e00-\u9fff]'); bad=[]
          for f in glob.glob('/tmp/i18n-en/*.json'):
              d=json.load(open(f))
              def walk(o,path=''):
                  if isinstance(o,dict):
                      for k,v in o.items(): walk(v,path+'.'+k)
                  elif isinstance(o,list):
                      for i,v in enumerate(o): walk(v,path+f'[{i}]')
                  elif isinstance(o,str) and han.search(o):
                      if '.text_blocks[' in path and path.endswith('.content'): return
                      bad.append((path,o[:80]))
              walk(d)
          if bad:
              print(f'英文 JSON 里有 {len(bad)} 处中文:')
              for p,v in bad: print('  ',p,':',v)
              sys.exit(1)
          print('英文 JSON 零中文残留')
          SCAN
      - run: go vet ./...
      - run: go build ./cmd/ecs
      - run: sh -n install.sh
      - run: sh -n run.sh
      - run: bash -n scripts/package.sh

  # 跑分提交校验：PR 里新增的提交必须格式合法、指纹自洽、不与已有记录重复。
  # 指纹由内容派生，因此手改数值而不重算会被当场发现。
  submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Validate submissions
        run: go test ./internal/score/ -run TestSubmissionCorpus -v
        env:
          ECS_SUBMISSION_DIR: submissions

      # 离群检测只标记不阻断：可能是新硬件或特殊配置，由维护者判断。
      # --annotate 把结果转成 GitHub 注解，直接显示在 PR 页面上。
      - name: Check for outliers
        run: |
          go run ./cmd/ecs baseline \
            --annotate --verbose \
            --output /tmp/baseline-check.json \
            submissions

      # 基线重建只在主分支做：PR 上重建会让每个 PR 都带一个 baseline.json 改动，
      # 互相冲突且掩盖真正的提交内容。
      - name: Rebuild baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          go run ./cmd/ecs baseline \
            --source "社区提交聚合" \
            --output submissions/baseline.json \
            submissions
          # 基线随二进制发布，因此同步写进内嵌副本。
          cp submissions/baseline.json internal/score/embedded/baseline.json
          go build ./... && go test ./internal/score/

      - name: Commit rebuilt baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- submissions/baseline.json internal/score/embedded/baseline.json; then
            echo "基线无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/baseline.json internal/score/embedded/baseline.json
          git commit -m "CI：按最新提交重建评分基线"
          git push

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Race tests
        run: >-
          go test -race
          -skip 'TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestRunSysbenchWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback'
          ./...

  # 真实标准工具端到端测试只跑一次：完整 fio/ATTO、sysbench、iperf3、
  # loopback ping 与 traceroute 仍是质量门禁，但不再乘以 Go/race 矩阵。
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench iperf3 traceroute iputils-ping
          fio --version && sysbench --version && iperf3 --version | head -1
      - name: Real benchmark adapter tests
        run: >-
          go test ./internal/probe/ -count=1 -v -timeout 20m
          -run '^(TestDetectFIOEngineAgreesWithEnghelp|TestRunFIODiskWithRealFIO|TestRunSysbenchWithRealBinary|TestRunIPerfWithRealServer|TestRunIPerfUDPWithRealServer|TestRunICMPPingAgainstLoopback|TestRouteEngineTracesLoopback)$'

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: make cross

  # 实网测试：真实调用第三方数据源与公共 iperf3 节点，确认上游格式没变、链路还在。
  # 只在定时任务与手动触发时运行；固定样本永远发现不了 check.place 全线 403
  # 或节点域名不存在这类问题。
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install benchmark tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio sysbench iperf3 traceroute
      - name: Live upstream checks
        run: go test -tags=live ./internal/probe/ -run TestLive -v -timeout 20m

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race, benchmark, cross]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build release assets
        shell: bash
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/ecs_* dist/checksums.txt
