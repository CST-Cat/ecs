name: security

# 已经发布的东西，在今天的漏洞知识下是否仍然安全？
#
# 与 release.yml 的 security job 是两回事，区别在时间而不是手段：
#
#   release security  发布前门禁 —— 候选制品现在安全吗？跑在每次发布。
#   本 workflow        发布后监控 —— 已发布的东西今天还安全吗？每天跑。
#
# 漏洞库每天都在更新，昨天干净的二进制今天可能已经不干净了。用户手上跑的是
# Release 上的那些文件，所以复审的对象必须是它们，而不是今天的 main。
#
# 发现问题后的处理分两类，finding 与执行错误的边界必须分开：
#
#   source 的 govulncheck exit 3（普通 finding）
#     -> 只发 warning；工具、网络、命令或其它扫描错误仍然让 job 失败。
#   released 的 finding（包括 triage 判定为 vulnerable=true 的结果）
#     -> 只发 warning，不冻结普通开发或 Release；仍保存 JSON、运行 triage，
#        并且只有 OSV 建议的 Go 修复版已在官方稳定 release 列表中时才允许 propose。
#   release.yml 的 security job 仍是发布前候选制品的正式安全门禁。
#
# 判定逻辑在 scripts/security/triage.py，不在这个 YAML 里。
# released 的 warning 不是成功掩盖：JSON artifact、triage 输出和自动升级条件仍
# 可审计；但已发布 finding 本身不再用 exit 1 把日常开发或发布冻结。

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  # 当前 main 的源码。普通 finding 只告警；扫描器、网络或命令错误才阻断 job。
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # 根 go.mod 的最低支持版本不决定安全扫描所用的现代 Go；分析工具
          # 继续由 devtools/go.mod 独立管理，源码扫描使用当前稳定版。
          go-version: stable
          cache: false
      - name: Scan current source
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          govulncheck=$(ecs_devtool govulncheck)
          if "$govulncheck" ./...; then
            :
          else
            status=$?
            case "$status" in
              3)
                echo "::warning::govulncheck 发现源码漏洞（exit 3）；源码安全扫描仅告警，不阻断 job。"
                ;;
              *)
                echo "govulncheck 源码扫描失败（exit $status）" >&2
                exit "$status"
                ;;
            esac
          fi

  # 已发布的七架构二进制。它是发布后监控：下载、扫描、保存 JSON 并 triage；
  # finding 只告警，不以 finding 冻结普通开发或 Release。
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released_tag: ${{ steps.scan.outputs.released_tag }}
      vulnerable: ${{ steps.triage.outputs.vulnerable }}
      upgrade_to: ${{ steps.triage.outputs.upgrade_to }}
      upgrade_released: ${{ steps.release_gate.outputs.released }}
      reason: ${{ steps.triage.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # 与 source 一样显式使用当前稳定版；govulncheck 的现代工具链由
          # devtools/go.mod 独立管理，不从根 go.mod 读取版本。
          go-version: stable
          cache: false

      - name: Scan the latest published release
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/security/scan_released.sh --work-dir "$RUNNER_TEMP/released" \
            | tee -a "$GITHUB_OUTPUT"

      # scan_released.sh 为了继续 triage 会接住 release/security.sh 的退出码；
      # 这里恢复执行错误的 hard-fail 语义。明确严重且可达的 finding 是
      # release_security_result=blocked，只告警并继续 triage，不在发布后监控中阻断。
      - name: Fail on release scan execution errors
        if: steps.scan.outputs.release_security_result == 'fatal' || steps.scan.outputs.release_security_result == ''
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.release_security_result }}
        run: |
          echo "已发布二进制扫描执行失败（release_security_result=${SCAN_RESULT:-missing}）" >&2
          exit 1

      # triage 决定这批命中能不能靠升 Go 补丁机械修好。它不改任何文件。
      - name: Triage findings
        id: triage
        run: |
          set -euo pipefail
          findings=("$RUNNER_TEMP/released/findings"/*.json)
          ./scripts/security/triage.py \
            --current "$(go env GOVERSION)" \
            "${findings[@]}" | tee -a "$GITHUB_OUTPUT"

      # OSV 的 fixed 版本只说明漏洞数据库认为该版本修复了问题，不代表
      # 该 Go 版本已经正式发布。go.dev/dl/?mode=json 返回官方稳定 release
      # 列表；查询或解析失败都保持默认 false，不能因此放行 propose。
      - name: Check whether the proposed Go release exists
        id: release_gate
        if: always()
        env:
          UPGRADE_TO: ${{ steps.triage.outputs.upgrade_to }}
        run: |
          set -euo pipefail
          echo 'released=false' >> "$GITHUB_OUTPUT"

          if [[ -z "$UPGRADE_TO" ]]; then
            exit 0
          fi

          if curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 30 \
            'https://go.dev/dl/?mode=json' \
            | jq -e --arg target "go${UPGRADE_TO}" \
              'any(.[]; .version == $target and .stable == true)' >/dev/null
          then
            sed -i 's/^released=false$/released=true/' "$GITHUB_OUTPUT"
          else
            echo "未确认 Go $UPGRADE_TO 已正式发布，跳过自动升级 PR。" >&2
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: released-binary-findings
          path: ${{ runner.temp }}/released/findings
          if-no-files-found: warn
          retention-days: 30

      # 这是发布后监控，不是发布前门禁：任意 vulnerable finding 只产生 warning，
      # 不用 exit 1 冻结普通开发或 Release。能自动修的仍会在下面的正式版本门槛
      # 通过后开出 PR；在 PR 合并并发布前，warning 会保留在这次运行中。
      #
      # triage 的输出经 env 传入，不用 ${{ }} 直接拼进命令行：reason 里含有
      # 来自 Go 漏洞数据库的 OSV 记录，那是外部数据，不该有机会被 shell 解析。
      - name: Warn when published binaries are vulnerable
        if: steps.triage.outputs.vulnerable == 'true'
        env:
          RELEASED_TAG: ${{ steps.scan.outputs.released_tag }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          echo "::warning title=Published release vulnerability::已发布的 $RELEASED_TAG 存在已知漏洞：$REASON"

  # 唯一带写权限的 job，而且只做 sed + commit + PR：不编译、不跑容器、
  # 不调用第三方工具。写权限的暴露面被压到最小。
  propose:
    if: always() && needs.released.outputs.upgrade_to != '' && needs.released.outputs.upgrade_released == 'true'
    needs: [released]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # upgrade_to 与 reason 都派生自 Go 漏洞数据库的 OSV 记录——外部数据。
      # 经 env 传给脚本而不是 ${{ }} 拼进命令行：脚本里的格式校验发生在 shell
      # 解析之后，挡不住注入，而这是本 workflow 唯一持有写权限的 job。
      - name: Propose the Go toolchain upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_TO: ${{ needs.released.outputs.upgrade_to }}
          REASON: ${{ needs.released.outputs.reason }}
        run: ./scripts/security/propose_go_upgrade.sh --to "$UPGRADE_TO" --reason "$REASON"
