name: security

# 已经发布的东西，在今天的漏洞知识下是否仍然安全？
#
# 与 release.yml 的 security job 是两回事，区别在时间而不是手段：
#
#   release security  发布前门禁 —— 候选制品现在安全吗？跑在每次发布。
#   本 workflow        发布后监控 —— 已发布的东西今天还安全吗？每天跑。
#
# 漏洞库每天都在更新，昨天干净的二进制今天可能已经不干净了。用户手上跑的是
# Release 上的那些文件，所以复审的对象必须是它们，而不是今天的 main。
#
# 发现问题后的处理分两类：
#
#   Go stdlib/runtime 且官方已在同系列给出修复版
#     -> 开一个只改 go.mod 一行的 PR。人合并、打 tag，走常规 release.yml。
#   其余全部（ecs 源码、第三方依赖、跨小版本才有修复、库里还没修）
#     -> 让 workflow 红着，交给人判断。
#
# 判定逻辑在 scripts/security/triage.py，不在这个 YAML 里。

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  # 当前 main 的源码。它红了说明"下一次发布会带着这个问题"。
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan current source
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          govulncheck=$(ecs_devtool govulncheck)
          "$govulncheck" ./...

  # 已发布的七架构二进制。它红了说明"用户手上正在跑的东西有问题"。
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released_tag: ${{ steps.scan.outputs.released_tag }}
      vulnerable: ${{ steps.triage.outputs.vulnerable }}
      upgrade_to: ${{ steps.triage.outputs.upgrade_to }}
      reason: ${{ steps.triage.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan the latest published release
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/security/scan_released.sh --work-dir "$RUNNER_TEMP/released" \
            | tee -a "$GITHUB_OUTPUT"

      # triage 决定这批命中能不能靠升 Go 补丁机械修好。它不改任何文件。
      - name: Triage findings
        id: triage
        run: |
          set -euo pipefail
          findings=("$RUNNER_TEMP/released/findings"/*.json)
          ./scripts/security/triage.py \
            --current "$(go env GOVERSION)" \
            "${findings[@]}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: released-binary-findings
          path: ${{ runner.temp }}/released/findings
          if-no-files-found: warn
          retention-days: 30

      # 有漏洞就让这个 job 红。能自动修的会同时开出 PR，但红灯不能因此消失：
      # 在 PR 合并并发布之前，用户手上的二进制依然是有问题的那一份。
      #
      # triage 的输出经 env 传入，不用 ${{ }} 直接拼进命令行：reason 里含有
      # 来自 Go 漏洞数据库的 OSV 记录，那是外部数据，不该有机会被 shell 解析。
      - name: Fail when published binaries are vulnerable
        if: steps.triage.outputs.vulnerable == 'true'
        env:
          RELEASED_TAG: ${{ steps.scan.outputs.released_tag }}
          REASON: ${{ steps.triage.outputs.reason }}
        run: |
          echo "已发布的 $RELEASED_TAG 存在已知漏洞：$REASON" >&2
          exit 1

  # 唯一带写权限的 job，而且只做 sed + commit + PR：不编译、不跑容器、
  # 不调用第三方工具。写权限的暴露面被压到最小。
  propose:
    if: always() && needs.released.outputs.upgrade_to != ''
    needs: [released]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # upgrade_to 与 reason 都派生自 Go 漏洞数据库的 OSV 记录——外部数据。
      # 经 env 传给脚本而不是 ${{ }} 拼进命令行：脚本里的格式校验发生在 shell
      # 解析之后，挡不住注入，而这是本 workflow 唯一持有写权限的 job。
      - name: Propose the Go toolchain upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_TO: ${{ needs.released.outputs.upgrade_to }}
          REASON: ${{ needs.released.outputs.reason }}
        run: ./scripts/security/propose_go_upgrade.sh --to "$UPGRADE_TO" --reason "$REASON"
