name: freebsd-tools

# 正式生产 workflow：FreeBSD 工具链 CI 编排层（静态检查 + 双链调用）。
#
# 结构（编排只做依赖关系，构建逻辑全在 scripts/ 与 reusable workflows）：
#   legacy-absent / linux-static / workflow-static（独立静态检查）
#   → chain-amd64 ∥ chain-arm64：并行调用 .github/workflows/freebsd-chain.yml
#     （target=freebsd_amd64 / freebsd_arm64），两条链互不等待；链实现到
#     VERIFY 为止。之后 real-gate-amd64 ∥ real-gate-arm64 调用
#     freebsd-gate.yml。Bundle 调用时，PACKAGE 与两个 REAL GATE 并行，随后
#     ARTIFACT E2E 继续并行消费 PACKAGE 的布局。
#
# 所有构建都在 ubuntu-24.04 amd64 宿主交叉完成，无 VM 参与 builder；
# 永久禁止：FreeBSD VM builder。
#
# 触发只有 workflow_dispatch 与 workflow_call。workflow_dispatch 只构建并
# 验收工具链；bundle-release.yml 通过 workflow_call 传入 run_bundle_e2e=true，
# 在同一 run 内追加 PACKAGE/E2E。Linux 工具同样只在发布时构建，FreeBSD
# 不再有独立 push 触发器。

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_bundle_e2e:
        description: 'Build Bundle layouts and run artifact E2E consumers'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: freebsd-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-absent:
    name: legacy builder absent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Assert legacy builder files are gone
        run: |
          set -euo pipefail
          legacy_files=(
            .github/workflows/freebsd-rebuild.yml
            .github/workflows/freebsd-cross-sdk.yml
            scripts/ci/freebsd_tools.sh
            scripts/ci/freebsd_cross_sdk.sh
            scripts/build_tools_freebsd.sh
            scripts/lib/freebsd_tools/core.sh
            scripts/lib/freebsd_tools/extra.sh
            scripts/lib/freebsd_tools/manifest.sh
            scripts/lib/freebsd_tools/common.sh
            tools/freebsd-cross-sdk.lock.json
          )
          failed=0
          for path in "${legacy_files[@]}"; do
            if [[ -e "$path" ]]; then
              echo "legacy file still present: $path" >&2
              failed=1
            else
              echo "absent: $path"
            fi
          done
          if [[ -d scripts/lib/freebsd_tools ]]; then
            echo "legacy lib directory still present: scripts/lib/freebsd_tools" >&2
            failed=1
          fi
          exit "$failed"

      - name: Assert legacy call sites are gone
        run: |
          set -euo pipefail
          patterns=(
            'freebsd_tools\.sh'
            'freebsd_cross_sdk\.sh'
            'build_tools_freebsd\.sh'
            'ECS_FREEBSD_CROSS_SDK'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            if git grep -nE "$pattern" -- . \
              ':!.github/workflows/freebsd-tools.yml' \
              ':!PLAN.md'; then
              echo "legacy call site still present for pattern: $pattern" >&2
              failed=1
            else
              echo "clean: $pattern"
            fi
          done
          exit "$failed"

      - name: Assert Linux builders still refuse FreeBSD targets
        run: |
          set -euo pipefail
          # build_tools.sh / build_tools_container.sh 只构建 Linux，继续显式拒绝
          # freebsd_* 目标；FreeBSD 工具链由本 workflow 的交叉构建链负责。
          grep -q 'FreeBSD tools builder unavailable' scripts/build_tools.sh
          grep -q 'FreeBSD tools builder unavailable' scripts/build_tools_container.sh
          echo 'Linux builders still refuse FreeBSD targets'

  linux-static:
    name: linux static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Run scripts/ci/check.sh
        run: bash scripts/ci/check.sh

  workflow-static:
    name: workflow static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Validate YAML parses
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml >/dev/null
          python3 - <<'PY'
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              sys.exit('PyYAML is required for workflow static checks')

          root = Path('.github/workflows')
          failed = False
          for path in sorted(root.glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:  # noqa: BLE001
                  print(f'FAIL {path}: {exc}', file=sys.stderr)
                  failed = True
              else:
                  print(f'ok {path}')
          sys.exit(1 if failed else 0)
          PY

      - name: Assert no FreeBSD VM builder workflows remain
        run: |
          set -euo pipefail
          if [[ -e .github/workflows/freebsd-cross-sdk.yml ]]; then
            echo 'freebsd-cross-sdk.yml must stay deleted' >&2
            exit 1
          fi
          if [[ -e .github/workflows/freebsd-rebuild.yml ]]; then
            echo 'freebsd-rebuild.yml must stay deleted' >&2
            exit 1
          fi
          mapfile -t freebsd_workflows < <(ls .github/workflows | grep -i freebsd || true)
          for wf in "${freebsd_workflows[@]}"; do
            if [[ "$wf" != 'freebsd-tools.yml' && "$wf" != 'freebsd-chain.yml' && "$wf" != 'freebsd-gate.yml' && "$wf" != 'freebsd-sdk-release.yml' ]]; then
              echo "unexpected FreeBSD workflow present: $wf" >&2
              exit 1
            fi
          done
          echo "freebsd workflows present: ${freebsd_workflows[*]}"

  chain-amd64:
    name: chain freebsd_amd64
    needs: [legacy-absent, linux-static, workflow-static]
    uses: ./.github/workflows/freebsd-chain.yml
    with:
      target: freebsd_amd64

  chain-arm64:
    name: chain freebsd_arm64
    needs: [legacy-absent, linux-static, workflow-static]
    uses: ./.github/workflows/freebsd-chain.yml
    with:
      target: freebsd_arm64

  # VERIFY 通过后才进入 REAL GATE；两个 guest 与 Bundle PACKAGE 互不等待。
  real-gate-amd64:
    name: real gate freebsd_amd64
    needs: [chain-amd64]
    uses: ./.github/workflows/freebsd-gate.yml
    with:
      target: freebsd_amd64

  real-gate-arm64:
    name: real gate freebsd_arm64
    needs: [chain-arm64]
    uses: ./.github/workflows/freebsd-gate.yml
    with:
      target: freebsd_arm64

  # Bundle-only consumer path. It starts after VERIFY (chain-*) and therefore
  # runs in parallel with real-gate-amd64/arm64. The called workflow completes
  # only after both this path and both real gates pass.
  #
  # Bundle 专用消费者路径：只依赖 VERIFY（chain-*），因此与两个 REAL GATE
  # 并行。整个 reusable workflow 只有在两条路径全部通过后才向 caller 返回。
  package:
    if: ${{ inputs.run_bundle_e2e }}
    name: PACKAGE
    needs: [chain-amd64, chain-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Download the verified FreeBSD tools stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ecs-freebsd-tools-stage-*
          path: freebsd-stage-artifacts

      - name: Restore the verified FreeBSD tools stages
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p .ci/freebsd-tools-stage
          for target in "${ECS_FREEBSD_TARGET_IDS[@]}"; do
            source_dir="freebsd-stage-artifacts/ecs-freebsd-tools-stage-${target}"
            stage_dir=".ci/freebsd-tools-stage/${target}"
            test -d "$source_dir/bin"
            test -s "$source_dir/manifest.json"
            mkdir -p "$stage_dir"
            cp -a "$source_dir/." "$stage_dir/"
            # upload-artifact may not preserve executable bits; package.sh
            # restores the release mode after copying the verified bytes.
            chmod -R a+rX "$stage_dir"
          done

      - name: Build the FreeBSD release layouts
        run: |
          set -euo pipefail
          for target in freebsd_amd64 freebsd_arm64; do
            bash scripts/ci/freebsd_artifact_layout.sh \
              --stage-root "$PWD/.ci/freebsd-tools-stage" \
              --layout "$PWD/.ci/freebsd-artifact-layout/${target}" \
              --target "$target"
          done

      - name: Upload the freebsd_amd64 release layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-artifact-layout-freebsd_amd64
          path: .ci/freebsd-artifact-layout/freebsd_amd64
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload the freebsd_arm64 release layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-artifact-layout-freebsd_arm64
          path: .ci/freebsd-artifact-layout/freebsd_arm64
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  artifact-e2e-amd64:
    if: ${{ inputs.run_bundle_e2e }}
    name: ARTIFACT E2E AMD64
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Download the freebsd_amd64 release layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-artifact-layout-freebsd_amd64
          path: .ci/freebsd-artifact-layout/freebsd_amd64

      - name: Start FreeBSD 15.1 VM (artifact consumer)
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: 4
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            # freebsd_vm_prepare.sh/v1 + freebsd-vm-deps.lock/v1
            /bin/sh "$GITHUB_WORKSPACE/scripts/ci/freebsd_vm_prepare.sh"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          /bin/sh "$GITHUB_WORKSPACE/scripts/ci/freebsd_vm_contract.sh" \
            freebsd_amd64 locked-packages
          layout="$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout/freebsd_amd64"
          [ -s "$layout/ecs-release/ecs_freebsd_amd64.tar.gz" ] ||
            { echo 'ECS release line did not reach the guest' >&2; exit 1; }
          [ -s "$layout/bundle-release/ecs-tools_freebsd_amd64.tar.gz" ] ||
            { echo 'bundle release line did not reach the guest' >&2; exit 1; }
          if ! id ecsci >/dev/null 2>&1; then
            pw useradd ecsci -m -s /bin/sh
          fi
          chown -R ecsci:ecsci "$GITHUB_WORKSPACE"
          printf 'target=freebsd_amd64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'phase_contract=ARTIFACT_E2E\n'

      - name: ARTIFACT E2E
        id: artifact_e2e
        timeout-minutes: 120
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_artifact_e2e.sh' \
              --layout '$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout/freebsd_amd64' \
              --target freebsd_amd64"

  artifact-e2e-arm64:
    if: ${{ inputs.run_bundle_e2e }}
    name: ARTIFACT E2E ARM64
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Download the freebsd_arm64 release layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-artifact-layout-freebsd_arm64
          path: .ci/freebsd-artifact-layout/freebsd_arm64

      - name: Start FreeBSD 15.1 VM (artifact consumer)
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: aarch64
          cpu: 4
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            # freebsd_vm_prepare.sh/v1 + freebsd-vm-deps.lock/v1
            /bin/sh "$GITHUB_WORKSPACE/scripts/ci/freebsd_vm_prepare.sh"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          /bin/sh "$GITHUB_WORKSPACE/scripts/ci/freebsd_vm_contract.sh" \
            freebsd_arm64 locked-packages
          layout="$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout/freebsd_arm64"
          [ -s "$layout/ecs-release/ecs_freebsd_arm64.tar.gz" ] ||
            { echo 'ECS release line did not reach the guest' >&2; exit 1; }
          [ -s "$layout/bundle-release/ecs-tools_freebsd_arm64.tar.gz" ] ||
            { echo 'bundle release line did not reach the guest' >&2; exit 1; }
          if ! id ecsci >/dev/null 2>&1; then
            pw useradd ecsci -m -s /bin/sh
          fi
          chown -R ecsci:ecsci "$GITHUB_WORKSPACE"
          printf 'target=freebsd_arm64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'phase_contract=ARTIFACT_E2E\n'

      - name: ARTIFACT E2E
        id: artifact_e2e
        timeout-minutes: 120
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_artifact_e2e.sh' \
              --layout '$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout/freebsd_arm64' \
              --target freebsd_arm64"
