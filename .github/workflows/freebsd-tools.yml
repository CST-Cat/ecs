name: freebsd-tools

on:
  push:
    branches: ["bsd"]
    paths:
      - ".github/workflows/freebsd-tools.yml"
      - ".github/workflows/freebsd-cross-sdk.yml"
      - "scripts/build_tools_freebsd.sh"
      - "scripts/ci/freebsd_cross_sdk.sh"
      - "scripts/ci/freebsd_tools.sh"
      - "scripts/ci/freebsd_arm64_gate.sh"
      - "scripts/package.sh"
      - "scripts/verify_tools_stage.sh"
      - "scripts/lib/**"
      - "tools/lock.json"
      - "tools/freebsd-cross-sdk.lock.json"
      - "tools/manifest.example.json"
      - "cmd/tools-manifest-check/**"
      - "internal/toolsmanifest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # freebsd_amd64 stays a pure in-VM native build: the guest architecture
  # matches the target, so gcc14 from Ports is the application toolchain.
  native-amd64:
    name: native bundle smoke (freebsd_amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HOST CONTRACT
        id: host_contract
        run: |
          set -eu
          host_arch=$(uname -m)
          [ "$host_arch" = x86_64 ] || {
            printf 'host architecture mismatch: target=freebsd_amd64 expected=x86_64 actual=%s\n' "$host_arch" >&2
            exit 1
          }
          printf 'target=freebsd_amd64\n'
          printf 'host_runner=ubuntu-24.04\n'
          printf 'host_uname=%s\n' "$host_arch"
          printf 'host_kvm=%s\n' "$([ -c /dev/kvm ] && echo available || echo unavailable)"
          printf 'build_model=native FreeBSD/amd64 VM; compiler runs in guest\n'

      - name: Start FreeBSD 15.1 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: "4"
          mem: "8192"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y \
              autoconf automake bash binutils ca_root_nss concurrencykit curl \
              gcc14 git gmake go help2man jq libtool luajit m4 perl5 pkgconf
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = amd64 ] || {
            printf 'guest architecture mismatch: target=freebsd_amd64 expected=amd64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          ncpu=$(sysctl -n hw.ncpu)
          [ "$ncpu" -ge 2 ] || {
            printf 'VM CPU contract violated: target=freebsd_amd64 expected>=2 actual=%s\n' "$ncpu" >&2
            exit 1
          }
          printf 'target=freebsd_amd64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$ncpu"
          printf 'guest_memory_bytes=%s\n' "$(sysctl -n hw.physmem)"
          printf 'vm_guest=%s\n' "$(sysctl -n kern.vm_guest 2>/dev/null || printf unknown)"
          printf 'phase_contract=SOURCES,SYSBENCH,ZSTD,NPB,OPENSSL,STREAM,FIO,IPERF3,MANIFEST,VERIFY\n'

      - name: SOURCES
        id: tools_sources
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' sources"

      - name: SYSBENCH
        id: tools_sysbench
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' sysbench"

      - name: ZSTD
        id: tools_zstd
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' zstd"

      - name: NPB
        id: tools_npb
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' npb"

      - name: OPENSSL
        id: tools_openssl
        timeout-minutes: 45
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' openssl"

      - name: STREAM
        id: tools_stream
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' stream"

      - name: FIO
        id: tools_fio
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' fio"

      - name: IPERF3
        id: tools_iperf3
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' iperf3"

      - name: MANIFEST
        id: tools_manifest
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' manifest"

      - name: VERIFY
        id: tools_verify
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_amd64 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' verify"

      - name: FreeBSD tools summary
        if: always()
        env:
          HOST_CONTRACT_OUTCOME: ${{ steps.host_contract.outcome }}
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          SOURCES_OUTCOME: ${{ steps.tools_sources.outcome }}
          SYSBENCH_OUTCOME: ${{ steps.tools_sysbench.outcome }}
          ZSTD_OUTCOME: ${{ steps.tools_zstd.outcome }}
          NPB_OUTCOME: ${{ steps.tools_npb.outcome }}
          OPENSSL_OUTCOME: ${{ steps.tools_openssl.outcome }}
          STREAM_OUTCOME: ${{ steps.tools_stream.outcome }}
          FIO_OUTCOME: ${{ steps.tools_fio.outcome }}
          IPERF3_OUTCOME: ${{ steps.tools_iperf3.outcome }}
          MANIFEST_OUTCOME: ${{ steps.tools_manifest.outcome }}
          VERIFY_OUTCOME: ${{ steps.tools_verify.outcome }}
        run: |
          failed=0
          for item in \
            "HOST_CONTRACT=$HOST_CONTRACT_OUTCOME" \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "SOURCES=$SOURCES_OUTCOME" \
            "SYSBENCH=$SYSBENCH_OUTCOME" \
            "ZSTD=$ZSTD_OUTCOME" \
            "NPB=$NPB_OUTCOME" \
            "OPENSSL=$OPENSSL_OUTCOME" \
            "STREAM=$STREAM_OUTCOME" \
            "FIO=$FIO_OUTCOME" \
            "IPERF3=$IPERF3_OUTCOME" \
            "MANIFEST=$MANIFEST_OUTCOME" \
            "VERIFY=$VERIFY_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"

  # freebsd_arm64 is a host-native cross build on FreeBSD/amd64. Compilers and
  # heavy tool builds run natively on the amd64 guest; qemu-user only executes
  # finished arm64 FreeBSD ELF smoke binaries. Official libgfortran supplies
  # ieee_arithmetic — the local IEEE shim is not used on this path.
  # fio functional smoke is deferred to arm64-gate (real FreeBSD/aarch64 guest)
  # because qemu-user cannot set up fio's shm segment.
  cross-arm64:
    name: cross bundle smoke (freebsd_arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HOST CONTRACT
        id: host_contract
        run: |
          set -eu
          host_arch=$(uname -m)
          [ "$host_arch" = x86_64 ] || {
            printf 'host architecture mismatch: target=freebsd_arm64 expected=x86_64 actual=%s\n' "$host_arch" >&2
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'host_runner=ubuntu-24.04\n'
          printf 'host_uname=%s\n' "$host_arch"
          printf 'build_model=FreeBSD/amd64 guest runs compilers natively; qemu-user only for arm64 smoke\n'

      - name: Start FreeBSD 15.1 amd64 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: "4"
          mem: "8192"
          sync: rsync
          copyback: true
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y \
              aarch64-binutils autoconf automake bash ca_root_nss curl git \
              gmake gmp go help2man jq libiconv libtool m4 mpc mpfr perl5 \
              pkgconf qemu-user-static texinfo
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = amd64 ] || {
            printf 'guest architecture mismatch: target=freebsd_arm64 host-guest expected=amd64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          pkg info -e 'aarch64-binutils-*'
          command -v qemu-aarch64-static
          ncpu=$(sysctl -n hw.ncpu)
          [ "$ncpu" -ge 2 ] || {
            printf 'VM CPU contract violated: target=freebsd_arm64 expected>=2 actual=%s\n' "$ncpu" >&2
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'guest_role=cross-build host (FreeBSD/amd64)\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$ncpu"
          printf 'execution_model=host-native cross build; qemu-user only for finished target probes\n'
          printf 'phase_contract=SDK,SOURCES,SYSBENCH,ZSTD,NPB,OPENSSL,STREAM,FIO,IPERF3,MANIFEST,VERIFY,EXPORT\n'

      - name: SDK
        id: cross_sdk
        timeout-minutes: 90
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk JOBS=4 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' all"

      - name: SOURCES
        id: tools_sources
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' sources"

      - name: SYSBENCH
        id: tools_sysbench
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' sysbench"

      - name: ZSTD
        id: tools_zstd
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' zstd"

      - name: NPB
        id: tools_npb
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' npb"

      - name: OPENSSL
        id: tools_openssl
        timeout-minutes: 45
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' openssl"

      - name: STREAM
        id: tools_stream
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' stream"

      - name: FIO
        id: tools_fio
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' fio"

      - name: IPERF3
        id: tools_iperf3
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' iperf3"

      - name: MANIFEST
        id: tools_manifest
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' manifest"

      - name: VERIFY
        id: tools_verify
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=freebsd_arm64 \
            ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' verify"

      - name: EXPORT STAGE
        id: tools_export
        shell: freebsd {0}
        run: |
          set -eu
          stage=/tmp/ecs-freebsd-tools-stage
          [ -d "$stage/freebsd_arm64/bin" ] || {
            echo "cross stage is missing: $stage/freebsd_arm64" >&2
            exit 1
          }
          rm -rf "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          cp -a "$stage" "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage"
          # copyback preserves workspace ownership on the Linux host.
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage/freebsd_arm64/bin" -type f | sort
          echo "exported freebsd_arm64 stage for the real-arm64 gate"

      - name: Upload freebsd_arm64 stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd-arm64-tools-stage
          path: .ci/freebsd-tools-stage
          if-no-files-found: error
          retention-days: 1

      - name: FreeBSD tools summary
        if: always()
        env:
          HOST_CONTRACT_OUTCOME: ${{ steps.host_contract.outcome }}
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          SDK_OUTCOME: ${{ steps.cross_sdk.outcome }}
          SOURCES_OUTCOME: ${{ steps.tools_sources.outcome }}
          SYSBENCH_OUTCOME: ${{ steps.tools_sysbench.outcome }}
          ZSTD_OUTCOME: ${{ steps.tools_zstd.outcome }}
          NPB_OUTCOME: ${{ steps.tools_npb.outcome }}
          OPENSSL_OUTCOME: ${{ steps.tools_openssl.outcome }}
          STREAM_OUTCOME: ${{ steps.tools_stream.outcome }}
          FIO_OUTCOME: ${{ steps.tools_fio.outcome }}
          IPERF3_OUTCOME: ${{ steps.tools_iperf3.outcome }}
          MANIFEST_OUTCOME: ${{ steps.tools_manifest.outcome }}
          VERIFY_OUTCOME: ${{ steps.tools_verify.outcome }}
          EXPORT_OUTCOME: ${{ steps.tools_export.outcome }}
        run: |
          failed=0
          for item in \
            "HOST_CONTRACT=$HOST_CONTRACT_OUTCOME" \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "SDK=$SDK_OUTCOME" \
            "SOURCES=$SOURCES_OUTCOME" \
            "SYSBENCH=$SYSBENCH_OUTCOME" \
            "ZSTD=$ZSTD_OUTCOME" \
            "NPB=$NPB_OUTCOME" \
            "OPENSSL=$OPENSSL_OUTCOME" \
            "STREAM=$STREAM_OUTCOME" \
            "FIO=$FIO_OUTCOME" \
            "IPERF3=$IPERF3_OUTCOME" \
            "MANIFEST=$MANIFEST_OUTCOME" \
            "VERIFY=$VERIFY_OUTCOME" \
            "EXPORT=$EXPORT_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"

  # Real FreeBSD/aarch64 guest: the missing fio functional acceptance for the
  # cross-built freebsd_arm64 stage. qemu-user cannot set up fio's shm segment,
  # so posixaio QD32/QD64 effective-depth checks must run on genuine arm64.
  arm64-gate:
    name: real arm64 fio gate
    needs: cross-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download freebsd_arm64 stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freebsd-arm64-tools-stage
          path: .ci/freebsd-tools-stage

      - name: HOST CONTRACT
        id: host_contract
        run: |
          set -eu
          host_arch=$(uname -m)
          [ "$host_arch" = x86_64 ] || {
            printf 'host architecture mismatch: target=freebsd_arm64 gate expected=x86_64 actual=%s\n' "$host_arch" >&2
            exit 1
          }
          stage_bin=".ci/freebsd-tools-stage/freebsd_arm64/bin"
          # Artifact download may drop the executable bit.
          chmod -R a+rX .ci/freebsd-tools-stage
          chmod a+x "$stage_bin"/* || true
          [ -x "$stage_bin/fio" ] || {
            printf 'downloaded stage is missing executable fio under %s\n' "$stage_bin" >&2
            ls -la "$stage_bin" >&2 || true
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'gate=real FreeBSD/aarch64 VM fio functional smoke\n'

      - name: Start FreeBSD 15.1 aarch64 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: aarch64
          cpu: "2"
          mem: "4096"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y bash ca_root_nss file jq
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = arm64 ] || {
            printf 'guest architecture mismatch: target=freebsd_arm64 expected=arm64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$(sysctl -n hw.ncpu)"
          printf 'phase_contract=FIO_FUNCTIONAL\n'

      - name: FIO FUNCTIONAL
        id: fio_gate
        timeout-minutes: 10
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_arm64_gate.sh' \
              --stage-root '$GITHUB_WORKSPACE/.ci/freebsd-tools-stage' \
              --target freebsd_arm64"

      - name: arm64 gate summary
        if: always()
        env:
          HOST_CONTRACT_OUTCOME: ${{ steps.host_contract.outcome }}
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          FIO_OUTCOME: ${{ steps.fio_gate.outcome }}
        run: |
          failed=0
          for item in \
            "HOST_CONTRACT=$HOST_CONTRACT_OUTCOME" \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "FIO_FUNCTIONAL=$FIO_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"
