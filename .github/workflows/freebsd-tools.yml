name: freebsd-tools

# 正式生产 workflow：Linux-hosted FreeBSD 工具链交叉构建、合并与验证。
#
# 两条独立并行链（amd64 与 arm64 互不等待）：
#   legacy-absent / linux-static / workflow-static（独立静态检查）
#   链 AMD64：SYSROOT AMD64 → C-DEPS AMD64 → C-TOOLS AMD64 → GNU SDK AMD64 → GNU BENCH AMD64 → MERGE AMD64 → VERIFY AMD64
#   链 ARM64：SYSROOT ARM64 → C-DEPS ARM64 → C-TOOLS ARM64 → GNU SDK ARM64 → GNU BENCH ARM64 → MERGE ARM64 → VERIFY ARM64
# 所有构建都在 ubuntu-24.04 amd64 宿主交叉完成，无 VM 参与 builder；
# 构建逻辑全部在 scripts/，本 workflow 只做编排。
#
# 两个 VERIFY 全部成功后，REAL GATE AMD64 与 REAL GATE ARM64 并行启动：
# 在真实 FreeBSD 15.1 VM（x86_64/aarch64）内真实执行合并 stage 的 8 个工具，
# VM 只以 consumer/judge 身份出现（scripts/ci/freebsd_tools_gate.sh）。
#
# 永久禁止：FreeBSD VM builder、任何 cache。

on:
  push:
    branches: [bsd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-absent:
    name: legacy builder absent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert legacy builder files are gone
        run: |
          set -euo pipefail
          legacy_files=(
            .github/workflows/freebsd-rebuild.yml
            .github/workflows/freebsd-cross-sdk.yml
            scripts/ci/freebsd_tools.sh
            scripts/ci/freebsd_cross_sdk.sh
            scripts/build_tools_freebsd.sh
            scripts/lib/freebsd_tools/core.sh
            scripts/lib/freebsd_tools/extra.sh
            scripts/lib/freebsd_tools/manifest.sh
            scripts/lib/freebsd_tools/common.sh
            tools/freebsd-cross-sdk.lock.json
          )
          failed=0
          for path in "${legacy_files[@]}"; do
            if [[ -e "$path" ]]; then
              echo "legacy file still present: $path" >&2
              failed=1
            else
              echo "absent: $path"
            fi
          done
          if [[ -d scripts/lib/freebsd_tools ]]; then
            echo "legacy lib directory still present: scripts/lib/freebsd_tools" >&2
            failed=1
          fi
          exit "$failed"

      - name: Assert legacy call sites are gone
        run: |
          set -euo pipefail
          patterns=(
            'freebsd_tools\.sh'
            'freebsd_cross_sdk\.sh'
            'build_tools_freebsd\.sh'
            'ECS_FREEBSD_CROSS_SDK'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            if git grep -nE "$pattern" -- . \
              ':!.github/workflows/freebsd-tools.yml' \
              ':!PLAN.md'; then
              echo "legacy call site still present for pattern: $pattern" >&2
              failed=1
            else
              echo "clean: $pattern"
            fi
          done
          exit "$failed"

      - name: Assert Linux builders still refuse FreeBSD targets
        run: |
          set -euo pipefail
          # build_tools.sh / build_tools_container.sh 只构建 Linux，继续显式拒绝
          # freebsd_* 目标；FreeBSD 工具链由本 workflow 的交叉构建链负责。
          grep -q 'FreeBSD tools builder unavailable' scripts/build_tools.sh
          grep -q 'FreeBSD tools builder unavailable' scripts/build_tools_container.sh
          echo 'Linux builders still refuse FreeBSD targets'

  linux-static:
    name: linux static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Run scripts/ci/check.sh
        run: bash scripts/ci/check.sh

  workflow-static:
    name: workflow static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate YAML parses
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml >/dev/null
          python3 - <<'PY'
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              sys.exit('PyYAML is required for workflow static checks')

          root = Path('.github/workflows')
          failed = False
          for path in sorted(root.glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:  # noqa: BLE001
                  print(f'FAIL {path}: {exc}', file=sys.stderr)
                  failed = True
              else:
                  print(f'ok {path}')
          sys.exit(1 if failed else 0)
          PY

      - name: Assert no FreeBSD VM builder workflows remain
        run: |
          set -euo pipefail
          if [[ -e .github/workflows/freebsd-cross-sdk.yml ]]; then
            echo 'freebsd-cross-sdk.yml must stay deleted' >&2
            exit 1
          fi
          if [[ -e .github/workflows/freebsd-rebuild.yml ]]; then
            echo 'freebsd-rebuild.yml must stay deleted' >&2
            exit 1
          fi
          mapfile -t freebsd_workflows < <(ls .github/workflows | grep -i freebsd || true)
          for wf in "${freebsd_workflows[@]}"; do
            if [[ "$wf" != 'freebsd-tools.yml' ]]; then
              echo "unexpected FreeBSD workflow present: $wf" >&2
              exit 1
            fi
          done
          echo "freebsd workflows present: ${freebsd_workflows[*]}"

  sysroot-amd64:
    name: SYSROOT AMD64
    needs: [legacy-absent, linux-static, workflow-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install clang/lld toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm file xz-utils

      - name: Print resolved sysroot lock
        run: bash scripts/ci/freebsd_sysroot.sh --target freebsd_amd64 --print-lock

      - name: Install and probe FreeBSD amd64 sysroot
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_sysroot.sh \
            --target freebsd_amd64 \
            --sysroot-dir "$PWD/.ci/sysroot/freebsd_amd64" \
            --work-dir "$PWD/.ci/sysroot-work"

  sysroot-arm64:
    name: SYSROOT ARM64
    needs: [legacy-absent, linux-static, workflow-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install clang/lld toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm file xz-utils

      - name: Print resolved sysroot lock
        run: bash scripts/ci/freebsd_sysroot.sh --target freebsd_arm64 --print-lock

      - name: Install and probe FreeBSD arm64 sysroot
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_sysroot.sh \
            --target freebsd_arm64 \
            --sysroot-dir "$PWD/.ci/sysroot/freebsd_arm64" \
            --work-dir "$PWD/.ci/sysroot-work"

      - name: Assert both sysroot targets are locked to 15.1-RELEASE
        run: |
          set -euo pipefail
          release=$(jq -er '.freebsd_release' tools/freebsd-sysroot.lock.json)
          test "$release" = "15.1-RELEASE"
          for target in freebsd_amd64 freebsd_arm64; do
            url=$(jq -er --arg t "$target" '.targets[$t].base_txz_url' tools/freebsd-sysroot.lock.json)
            case "$url" in
              *15.1-RELEASE*) ;;
              *) echo "target $target is not pinned to 15.1-RELEASE: $url" >&2; exit 1 ;;
            esac
            case "$url" in
              *latest*|*stable*|*current*)
                echo "target $target uses a rolling URL: $url" >&2
                exit 1
                ;;
            esac
          done
          echo 'sysroot locks are release-pinned'

  c-deps-amd64:
    name: C-DEPS AMD64
    needs: [sysroot-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install package extract tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libarchive-tools curl jq

      - name: Print target deps lock
        run: bash scripts/ci/freebsd_target_deps.sh --target freebsd_amd64 --print-lock

      - name: Fetch immutable LuaJIT/CK snapshot
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_target_deps.sh \
            --target freebsd_amd64 \
            --prefix "$PWD/.ci/target-deps/freebsd_amd64" \
            --work-dir "$PWD/.ci/target-deps-work"

      - name: Assert no rolling package URLs in lock
        run: |
          set -euo pipefail
          if jq -e '.. | objects | select(has("snapshot_url")) | .snapshot_url' \
            tools/freebsd-target-deps.lock.json | grep -E 'latest|Hashed'; then
            echo 'lock contains rolling package URLs' >&2
            exit 1
          fi
          test "$(jq -er '.snapshot.id' tools/freebsd-target-deps.lock.json)" = 'ci-freebsd-deps-v1'
          echo 'target deps lock is snapshot-pinned'

  c-tools-amd64:
    name: C-TOOLS AMD64
    needs: [c-deps-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install clang/lld and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm file xz-utils zstd libarchive-tools \
            autoconf automake libtool libtool-bin pkg-config \
            make git curl jq perl

      - name: Print builder params
        run: bash scripts/build_tools_freebsd_c.sh --target freebsd_amd64 --print-params

      - name: Build five C-tools for freebsd_amd64
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_c.sh \
            --target freebsd_amd64 \
            --stage-root "$PWD/.ci/freebsd-c-tools-stage" \
            --jobs "$(nproc)"

      - name: Upload C-tools stage fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-c-tools-stage-freebsd_amd64
          path: .ci/freebsd-c-tools-stage/freebsd_amd64
          if-no-files-found: error
          retention-days: 7

  c-deps-arm64:
    name: C-DEPS ARM64
    needs: [sysroot-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install package extract tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libarchive-tools curl jq

      - name: Fetch immutable LuaJIT/CK snapshot
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_target_deps.sh \
            --target freebsd_arm64 \
            --prefix "$PWD/.ci/target-deps/freebsd_arm64" \
            --work-dir "$PWD/.ci/target-deps-work"

  c-tools-arm64:
    name: C-TOOLS ARM64
    needs: [c-deps-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install clang/lld and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm file xz-utils zstd libarchive-tools \
            autoconf automake libtool libtool-bin pkg-config \
            make git curl jq perl

      - name: Build five C-tools for freebsd_arm64
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_c.sh \
            --target freebsd_arm64 \
            --stage-root "$PWD/.ci/freebsd-c-tools-stage" \
            --jobs "$(nproc)"

      - name: Upload C-tools stage fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-c-tools-stage-freebsd_arm64
          path: .ci/freebsd-c-tools-stage/freebsd_arm64
          if-no-files-found: error
          retention-days: 7

  gnu-sdk-amd64:
    name: GNU SDK AMD64
    needs: [c-tools-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install toolchain build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev \
            texinfo file xz-utils curl jq

      - name: Print GNU SDK lock
        run: bash scripts/ci/freebsd_gnu_openmp_sdk.sh --target freebsd_amd64 --print-lock

      - name: Build FreeBSD amd64 GNU C/Fortran/OpenMP SDK
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_gnu_openmp_sdk.sh \
            --target freebsd_amd64 \
            --prefix "$PWD/.ci/gnu-sdk/freebsd_amd64" \
            --work-dir "$PWD/.ci/gnu-sdk-work" \
            --jobs "$(nproc)"

      - name: Upload GNU SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-gnu-sdk-freebsd_amd64
          path: .ci/gnu-sdk/freebsd_amd64
          if-no-files-found: error
          retention-days: 7

  gnu-sdk-arm64:
    name: GNU SDK ARM64
    needs: [c-tools-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install toolchain build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev \
            texinfo file xz-utils curl jq

      - name: Build FreeBSD arm64 GNU C/Fortran/OpenMP SDK
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_gnu_openmp_sdk.sh \
            --target freebsd_arm64 \
            --prefix "$PWD/.ci/gnu-sdk/freebsd_arm64" \
            --work-dir "$PWD/.ci/gnu-sdk-work" \
            --jobs "$(nproc)"

      - name: Upload GNU SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-gnu-sdk-freebsd_arm64
          path: .ci/gnu-sdk/freebsd_arm64
          if-no-files-found: error
          retention-days: 7

  gnu-bench-amd64:
    name: GNU BENCH AMD64
    needs: [gnu-sdk-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld build-essential file jq curl xz-utils

      - name: Download Stage 4 GNU SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-gnu-sdk-freebsd_amd64
          path: .ci/gnu-sdk/freebsd_amd64

      - name: Print builder params
        run: bash scripts/build_tools_freebsd_gnu.sh --target freebsd_amd64 --print-params

      - name: Build NPB EP/FT + STREAM for freebsd_amd64
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_gnu.sh \
            --target freebsd_amd64 \
            --sdk-prefix "$PWD/.ci/gnu-sdk/freebsd_amd64" \
            --stage-root "$PWD/.ci/freebsd-gnu-tools-stage"

      - name: Upload GNU tools stage fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-gnu-tools-stage-freebsd_amd64
          path: .ci/freebsd-gnu-tools-stage/freebsd_amd64
          if-no-files-found: error
          retention-days: 7

  gnu-bench-arm64:
    name: GNU BENCH ARM64
    needs: [gnu-sdk-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld build-essential file jq curl xz-utils

      - name: Download Stage 4 GNU SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-gnu-sdk-freebsd_arm64
          path: .ci/gnu-sdk/freebsd_arm64

      - name: Print builder params
        run: bash scripts/build_tools_freebsd_gnu.sh --target freebsd_arm64 --print-params

      - name: Build NPB EP/FT + STREAM for freebsd_arm64
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_gnu.sh \
            --target freebsd_arm64 \
            --sdk-prefix "$PWD/.ci/gnu-sdk/freebsd_arm64" \
            --stage-root "$PWD/.ci/freebsd-gnu-tools-stage"

      - name: Upload GNU tools stage fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-gnu-tools-stage-freebsd_arm64
          path: .ci/freebsd-gnu-tools-stage/freebsd_arm64
          if-no-files-found: error
          retention-days: 7

  merge-amd64:
    name: MERGE AMD64
    needs: [c-tools-amd64, gnu-bench-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install merge dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Stage 3 C-tools fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-c-tools-stage-freebsd_amd64
          path: .ci/freebsd-c-tools-stage/freebsd_amd64

      - name: Download Stage 5 GNU tools fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-gnu-tools-stage-freebsd_amd64
          path: .ci/freebsd-gnu-tools-stage/freebsd_amd64

      - name: Merge C + GNU fragments into the final stage
        run: |
          set -euo pipefail
          bash scripts/ci/merge_freebsd_tools_stage.sh \
            --target freebsd_amd64 \
            --c-fragment "$PWD/.ci/freebsd-c-tools-stage/freebsd_amd64" \
            --gnu-fragment "$PWD/.ci/freebsd-gnu-tools-stage/freebsd_amd64" \
            --stage-root "$PWD/.ci/freebsd-tools-stage"

      - name: Upload merged FreeBSD tools stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-tools-stage-freebsd_amd64
          path: .ci/freebsd-tools-stage/freebsd_amd64
          if-no-files-found: error
          retention-days: 7

  merge-arm64:
    name: MERGE ARM64
    needs: [c-tools-arm64, gnu-bench-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install merge dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Stage 3 C-tools fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-c-tools-stage-freebsd_arm64
          path: .ci/freebsd-c-tools-stage/freebsd_arm64

      - name: Download Stage 5 GNU tools fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-gnu-tools-stage-freebsd_arm64
          path: .ci/freebsd-gnu-tools-stage/freebsd_arm64

      - name: Merge C + GNU fragments into the final stage
        run: |
          set -euo pipefail
          bash scripts/ci/merge_freebsd_tools_stage.sh \
            --target freebsd_arm64 \
            --c-fragment "$PWD/.ci/freebsd-c-tools-stage/freebsd_arm64" \
            --gnu-fragment "$PWD/.ci/freebsd-gnu-tools-stage/freebsd_arm64" \
            --stage-root "$PWD/.ci/freebsd-tools-stage"

      - name: Upload merged FreeBSD tools stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-freebsd-tools-stage-freebsd_arm64
          path: .ci/freebsd-tools-stage/freebsd_arm64
          if-no-files-found: error
          retention-days: 7

  verify-amd64:
    name: VERIFY AMD64
    needs: [merge-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y file binutils jq

      - name: Download merged FreeBSD tools stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-tools-stage-freebsd_amd64
          path: .ci/freebsd-tools-stage/freebsd_amd64

      - name: Verify the merged FreeBSD tools stage
        run: |
          set -euo pipefail
          bash scripts/verify_tools_stage.sh \
            --target freebsd_amd64 \
            --stage-root "$PWD/.ci/freebsd-tools-stage"

  verify-arm64:
    name: VERIFY ARM64
    needs: [merge-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y file binutils jq

      - name: Download merged FreeBSD tools stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-tools-stage-freebsd_arm64
          path: .ci/freebsd-tools-stage/freebsd_arm64

      - name: Verify the merged FreeBSD tools stage
        run: |
          set -euo pipefail
          bash scripts/verify_tools_stage.sh \
            --target freebsd_arm64 \
            --stage-root "$PWD/.ci/freebsd-tools-stage"

  real-gate-amd64:
    name: REAL GATE AMD64
    needs: [verify-amd64, verify-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download merged FreeBSD tools stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-freebsd-tools-stage-freebsd_amd64
          path: .ci/freebsd-tools-stage/freebsd_amd64

      - name: Start FreeBSD 15.1 VM (consumer/judge)
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          sync: rsync
          copyback: false
          custom-shell-name: freebsd
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg install -y bash jq file ca_root_nss

      - name: REAL GATE
        shell: freebsd {0}
        run: |
          set -eu
          export PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
          bash "$GITHUB_WORKSPACE/scripts/ci/freebsd_tools_gate.sh" \
            --target freebsd_amd64 \
            --stage-dir "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage/freebsd_amd64"

