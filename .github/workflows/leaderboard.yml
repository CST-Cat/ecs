name: leaderboard

# 排行榜数据需要重建并写回吗？
#
# 这是 CI 侧唯一带 contents: write 的 workflow，因此它只做一件事：按 main 上
# 当前的提交重算基线并写回。代码检查不在这里跑——检查阶段不改工作区，避免把
# 生成文件混进正在审核的代码变更，也避免写权限出现在任意分支的 push 上。
#
# paths 限定真正影响排行榜的输入。两个 baseline 是本 workflow 的输出，必须排除，
# 否则写回提交会再次触发自己；算法入口则显式列出，不依赖“整个目录看起来像相关”。

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "!submissions/baseline.json"
      - "scripts/leaderboard.sh"
      - "internal/app/leaderboard.go"
      - "internal/app/leaderboard_inputs.go"
      - "internal/config/modules.go"
      - "internal/model/**"
      - "internal/score/baseline.go"
      - "internal/score/outlier.go"
      - "internal/score/score.go"
      - "internal/score/submission.go"
      - "internal/score/tier.go"
      - "!internal/score/embedded/baseline.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@v7 # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Validate submissions before rebuilding
        env:
          ECS_SUBMISSION_DIR: submissions
        run: go test ./internal/score -run '^TestSubmissionCorpus$' -count=1

      - name: Rebuild and commit the leaderboard reference
        run: ./scripts/leaderboard.sh
