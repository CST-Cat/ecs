name: release

# 当前这个 immutable commit 能否生成并发布可信 Release？
#
# 发布链按"权限和制品交接"拆 job：
# freeze → source-checks/ecs-build×10 → assemble → verify → rehearsal/publish。
#
#   freeze       contents: read    冻结 SHA，校验发布说明
#   source-checks contents: read   跑确定性源码检查
#   ecs-build × 10 contents: read  十个平台目标构建主程序
#   assemble     contents: read    组装全部发布物，记录实测 Go 版本
#   verify       contents: read    校验解包出来的实际二进制
#   rehearsal    contents: read    零远端副作用验证发布边界
#   publish      contents: write   唯一持有写权限的 job
#
# 红灯语义：release 红表示发布门禁没过，不能把候选制品转成正式 Release。
#
# workflow_dispatch 永远是发布演练，即使维护者在 Actions UI 里选中了 v* tag
# 作为运行 ref；正式发布必须同时满足 event=push 与 refs/tags/v*。编译器、打包
# 工具和构建脚本都跑在没有仓库写权限的 job 里，真正拿到 contents: write 的
# 只有最后那个正式上传步骤。
#
# 构建实现全部在 scripts/ 下。这里只决定 when / where / permission / dependency。

on:
  push:
    tags: ["v*"]
  # 手动触发是发布演练：走完 freeze → source-checks/ecs-build×10 → assemble →
  # verify → rehearsal 的全部检查；无论 dispatch 选择 branch 还是 tag ref，
  # publish 都因为 event 不是 push 而跳过。
  workflow_dispatch:

permissions:
  contents: read

# 正式发布中需要 Go 的 job 使用与 canonical formatter 对齐的 Go 1.27.1，
# 不从主模块 go.mod 自动选择工具链。所有会运行 Go 命令的 release job（包括被脚本间接调用的
# go build/go test/go run）都禁止 go 命令根据 go.mod 自动切换工具链；ecs-build 记录
# 实际 go env GOVERSION，assemble 从 amd64 构建 artifact 读取并原样交给 verify 校验。
env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布候选冻结 + 入口变更日志校验。
  #
  # main 只在这里读一次。Release transaction 一旦开始，后续所有 job 都 checkout
  # 到这个冻结的 SHA——不再拿移动中的 main 和已经冻结的 tag 做比较。
  #
  # 确定性的源码检查在独立的 source-checks job 中执行。
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze the release candidate
        id: freeze
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          ./scripts/release/freeze.sh --event "$EVENT" --ref "$REF" --sha "$SHA" \
            | tee -a "$GITHUB_OUTPUT"

      # 忘写发布说明必须在十目标构建前失败，不能等到最后的 publish 才发现。
      # workflow_dispatch 永远是 dev 演练，即使它选择了一个 tag ref；只有真正的
      # tag push 才要求已经存在对应版本章节。
      - name: Validate release changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
        run: ./scripts/release/check_changelog.sh --version "$VERSION"

  source-checks:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Deterministic source checks
        run: ./scripts/ci/check.sh

      - name: Unit tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # 十目标主程序独立构建，完成后由 assemble 统一打包。
  ecs-build:
    needs: freeze
    name: ecs-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux_amd64
          - linux_arm64
          - linux_armv7
          - linux_386
          - linux_s390x
          - linux_riscv64
          - linux_ppc64le
          - freebsd_amd64
          - freebsd_arm64
          - windows_amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build the ECS binary
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT_DIR: artifact
          VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          ./scripts/cross.sh --target "$TARGET"
          go env GOVERSION >artifact/build-go-version

      - uses: actions/upload-artifact@v7
        with:
          name: ecs-binary-${{ matrix.target }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # 组装全部发布物，并记录**实测**的 Go 版本。
  #
  # ecs-build 通过 setup-go 固定使用 Go 1.27.1，不另写 expected_go=... 这种可能
  # 分叉的期望值。ecs-build 将实际的 go env GOVERSION 随同
  # 每个主程序 artifact 交给 assemble；assemble 从 linux_amd64 artifact 取出并通过
  # --build-go-version 交给 verify 校验二进制里的元数据。
  assemble:
    needs: [freeze, source-checks, ecs-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_go_version: ${{ steps.build.outputs.build_go_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ecs-binary-*
          path: artifact/ecs-binaries-artifacts

      - name: Normalize the downloaded ECS binaries
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p artifact/ecs-binaries
          for target in "${ECS_RELEASE_TARGET_IDS[@]}"; do
            source_dir="artifact/ecs-binaries-artifacts/ecs-binary-${target}"
            binary_name=$(ecs_target_asset_name "$target" binary)
            test -s "$source_dir/$binary_name"
            test -s "$source_dir/build-go-version"
            cp "$source_dir/$binary_name" "artifact/ecs-binaries/$binary_name"
            chmod +x "artifact/ecs-binaries/$binary_name"
          done

      # 洁净源码检查在 build.sh 里，与本地演练共用同一份实现。
      - name: Assemble release assets
        id: build
        env:
          VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          build_go_version=$(<"artifact/ecs-binaries-artifacts/ecs-binary-linux_amd64/build-go-version")
          test -n "$build_go_version"
          echo "build_go_version=$build_go_version" >>"$GITHUB_OUTPUT"
          ./scripts/release/build.sh "$VERSION" \
            --binaries-dir artifact/ecs-binaries

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # 这组制品真的出自这次提交、这条工具链吗？
  verify:
    needs: [freeze, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Verify build provenance metadata
        env:
          BUILD_GO_VERSION: ${{ needs.assemble.outputs.build_go_version }}
          REVISION: ${{ needs.freeze.outputs.sha }}
        run: |
          ./scripts/release/verify.sh \
            --dist dist \
            --build-go-version "$BUILD_GO_VERSION" \
            --revision "$REVISION"

  # workflow_dispatch 专用的零副作用发布边界检查。它下载与正式 publish 相同的
  # release-dist，并调用同一个 publish.sh，只是 --check-only 在任何 gh 操作之前
  # 返回。这样彩排能验证资产清单和 Bundle/SDK 引用，而不是单纯“少跑最后一个 job”。
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: [freeze, assemble, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Validate publication boundary without remote mutation
        env:
          REVISION: ${{ needs.freeze.outputs.sha }}
          VERSION: ${{ needs.freeze.outputs.version }}
          REHEARSAL_TAG: rehearsal-${{ github.run_id }}
        run: |
          ./scripts/release/publish.sh \
            --kind ecs \
            --tag "$REHEARSAL_TAG" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --dist dist \
            --check-only
          {
            echo '### ECS release rehearsal passed'
            echo
            echo "- Candidate: \`$REVISION\`"
            echo '- Git tag created: **no**'
            echo '- GitHub Release created/edited: **no**'
            echo '- `release-dist` remains only a 7-day Actions artifact.'
          } >>"$GITHUB_STEP_SUMMARY"

  # 唯一持有 contents: write 的 job。正式发布需要“双钥匙”：事件必须是 push，
  # ref 还必须是 v* tag。workflow_dispatch 即使选中同名 tag 也永远进不来。
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [freeze, assemble, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.freeze.outputs.version }}
          REVISION: ${{ needs.freeze.outputs.sha }}
        run: |
          ./scripts/release/publish.sh \
            --kind ecs \
            --tag "$TAG" --version "$VERSION" --revision "$REVISION" --dist dist
