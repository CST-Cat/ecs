name: release

# 当前这个 immutable commit 能否生成并发布可信 Release？
#
# 按"权限和制品交接"拆 job：
#
#   preflight  contents: read    冻结 SHA，跑确定性源码检查
#   tools × 7  contents: read    七架构完整构建工具包
#   assemble   contents: read    组装全部发布物，记录实测工具链版本
#   verify     contents: read    校验解包出来的实际二进制
#   security   contents: read    对实际二进制跑 govulncheck
#   attest     id-token: write   为最终制品生成 provenance
#   publish    contents: write   唯一持有写权限的 job
#
# 编译器、Docker、tar、govulncheck、构建脚本、全部第三方工具都跑在没有仓库
# 写权限的 job 里。真正拿到 contents: write 的只有最后那个上传步骤。
#
# 构建实现全部在 scripts/ 下。这里只决定 when / where / permission / dependency。

on:
  push:
    tags: ["v*"]
  # 手动触发是发布演练：走完 preflight → tools×7 → assemble → verify/security
  # → attest 的全部检查，但 publish 只在 tag 上运行，因此不会发出任何东西。
  # 没有 rebuild_tools 之类的开关——每次都完整构建七架构，没有可跳过的选项。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 入口资格判断 + 冻结 SHA。
  #
  # main 只在这里读一次。Release transaction 一旦开始，后续所有 job 都 checkout
  # 到这个冻结的 SHA——不再拿移动中的 main 和已经冻结的 tag 做比较。
  #
  # 这里直接跑确定性的源码检查，而不是去轮询历史 ci.yml run 的结论：
  # 跨 workflow 的状态耦合既脆弱（run 会过期、会被重跑），又把"发布前检查过
  # 什么"这个问题的答案藏进了 Actions 的运行历史里。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Freeze the release candidate
        id: freeze
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          ./scripts/release/freeze.sh --event "$EVENT" --ref "$REF" --sha "$SHA" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Deterministic source checks
        run: ./scripts/ci/check.sh

      - name: Unit tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # amd64/arm64 用对应的原生硬件，386 用 x86-64 的原生 32 位兼容执行，
  # 其余四个架构由宿主原生跑交叉编译器，只让短 smoke 显式走 QEMU。
  #
  # matrix 只描述 where——挑哪台机器。镜像、apt 包、交叉三元组、QEMU 运行器
  # 全部由 scripts/build_tools_container.sh 的架构表决定。
  #
  # 每次发布都完整构建七架构。不复用上一个 Release 的工具包：那需要靠"哪些
  # 路径变了"去推断产物是否仍然等价，而这种推断错一次就是发出一个没人验证过
  # 的二进制。
  tools:
    needs: [preflight]
    name: tools (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { arch: armv7, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { arch: "386", runner: ubuntu-24.04, runner_arch: x86_64 }
          - { arch: s390x, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { arch: riscv64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { arch: ppc64le, runner: ubuntu-24.04, runner_arch: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # 交叉构建把宿主当成构建机，跑错架构的宿主会得到错误的产物。
      - name: Verify runner architecture
        env:
          EXPECTED: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          actual=$(uname -m)
          case "$EXPECTED:$actual" in
            x86_64:x86_64 | arm64:aarch64 | arm64:arm64) ;;
            *)
              echo "expected $EXPECTED runner, got $actual" >&2
              exit 1
              ;;
          esac

      - name: Build tools in the target container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_tools_container.sh --arch '${{ matrix.arch }}' --stage-root .ci-tools-stage

      # manifest 要能被 ecs 自己的解析器读下来，构建口径要与构建脚本声明的一致。
      # 语料在这里摘出去：它是独立发布物，七份副本没有必要。
      - name: Verify the staged tools
        run: ./scripts/verify_tools_stage.sh --arch '${{ matrix.arch }}' --stage-root .ci-tools-stage

      - name: Collect the architecture stage
        run: |
          set -euo pipefail
          mkdir -p artifact
          sudo cp -a ".ci-tools-stage/linux_${{ matrix.arch }}" artifact/
          sudo chown -R "$(id -u):$(id -g)" artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-tools-stage-${{ matrix.arch }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # 组装全部发布物，并记录**实测**的工具链版本。
  #
  # 不写 expected_go=... 这种期望值：期望值会和 go.mod 分叉，而分叉的那
  # 一侧通常没人注意。这里记录的是本次构建真实使用的版本，verify 拿它去对二
  # 进制里的元数据。升级 Go 只需要改 go.mod。
  assemble:
    needs: [preflight, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_go_version: ${{ steps.build.outputs.build_go_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ecs-tools-stage-*
          path: tools-artifacts

      - name: Normalize the downloaded tools stages
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p tools-stage
          for arch in "${ECS_ARCHES[@]}"; do
            source_dir="tools-artifacts/ecs-tools-stage-${arch}/linux_${arch}"
            test -d "$source_dir"
            mkdir -p "tools-stage/linux_${arch}"
            cp -a "$source_dir/." "tools-stage/linux_${arch}/"
          done

      # 洁净源码检查在 build.sh 里，与本地演练共用同一份实现。
      - name: Assemble release assets
        id: build
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          echo "build_go_version=$(go env GOVERSION)" >>"$GITHUB_OUTPUT"
          ./scripts/release/build.sh "$VERSION" --tools-stage tools-stage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # 这组制品真的出自这次提交、这条工具链吗？
  verify:
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Verify build provenance metadata
        env:
          BUILD_GO_VERSION: ${{ needs.assemble.outputs.build_go_version }}
          REVISION: ${{ needs.preflight.outputs.sha }}
        run: |
          ./scripts/release/verify.sh \
            --dist dist \
            --build-go-version "$BUILD_GO_VERSION" \
            --revision "$REVISION"

  # 发布前安全门禁：候选制品现在安全吗？
  # 发布后的持续复审是 security.yml 的职责。
  security:
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Scan release candidates
        run: ./scripts/release/security.sh --dist dist

  # provenance：这些字节由哪个仓库、哪个 workflow、哪个提交产出。
  #
  # checksums.txt 本来就是发给用户校验的清单，这里直接把它当作 attestation 的
  # subject 列表——同一份事实只写一次。attestation 按摘要绑定，因此 job 之间
  # 传递制品不影响绑定关系。
  attest:
    needs: [preflight, assemble, verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt

  # 唯一持有 contents: write 的 job。它只做上传：到这一步为止，制品已经被
  # verify、security 和 attest 检查过了。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, assemble, verify, security, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          REVISION: ${{ needs.preflight.outputs.sha }}
        run: |
          ./scripts/release/publish.sh \
            --tag "$TAG" --version "$VERSION" --revision "$REVISION" --dist dist
