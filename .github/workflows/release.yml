name: release

# 当前这个 immutable commit 能否生成并发布可信 Release？
#
# 发布链按"权限和制品交接"拆 job：
# freeze → source-checks/ecs-build×7 → assemble → verify → publish。
#
#   freeze     contents: read    冻结 SHA，校验发布说明
#   source-checks contents: read  跑确定性源码检查
#   ecs-build × 7 contents: read 七架构构建主程序
#   assemble   contents: read    组装全部发布物，记录实测 Go 版本
#   verify     contents: read    校验解包出来的实际二进制
#   publish    contents: write   唯一持有写权限的 job
#
# 红灯语义：release 红表示发布门禁没过，不能把候选制品转成正式 Release。
#
# 编译器、打包工具和构建脚本都跑在没有仓库写权限的 job 里。
# 真正拿到 contents: write 的只有最后那个上传步骤。
#
# 构建实现全部在 scripts/ 下。这里只决定 when / where / permission / dependency。

on:
  push:
    tags: ["v*"]
  # 手动触发是发布演练：走完 freeze → source-checks/ecs-build×7 → assemble → verify
  # 的全部检查，但 publish 只在 tag 上运行，因此不会发出任何东西。
  workflow_dispatch:

permissions:
  contents: read

# 正式发布中需要 Go 的 job 直接通过 setup-go 的 stable/check-latest 选择当前官方稳定 Go，
# 不从主模块 go.mod 自动选择工具链。所有会运行 Go 命令的 release job（包括被脚本间接调用的
# go build/go test/go run）都禁止 go 命令根据 go.mod 自动切换工具链；ecs-build 记录
# 实际 go env GOVERSION，assemble 从 amd64 构建 artifact 读取并原样交给 verify 校验。
env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布候选冻结 + 入口变更日志校验。
  #
  # main 只在这里读一次。Release transaction 一旦开始，后续所有 job 都 checkout
  # 到这个冻结的 SHA——不再拿移动中的 main 和已经冻结的 tag 做比较。
  #
  # 确定性的源码检查在独立的 source-checks job 中执行。
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Freeze the release candidate
        id: freeze
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          ./scripts/release/freeze.sh --event "$EVENT" --ref "$REF" --sha "$SHA" \
            | tee -a "$GITHUB_OUTPUT"

      # 忘写发布说明必须在七架构构建前失败，不能等到最后的 publish 才发现。
      # workflow_dispatch 的 dev 演练没有对应版本章节，因此只对实际 tag 校验。
      - name: Validate release changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
        run: ./scripts/release/check_changelog.sh --version "$VERSION"

  source-checks:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Deterministic source checks
        run: ./scripts/ci/check.sh

      - name: Unit tests
        env:
          ECS_I18N_SAMPLES: ${{ github.workspace }}/internal/report/testdata
        run: go test ./...

  # 七架构主程序独立构建，完成后由 assemble 统一打包。
  ecs-build:
    needs: freeze
    name: ecs-build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7, "386", s390x, riscv64, ppc64le]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false
      - name: Build the ECS binary
        env:
          ARCH: ${{ matrix.arch }}
          OUTPUT_DIR: artifact
          VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          ./scripts/cross.sh --target "linux_$ARCH"
          go env GOVERSION >artifact/build-go-version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-binary-${{ matrix.arch }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # 组装全部发布物，并记录**实测**的 Go 版本。
  #
  # ecs-build 通过 setup-go 的 stable/check-latest 选择当前官方稳定 Go，不另写
  # expected_go=... 这种可能分叉的期望值。ecs-build 将实际的 go env GOVERSION 随同
  # 每个主程序 artifact 交给 assemble；assemble 从 amd64 artifact 取出并通过
  # --build-go-version 交给 verify 校验二进制里的元数据。
  assemble:
    needs: [freeze, source-checks, ecs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_go_version: ${{ steps.build.outputs.build_go_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ecs-binary-*
          path: artifact/ecs-binaries-artifacts

      - name: Normalize the downloaded ECS binaries
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p artifact/ecs-binaries
          for arch in "${ECS_ARCHES[@]}"; do
            source_dir="artifact/ecs-binaries-artifacts/ecs-binary-${arch}"
            test -s "$source_dir/ecs_linux_${arch}"
            test -s "$source_dir/build-go-version"
            cp "$source_dir/ecs_linux_${arch}" "artifact/ecs-binaries/ecs_linux_${arch}"
            chmod +x "artifact/ecs-binaries/ecs_linux_${arch}"
          done

      # 洁净源码检查在 build.sh 里，与本地演练共用同一份实现。
      - name: Assemble release assets
        id: build
        env:
          VERSION: ${{ needs.freeze.outputs.version }}
        run: |
          set -euo pipefail
          build_go_version=$(<"artifact/ecs-binaries-artifacts/ecs-binary-amd64/build-go-version")
          test -n "$build_go_version"
          echo "build_go_version=$build_go_version" >>"$GITHUB_OUTPUT"
          ./scripts/release/build.sh "$VERSION" \
            --binaries-dir artifact/ecs-binaries

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # 这组制品真的出自这次提交、这条工具链吗？
  verify:
    needs: [freeze, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Verify build provenance metadata
        env:
          BUILD_GO_VERSION: ${{ needs.assemble.outputs.build_go_version }}
          REVISION: ${{ needs.freeze.outputs.sha }}
        run: |
          ./scripts/release/verify.sh \
            --dist dist \
            --build-go-version "$BUILD_GO_VERSION" \
            --revision "$REVISION"

  # 唯一持有 contents: write 的 job。它只做上传：到这一步为止，制品已经被
  # verify 校验过。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [freeze, assemble, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.freeze.outputs.version }}
          REVISION: ${{ needs.freeze.outputs.sha }}
        run: |
          ./scripts/release/publish.sh \
            --kind ecs \
            --tag "$TAG" --version "$VERSION" --revision "$REVISION" --dist dist
