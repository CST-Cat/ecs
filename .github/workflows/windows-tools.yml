            $hostileEntries = @(Get-ChildItem -LiteralPath $env:ECS_PHASE1_HOSTILE -File -Filter '*.exe')
            if ($hostileEntries.Count -ne 3) { throw 'standard-user CLI hostile PATH sentinel set is incomplete' }
            foreach ($name in @('zstd.exe', 'openssl.exe', 'fio.exe')) {
              $command = @(Get-Command -Name $name -CommandType Application -ErrorAction Stop)
              $expected = [IO.Path]::GetFullPath((Join-Path $env:ECS_PHASE1_HOSTILE $name))
