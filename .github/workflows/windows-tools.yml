              } catch {
                $cleanupErrors += "private staging cleanup check failed: $($_.Exception.Message)"
              }
            }
            if ($cleanupErrors.Count -ne 0) {
              throw ("E2E-$label cleanup failed: " + ($cleanupErrors -join '; '))
            }
          }
