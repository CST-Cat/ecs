name: windows-tools

# Windows benchmark bundle chain. The builders and E2E contracts live in scripts/;
# this workflow chooses the real runners, artifact hand-off, and dependency DAG.
#
# LOCK/CHECK -> BUILD windows_amd64 -> PACKAGE -> E2E (windows-2022 || windows-2025)
# BUILD exports its already-verified corpus separately; E2E covers runtime,
# production integration, bootstrap/install, and canonical route/backtrace.
#
# workflow_dispatch is a rehearsal only.  It produces seven-day artifacts and
# never has repository write permission or a release/tag side effect.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: LOCK/CHECK
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: LOCK/CHECK pinned Windows tool contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/ci/windows_tools_prepare.ps1
          & ./scripts/ci/windows_download_test.ps1

  build:
    name: BUILD windows_amd64
    needs: lock-check
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Build and gate the native Windows tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force -Path '.ci/windows-tools-stage', '.ci/windows-tools-corpus' | Out-Null
          & ./scripts/build_tools_windows.ps1 -Target windows_amd64 `
            -StageRoot (Join-Path $PWD '.ci/windows-tools-stage') `
            -CorpusOutputPath (Join-Path $PWD '.ci/windows-tools-corpus/ecs-silesia-v1.corpus')

      - uses: actions/upload-artifact@v7
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: ecs-windows-tools-corpus-windows_amd64
          path: .ci/windows-tools-corpus
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  package:
    name: PACKAGE windows_amd64
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: tools-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: ecs-windows-tools-corpus-windows_amd64
          path: corpus-artifact

      - name: Install ZIP packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Normalize the verified Windows stage
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          source_dir=$(find tools-artifacts -type d -name windows_amd64 -print -quit)
          test -n "$source_dir"
          test -s "$source_dir/manifest.json"
          mkdir -p tools-stage/windows_amd64
          cp -a "$source_dir/." tools-stage/windows_amd64/
          chmod +x tools-stage/windows_amd64/bin/*

      - name: Package the Windows benchmark bundle
        run: |
          set -euo pipefail
          rm -rf .ci/windows-tools-dist .ci/windows-main-binaries
          mkdir -p .ci/windows-tools-dist/bundle .ci/windows-tools-dist/main .ci/windows-tools-dist/bootstrap
          ./scripts/package.sh --tools-stage tools-stage --target windows_amd64
          test -s dist/ecs-tools_windows_amd64.zip
          grep -F 'ecs-tools_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs-tools_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/bundle/

          VERSION=phase8-e2e COMMIT="${GITHUB_SHA}" OUTPUT_DIR=.ci/windows-main-binaries \
            ./scripts/cross.sh --target windows_amd64
          ./scripts/package.sh --binaries-dir .ci/windows-main-binaries --target windows_amd64
          test -s dist/ecs_windows_amd64.zip
          grep -F 'ecs_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/main/

          ./scripts/ci/windows_tools_package.sh --output-dir .ci/windows-tools-dist/bundle --corpus-path corpus-artifact/ecs-silesia-v1.corpus

          cp run.ps1 install.ps1 .ci/windows-tools-dist/bootstrap/
          printf '%s\n' "$GITHUB_SHA" > .ci/windows-tools-dist/CURRENT_COMMIT

      - uses: actions/upload-artifact@v7
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E-${{ matrix.server }}
    needs: package
    runs-on: windows-${{ matrix.server }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        server: ['2022', '2025']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist

      - name: Packaged runtime, production integration, bootstrap, and trace contract
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_e2e.ps1 -Label '${{ matrix.server }}' -ArtifactRoot (Join-Path $PWD '.ci/windows-tools-dist')

      - name: Upload E2E-${{ matrix.server }} diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ecs-windows-nexttrace-diagnostics-e2e-${{ matrix.server }}
          path: |
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-${{ matrix.server }}-*.json
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-${{ matrix.server }}-*.json.raw-*
            ${{ runner.temp }}/ecs-bootstrap-report-${{ matrix.server }}
            ${{ runner.temp }}/ecs-bootstrap-route-report-${{ matrix.server }}
            ${{ runner.temp }}/ecs-bootstrap-backtrace-report-${{ matrix.server }}
            ${{ runner.temp }}/ecs-bootstrap-route-ipv6-report-${{ matrix.server }}
            ${{ runner.temp }}/ecs-bootstrap-backtrace-ipv6-report-${{ matrix.server }}
          if-no-files-found: warn
          retention-days: 7
