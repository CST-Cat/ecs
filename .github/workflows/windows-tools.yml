            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $cliPath -PathType Leaf)) { throw 'building the current cmd/ecs Windows executable failed' }
            $hostileSource = Join-Path $hostileCliRoot 'hostile.go'
            $hostileBinary = Join-Path $hostileCliRoot 'hostile.exe'
            Set-Content -LiteralPath $hostileSource -Encoding utf8NoBOM -Value @(
              'package main'
              ''
              'import "os"'
              ''
              'func main() { os.Exit(97) }'
            )
            $savedGoModuleMode = $env:GO111MODULE
            $savedGoToolchain = $env:GOTOOLCHAIN
