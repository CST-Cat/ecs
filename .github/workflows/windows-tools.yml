            $env:ECS_PHASE1_CLI_DISK = $cliDiskPath
            $env:ECS_PHASE1_LOG = $standardUserLog
            $env:ECS_PHASE1_PARENT_PATH = $pathBefore.process.value
            if (-not ('EcsPhase1RestrictedProcess' -as [type])) {
