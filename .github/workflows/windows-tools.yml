name: windows-tools

# Windows benchmark bundle chain.  The builder and gate live in scripts/; this
# workflow only chooses the real runner, artifact hand-off, and dependency DAG.
#
# LOCK/CHECK -> BUILD windows_amd64 -> VERIFY-2022 || VERIFY-2025
#             -> canonical NextTrace IPv4/IPv6 gates + ECS-INTEGRATION
#             -> PACKAGE -> E2E-2022 || E2E-2025 (including route/backtrace)
#
# workflow_dispatch is a rehearsal only.  It produces seven-day artifacts and
# never has repository write permission or a release/tag side effect.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: LOCK/CHECK
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: LOCK/CHECK pinned Windows tool contract
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_prepare.ps1 -Action Check

  build:
    name: BUILD windows_amd64
    needs: lock-check
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Build and gate the native Windows tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force -Path '.ci/windows-tools-stage' | Out-Null
          & ./scripts/build_tools_windows.ps1 -Target windows_amd64 -StageRoot (Join-Path $PWD '.ci/windows-tools-stage')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage
          if-no-files-found: error
          retention-days: 7

  verify-2022:
    name: VERIFY-2022
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage-artifact

      - name: Prepare locked PE inspector and fixed corpus
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_prepare.ps1 -Action GateInputs -InputRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs') -DownloadRoot (Join-Path $env:RUNNER_TEMP 'ecs-windows-gate-downloads')
      - name: VERIFY-2022 PE manifest DLL and benchmark gate
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_verify.ps1 -Label 'VERIFY-2022' -StageArtifactRoot (Join-Path $PWD '.ci/windows-tools-stage-artifact') -GateInputsRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs')
      - name: VERIFY-2022 ecs.exe native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          go build -trimpath -o ecs.exe ./cmd/ecs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath ecs.exe -PathType Leaf)) { throw 'ecs.exe build failed' }
          & ./scripts/ci/windows_runtime_contract.ps1 -EcsPath (Join-Path $PWD 'ecs.exe') -Label 'VERIFY-2022' -RunNativeTests
      - name: VERIFY-2022 NextTrace canonical network gate
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_nexttrace.ps1 -Label 'VERIFY-2022' -EcsPath (Join-Path $PWD 'ecs.exe') -StageArtifactRoot (Join-Path $PWD '.ci/windows-tools-stage-artifact') -OutputRoot (Join-Path $env:RUNNER_TEMP 'ecs-nexttrace-verify-2022')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2022
          path: .ci/windows-tools-gate-inputs
          if-no-files-found: error
          retention-days: 7

      - name: Upload VERIFY-2022 NextTrace diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-nexttrace-diagnostics-verify-2022
          path: |
            ${{ runner.temp }}/ecs-nexttrace-capability-VERIFY-2022-*.json
            ${{ runner.temp }}/ecs-nexttrace-capability-VERIFY-2022-*.json.raw-*
            ${{ runner.temp }}/ecs-nexttrace-verify-2022
          if-no-files-found: warn
          retention-days: 7

  verify-2025:
    name: VERIFY-2025
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage-artifact

      - name: Prepare locked PE inspector and fixed corpus
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_prepare.ps1 -Action GateInputs -InputRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs') -DownloadRoot (Join-Path $env:RUNNER_TEMP 'ecs-windows-gate-downloads')
      - name: VERIFY-2025 PE manifest DLL and benchmark gate
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_verify.ps1 -Label 'VERIFY-2025' -StageArtifactRoot (Join-Path $PWD '.ci/windows-tools-stage-artifact') -GateInputsRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs')
      - name: VERIFY-2025 ecs.exe native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          go build -trimpath -o ecs.exe ./cmd/ecs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath ecs.exe -PathType Leaf)) { throw 'ecs.exe build failed' }
          & ./scripts/ci/windows_runtime_contract.ps1 -EcsPath (Join-Path $PWD 'ecs.exe') -Label 'VERIFY-2025' -RunNativeTests
      - name: VERIFY-2025 NextTrace canonical network gate
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_nexttrace.ps1 -Label 'VERIFY-2025' -EcsPath (Join-Path $PWD 'ecs.exe') -StageArtifactRoot (Join-Path $PWD '.ci/windows-tools-stage-artifact') -OutputRoot (Join-Path $env:RUNNER_TEMP 'ecs-nexttrace-verify-2025')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2025
          path: .ci/windows-tools-gate-inputs
          if-no-files-found: error
          retention-days: 7

      - name: Upload VERIFY-2025 NextTrace diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-nexttrace-diagnostics-verify-2025
          path: |
            ${{ runner.temp }}/ecs-nexttrace-capability-VERIFY-2025-*.json
            ${{ runner.temp }}/ecs-nexttrace-capability-VERIFY-2025-*.json.raw-*
            ${{ runner.temp }}/ecs-nexttrace-verify-2025
          if-no-files-found: warn
          retention-days: 7

  package:
    name: PACKAGE windows_amd64
    needs: [verify-2022, verify-2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: tools-artifacts

      - name: Normalize the verified Windows stage
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          source_dir=$(find tools-artifacts -type d -name windows_amd64 -print -quit)
          test -n "$source_dir"
          test -s "$source_dir/manifest.json"
          mkdir -p tools-stage/windows_amd64
          cp -a "$source_dir/." tools-stage/windows_amd64/
          chmod +x tools-stage/windows_amd64/bin/*

      - name: Package the Windows benchmark bundle
        run: |
          set -euo pipefail
          rm -rf .ci/windows-tools-dist .ci/windows-main-binaries
          mkdir -p .ci/windows-tools-dist/bundle .ci/windows-tools-dist/main .ci/windows-tools-dist/bootstrap
          ./scripts/package.sh --tools-stage tools-stage --target windows_amd64
          test -s dist/ecs-tools_windows_amd64.zip
          grep -F 'ecs-tools_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs-tools_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/bundle/

          VERSION=phase8-e2e COMMIT="${GITHUB_SHA}" OUTPUT_DIR=.ci/windows-main-binaries \
            ./scripts/cross.sh --target windows_amd64
          ./scripts/package.sh --binaries-dir .ci/windows-main-binaries --target windows_amd64
          test -s dist/ecs_windows_amd64.zip
          grep -F 'ecs_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/main/

          ./scripts/ci/windows_tools_package.sh --output-dir .ci/windows-tools-dist/bundle

          cp run.ps1 install.ps1 .ci/windows-tools-dist/bootstrap/
          printf '%s\n' "$GITHUB_SHA" > .ci/windows-tools-dist/CURRENT_COMMIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  integration-windows:
    name: ECS-INTEGRATION-${{ matrix.server }}
    needs: [verify-2022, verify-2025]
    runs-on: windows-${{ matrix.server }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        server: ['2022', '2025']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: ${{ runner.temp }}/ecs-windows-tools-stage-artifact

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-gate-inputs-${{ matrix.server }}
          path: ${{ runner.temp }}/ecs-windows-tools-gate-inputs-${{ matrix.server }}

      - name: Windows ECS frozen-tool integration
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_integration.ps1 -Server '${{ matrix.server }}' -StageArtifactRoot (Join-Path $env:RUNNER_TEMP 'ecs-windows-tools-stage-artifact') -GateInputsRoot (Join-Path $env:RUNNER_TEMP ('ecs-windows-tools-gate-inputs-' + '${{ matrix.server }}'))

  e2e-2022:
    name: E2E-2022
    needs: [package, verify-2022]
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2022
          path: .ci/windows-tools-gate-inputs

      - name: E2E-2022 packaged bundle and bootstrap contract
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_e2e.ps1 -Label '2022' -ArtifactRoot (Join-Path $PWD '.ci/windows-tools-dist') -GateInputsRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs')
      - name: Upload E2E-2022 NextTrace diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-nexttrace-diagnostics-e2e-2022
          path: |
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-2022-*.json
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-2022-*.json.raw-*
            ${{ runner.temp }}/ecs-bootstrap-report-2022
            ${{ runner.temp }}/ecs-bootstrap-route-report-2022
            ${{ runner.temp }}/ecs-bootstrap-backtrace-report-2022
          if-no-files-found: warn
          retention-days: 7

  e2e-2025:
    name: E2E-2025
    needs: [package, verify-2025]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2025
          path: .ci/windows-tools-gate-inputs

      - name: E2E-2025 packaged bundle and bootstrap contract
        shell: pwsh
        run: |
          & ./scripts/ci/windows_tools_e2e.ps1 -Label '2025' -ArtifactRoot (Join-Path $PWD '.ci/windows-tools-dist') -GateInputsRoot (Join-Path $PWD '.ci/windows-tools-gate-inputs')
      - name: Upload E2E-2025 NextTrace diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-nexttrace-diagnostics-e2e-2025
          path: |
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-2025-*.json
            ${{ runner.temp }}/ecs-nexttrace-capability-E2E-2025-*.json.raw-*
            ${{ runner.temp }}/ecs-bootstrap-report-2025
            ${{ runner.temp }}/ecs-bootstrap-route-report-2025
            ${{ runner.temp }}/ecs-bootstrap-backtrace-report-2025
          if-no-files-found: warn
          retention-days: 7
