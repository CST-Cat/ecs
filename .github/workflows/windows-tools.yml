name: windows-tools

# Windows benchmark bundle chain.  The builder and gate live in scripts/; this
# workflow only chooses the real runner, artifact hand-off, and dependency DAG.
#
# LOCK/CHECK -> BUILD windows_amd64 -> VERIFY-2022 || VERIFY-2025
#             -> ECS-INTEGRATION-2022 || ECS-INTEGRATION-2025
#             -> PACKAGE -> E2E-2022 || E2E-2025
#
# workflow_dispatch is a rehearsal only.  It produces seven-day artifacts and
# never has repository write permission or a release/tag side effect.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: LOCK/CHECK
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Parse PowerShell scripts and lock facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $paths = @(
            (Resolve-Path 'scripts/build_tools_windows.ps1').Path,
            (Resolve-Path 'scripts/ci/windows_tools_gate.ps1').Path,
            (Resolve-Path 'scripts/tools/windows/common.ps1').Path
          )
          $paths += @(Get-ChildItem 'scripts/tools/windows' -Filter '*.ps1' -File | ForEach-Object { $_.FullName })
          foreach ($path in $paths | Sort-Object -Unique) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for ${path}: $($errors -join '; ')"
            }
          }

          $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
          if ([string]$lock.schema_version -ne 'ecs.tools.lock/v1') { throw 'unexpected tools lock schema' }
          $windowsTarget = @($lock.architectures | Where-Object { $_.target -eq 'windows_amd64' })
          if ($windowsTarget.Count -ne 1 -or [string]$windowsTarget[0].goos -ne 'windows' -or [string]$windowsTarget[0].goarch -ne 'amd64') {
            throw 'windows_amd64 lock target is missing or ambiguous'
          }
          $wantTools = @('zstd', 'npb-ep', 'npb-ft', 'openssl', 'stream', 'fio')
          if ((@($lock.windows_tools) -join '|') -ne ($wantTools -join '|')) { throw 'Windows tool set drifted' }
          if (@($lock.windows_tools | Where-Object { $_ -eq 'nexttrace-tiny' -or $_ -eq 'ping' }).Count -ne 0) {
            throw 'unsupported tool entered the Windows bundle'
          }
          if (@($lock.windows_dll_allowlist).Count -eq 0) { throw 'Windows DLL allowlist is empty' }

          & ./scripts/ci/windows_tools_gate.ps1 -CheckOrdinaryUser
          if (-not $?) { throw 'ordinary-user execution evidence failed' }

          $params = & ./scripts/build_tools_windows.ps1 -Target windows_amd64 -PrintParams
          if (-not $?) { throw 'Windows builder lock/check failed' }
          $paramsText = $params -join "`n"
          foreach ($marker in @('target=windows_amd64', 'toolchain_mode=native', 'smoke_runner=direct', 'validation_scope=functional', 'performance_valid=false', 'nexttrace=unsupported')) {
            if ($paramsText -notmatch [regex]::Escape($marker)) { throw "builder parameters missing $marker" }
          }
          Write-Output 'LOCK/CHECK passed: pinned target, tool set, allowlist, PowerShell syntax, and ordinary-user contract'

  build:
    name: BUILD windows_amd64
    needs: lock-check
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Build and gate the native Windows tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force -Path '.ci/windows-tools-stage' | Out-Null
          & ./scripts/build_tools_windows.ps1 -Target windows_amd64 -StageRoot (Join-Path $PWD '.ci/windows-tools-stage')
          if (-not $?) { throw 'native Windows tools builder failed' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage
          if-no-files-found: error
          retention-days: 7

  verify-2022:
    name: VERIFY-2022
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage-artifact

      - name: Prepare locked PE inspector and fixed corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
          $inputRoot = Join-Path $PWD '.ci/windows-tools-gate-inputs'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'ecs-windows-gate-downloads'
          New-Item -ItemType Directory -Force -Path (Join-Path $inputRoot 'corpus'), (Join-Path $inputRoot 'inspector'), $downloadRoot | Out-Null

          $corpusZip = Join-Path $downloadRoot 'silesia.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $lock.corpus.source_url -OutFile $corpusZip
          if ((Get-FileHash -Algorithm SHA256 $corpusZip).Hash.ToLowerInvariant() -ne [string]$lock.corpus.source_sha256) { throw 'Silesia source hash mismatch' }
          $corpusExtract = Join-Path $downloadRoot 'silesia'
          Expand-Archive -LiteralPath $corpusZip -DestinationPath $corpusExtract -Force
          $corpus = Join-Path $inputRoot ('corpus\' + [string]$lock.corpus.name)
          $output = [IO.File]::Open($corpus, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            foreach ($member in @($lock.corpus.order)) {
              $memberPath = Join-Path $corpusExtract $member
              if (-not (Test-Path -LiteralPath $memberPath -PathType Leaf)) { throw "Silesia member missing: $member" }
              $input = [IO.File]::OpenRead($memberPath)
              try { $input.CopyTo($output) } finally { $input.Dispose() }
            }
          } finally { $output.Dispose() }
          if ((Get-Item $corpus).Length -ne [int64]$lock.corpus.bytes -or (Get-FileHash -Algorithm SHA256 $corpus).Hash.ToLowerInvariant() -ne [string]$lock.corpus.sha256) { throw 'fixed Silesia corpus mismatch' }

          $inspectorPackages = @(
            'mingw-w64-ucrt-x86_64-binutils',
            'mingw-w64-ucrt-x86_64-gettext-runtime',
            'mingw-w64-ucrt-x86_64-zlib',
            'mingw-w64-ucrt-x86_64-zstd',
            'mingw-w64-ucrt-x86_64-libiconv'
          )
          foreach ($packageName in $inspectorPackages) {
            $package = @($lock.windows_toolchain.packages | Where-Object { $_.name -eq $packageName })
            if ($package.Count -ne 1) { throw "locked inspector package is missing: $packageName" }
            $packageArchive = Join-Path $downloadRoot ($packageName + '.pkg.tar.zst')
            Invoke-WebRequest -UseBasicParsing -Uri $package[0].source_url -OutFile $packageArchive
            if ((Get-FileHash -Algorithm SHA256 $packageArchive).Hash.ToLowerInvariant() -ne [string]$package[0].source_sha256) { throw "package hash mismatch: $packageName" }
            & (Get-Command tar.exe -ErrorAction Stop).Source -xf $packageArchive -C (Join-Path $inputRoot 'inspector')
            if ($LASTEXITCODE -ne 0) { throw "locked package extraction failed: $packageName" }
          }
          $objdump = Join-Path $inputRoot 'inspector\ucrt64\bin\objdump.exe'
          if (-not (Test-Path -LiteralPath $objdump -PathType Leaf)) { throw 'locked objdump is missing' }

      - name: VERIFY-2022 PE manifest DLL and benchmark gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
          $stageItem = Get-ChildItem '.ci/windows-tools-stage-artifact' -Directory -Filter 'windows_amd64' -Recurse | Select-Object -First 1
          if ($null -eq $stageItem) { throw 'downloaded Windows stage is missing windows_amd64' }
          $stage = $stageItem.FullName
          $corpusItem = Get-ChildItem '.ci/windows-tools-gate-inputs' -File -Filter ([string]$lock.corpus.name) -Recurse | Select-Object -First 1
          $objdumpItem = Get-ChildItem '.ci/windows-tools-gate-inputs' -File -Filter 'objdump.exe' -Recurse | Select-Object -First 1
          if ($null -eq $corpusItem -or $null -eq $objdumpItem) { throw 'locked gate inputs are incomplete' }
          $corpus = $corpusItem.FullName
          $objdump = $objdumpItem.FullName
          & ./scripts/ci/windows_tools_gate.ps1 -StageRoot $stage -ManifestPath (Join-Path $stage 'manifest.json') -LockPath (Join-Path $PWD 'tools/lock.json') -CorpusPath $corpus -ObjdumpPath $objdump
          if (-not $?) { throw 'VERIFY-2022 gate failed' }
          Write-Output 'VERIFY-2022 passed: PE/manifest/DLL allowlist, locked versions, and real smoke workloads; performance_valid=false; route/backtrace unsupported; NextTrace not bundled'

      - name: VERIFY-2022 ecs.exe native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          go build -trimpath -o ecs.exe ./cmd/ecs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath ecs.exe -PathType Leaf)) { throw 'ecs.exe build failed' }
          function Invoke-Ecs {
            param([Parameter(Mandatory, Position = 0)][string[]]$Arguments)
            $output = @(& .\ecs.exe @Arguments 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "ecs.exe $($Arguments -join ' ') failed" }
            return $output
          }

          function Get-JsonPropertyValue {
            param(
              [Parameter(Mandatory)][object]$Object,
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][string]$Context
            )
            if ($null -eq $Object) { throw "$Context JSON object is null while reading '$Name'" }
            $objects = @($Object)
            if ($objects.Count -ne 1) { throw "$Context expected one JSON object while reading '$Name', got $($objects.Count)" }
            $properties = @($objects[0].PSObject.Properties | Where-Object { $_.Name -ieq $Name })
            if ($properties.Count -ne 1) {
              $available = @($objects[0].PSObject.Properties | ForEach-Object { $_.Name }) -join ', '
              throw "$Context missing JSON property '$Name'; available properties: $available"
            }
            if ($null -eq $properties[0].Value) { throw "$Context JSON property '$Name' is null" }
            return $properties[0].Value
          }

          function Get-SystemFieldRaw {
            param(
              [Parameter(Mandatory)][object]$Result,
              [Parameter(Mandatory)][string]$Key
            )
            $fields = @(Get-JsonPropertyValue -Object $Result -Name 'fields' -Context 'system result')
            $fieldMatches = @($fields | Where-Object { [string]$_.key -eq $Key })
            if ($fieldMatches.Count -ne 1) { throw "system JSON must contain one field named $Key" }
            $value = Get-JsonPropertyValue -Object $fieldMatches[0] -Name 'value' -Context "system JSON field $Key"
            $raw = [string](Get-JsonPropertyValue -Object $value -Name 'raw' -Context "system JSON field $Key value")
            if ([string]::IsNullOrWhiteSpace($raw)) { throw "system JSON field $Key is empty" }
            return $raw
          }

          function Convert-PositiveMachineBytes {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<number>[0-9]+(?:\.[0-9]+)?)\s*(?<unit>B|KiB|MiB|GiB|TiB|PiB)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable byte value: $Raw" }
            $number = [double]::Parse($match.Groups['number'].Value, [Globalization.CultureInfo]::InvariantCulture)
            $exponent = switch ($match.Groups['unit'].Value) {
              'B' { 0 }
              'KiB' { 1 }
              'MiB' { 2 }
              'GiB' { 3 }
              'TiB' { 4 }
              'PiB' { 5 }
              default { throw "$Name has an unknown byte unit: $Raw" }
            }
            $bytes = $number * [math]::Pow(1024, $exponent)
            if ([double]::IsNaN($bytes) -or [double]::IsInfinity($bytes) -or $bytes -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $bytes
          }

          function Convert-PositiveMachineSeconds {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<seconds>[0-9]+(?:\.[0-9]+)?)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable seconds value: $Raw" }
            $seconds = [double]::Parse($match.Groups['seconds'].Value, [Globalization.CultureInfo]::InvariantCulture)
            if ([double]::IsNaN($seconds) -or [double]::IsInfinity($seconds) -or $seconds -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $seconds
          }

          function Assert-WindowsSystemFacts {
            param([Parameter(Mandatory)][object]$Report)
            $schemaVersion = [string](Get-JsonPropertyValue -Object $Report -Name 'schema_version' -Context 'system report')
            if ($schemaVersion -ne 'ecs.report/v1') { throw "system report has unexpected schema_version: $schemaVersion" }
            $results = @(Get-JsonPropertyValue -Object $Report -Name 'results' -Context 'system report')
            $systemMatches = @($results | Where-Object { [string]$_.id -eq 'system' })
            if ($systemMatches.Count -ne 1) { throw 'system JSON has no unique system result' }
            $system = $systemMatches[0]
            $fieldsProperty = @($system.PSObject.Properties | Where-Object { $_.Name -ieq 'fields' })
            if ($fieldsProperty.Count -ne 1) {
              $status = [string](Get-JsonPropertyValue -Object $system -Name 'status' -Context 'system result')
              $evidence = Get-JsonPropertyValue -Object $system -Name 'evidence' -Context 'system result'
              $evidenceValid = Get-JsonPropertyValue -Object $evidence -Name 'valid' -Context 'system evidence'
              $evidenceExpected = Get-JsonPropertyValue -Object $evidence -Name 'expected' -Context 'system evidence'
              $evidenceUnit = [string](Get-JsonPropertyValue -Object $evidence -Name 'unit' -Context 'system evidence')
              $failureProperty = @($system.PSObject.Properties | Where-Object { $_.Name -ieq 'failures' })
              $failureText = '<missing>'
              if ($failureProperty.Count -eq 1) {
                $failureItems = @($failureProperty[0].Value)
                if ($failureItems.Count -eq 0) {
                  $failureText = '<empty>'
                } else {
                  $failureText = @($failureItems | ForEach-Object {
                    [string](Get-JsonPropertyValue -Object $_ -Name 'message' -Context 'system failure')
                  }) -join ' | '
                }
              }
              throw "system JSON has no structured facts; status=$status evidence.valid=$evidenceValid evidence.expected=$evidenceExpected evidence.unit=$evidenceUnit failures=$failureText"
            }
            $os = Get-SystemFieldRaw -Result $system -Key 'os'
            if ($os -notmatch '(?i)^Windows(?:\s+Server)?\b') { throw "system OS is not Windows: $os" }
            if ((Get-SystemFieldRaw -Result $system -Key 'arch') -ne 'amd64') { throw 'system arch is not amd64' }
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'memory_total') -Name 'memory_total')
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'disk_total') -Name 'disk_total')
            [void](Convert-PositiveMachineSeconds -Raw (Get-SystemFieldRaw -Result $system -Key 'uptime_seconds') -Name 'uptime_seconds')
            $measurements = @(Get-JsonPropertyValue -Object $system -Name 'measurements' -Context 'system result')
            $logicalMatches = @($measurements | Where-Object { [string]$_.key -eq 'logical_cpus' })
            if ($logicalMatches.Count -ne 1) { throw 'system JSON must contain one logical_cpus measurement' }
            $logicalCPUs = [double](Get-JsonPropertyValue -Object $logicalMatches[0] -Name 'value' -Context 'logical_cpus measurement')
            if ([double]::IsNaN($logicalCPUs) -or [double]::IsInfinity($logicalCPUs) -or $logicalCPUs -le 0) {
              throw "logical_cpus is not positive: $logicalCPUs"
            }
          }

          function Assert-EcsLoopbackLatencyReport {
            param(
              [Parameter(Mandatory)][string]$Root,
              [Parameter(Mandatory)][string]$Language
            )
            $reportItem = Get-ChildItem -LiteralPath $Root -Filter '*.json' -File -Recurse | Select-Object -First 1
            if ($null -eq $reportItem) { throw "loopback $Language JSON report was not written" }
            $report = Get-Content -Raw -LiteralPath $reportItem.FullName | ConvertFrom-Json
            if ([string]$report.schema_version -ne 'ecs.report/v1') {
              throw "loopback $Language JSON has unexpected schema_version: $($report.schema_version)"
            }
            $latencyMatches = @($report.results | Where-Object { [string]$_.id -eq 'latency' })
            if ($latencyMatches.Count -ne 1) { throw "loopback $Language JSON has no unique latency result" }
            $icmpMeasurements = @($latencyMatches[0].measurements | Where-Object {
              [string]$_.key -match '^icmp_.*_loopback_ipv4$' -and [string]$_.method -eq 'icmp-echo-v1'
            })
            if ($icmpMeasurements.Count -eq 0) {
              throw "loopback $Language JSON has no native ICMP measurement"
            }
            $lossMatches = @($latencyMatches[0].measurements | Where-Object { [string]$_.key -eq 'icmp_loss_percent_loopback_ipv4' -and [string]$_.method -eq 'icmp-echo-v1' })
            if ($lossMatches.Count -ne 1 -or [double]$lossMatches[0].value -ne 0) {
              throw "loopback $Language JSON did not report zero native ICMP loss"
            }
            if (@($latencyMatches[0].measurements | Where-Object { [string]$_.key -match '^icmp_' -and [string]$_.method -ne 'icmp-echo-v1' }).Count -ne 0) {
              throw "loopback $Language JSON contains an ICMP measurement with an unexpected method"
            }
          }

          if (((Invoke-Ecs @('--version')) -join "`n") -notmatch '(?i)ecs\s') { throw '--version failed' }
          $list = (Invoke-Ecs @('list')) -join "`n"
          if ($list -notmatch 'system') { throw 'list failed' }
          $plan = ((Invoke-Ecs @('plan', '--profile', 'standard')) -join "`n") | ConvertFrom-Json
          if ([string]$plan.profile -ne 'standard' -or [string]$plan.schema_version -ne 'ecs.plan/v1') { throw 'standard plan failed' }
          $systemRoot = Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-system'
          [void](Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'json', '--output', $systemRoot, '--no-color'))
          $systemFile = Get-ChildItem $systemRoot -File -Filter '*.json' -Recurse | Select-Object -First 1
          if ($null -eq $systemFile) { throw 'system JSON runtime failed' }
          $systemReport = Get-Content -Raw $systemFile.FullName | ConvertFrom-Json
          Assert-WindowsSystemFacts -Report $systemReport
          $textRoot = Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-text'
          [void](Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', $textRoot, '--no-color'))
          $textFile = Get-ChildItem $textRoot -File -Filter '*.md' -Recurse | Select-Object -First 1
          if ($null -eq $textFile -or $textFile.Length -eq 0) { throw 'system text runtime failed' }
          $redirected = Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-redirected.txt'
          & .\ecs.exe run --lang en --only system --yes --format md --output (Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-text') *> $redirected
          if ($LASTEXITCODE -ne 0) { throw 'redirected ecs.exe run failed' }
          if ((Get-Content -Raw $redirected) -match "`e\[") { throw 'redirected output contains ANSI escape sequences' }
          $env:NO_COLOR = ''
          try {
            $noColorOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-no-color')))
            if (($noColorOutput -join "`n") -match "`e\[") { throw 'NO_COLOR did not suppress ANSI output' }
          } finally { Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue }
          $noColorFlagOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-verify-2022-no-color-flag'), '--no-color'))
          if (($noColorFlagOutput -join "`n") -match "`e\[") { throw '--no-color did not suppress ANSI output' }
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          try {
            $port = $listener.LocalEndpoint.Port
            foreach ($language in @('en-US', 'zh-CN')) {
              $latencyRoot = Join-Path $env:RUNNER_TEMP ("ecs-verify-2022-loopback-$language")
              [void](Invoke-Ecs @('run', '--lang', $language, '--only', 'latency', '--exposure', 'any', '--ip-version', '4', '--latency-attempts', '2', '--latency-targets', "loopback=127.0.0.1:$port", '--yes', '--format', 'json', '--output', $latencyRoot, '--no-color'))
              Assert-EcsLoopbackLatencyReport -Root $latencyRoot -Language $language
            }
          } finally { $listener.Stop() }
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPLoopback$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2022 TestWindowsNativeICMPLoopback failed' }
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPDeadlineDoesNotHang$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2022 TestWindowsNativeICMPDeadlineDoesNotHang failed' }
          go test ./internal/probe -run '^TestProbeCommandWindowsProcessTree$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2022 TestProbeCommandWindowsProcessTree failed' }
          go test ./internal/ui -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2022 internal/ui tests failed' }
          Write-Output 'VERIFY-2022 ecs.exe runtime passed: version/list/plan, system JSON, native loopback ICMP, process-tree cancellation, TTY/redirect, NO_COLOR, and --no-color'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2022
          path: .ci/windows-tools-gate-inputs
          if-no-files-found: error
          retention-days: 7

  verify-2025:
    name: VERIFY-2025
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: .ci/windows-tools-stage-artifact

      - name: Prepare locked PE inspector and fixed corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
          $inputRoot = Join-Path $PWD '.ci/windows-tools-gate-inputs'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'ecs-windows-gate-downloads'
          New-Item -ItemType Directory -Force -Path (Join-Path $inputRoot 'corpus'), (Join-Path $inputRoot 'inspector'), $downloadRoot | Out-Null

          $corpusZip = Join-Path $downloadRoot 'silesia.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $lock.corpus.source_url -OutFile $corpusZip
          if ((Get-FileHash -Algorithm SHA256 $corpusZip).Hash.ToLowerInvariant() -ne [string]$lock.corpus.source_sha256) { throw 'Silesia source hash mismatch' }
          $corpusExtract = Join-Path $downloadRoot 'silesia'
          Expand-Archive -LiteralPath $corpusZip -DestinationPath $corpusExtract -Force
          $corpus = Join-Path $inputRoot ('corpus\' + [string]$lock.corpus.name)
          $output = [IO.File]::Open($corpus, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            foreach ($member in @($lock.corpus.order)) {
              $memberPath = Join-Path $corpusExtract $member
              if (-not (Test-Path -LiteralPath $memberPath -PathType Leaf)) { throw "Silesia member missing: $member" }
              $input = [IO.File]::OpenRead($memberPath)
              try { $input.CopyTo($output) } finally { $input.Dispose() }
            }
          } finally { $output.Dispose() }
          if ((Get-Item $corpus).Length -ne [int64]$lock.corpus.bytes -or (Get-FileHash -Algorithm SHA256 $corpus).Hash.ToLowerInvariant() -ne [string]$lock.corpus.sha256) { throw 'fixed Silesia corpus mismatch' }

          $inspectorPackages = @(
            'mingw-w64-ucrt-x86_64-binutils',
            'mingw-w64-ucrt-x86_64-gettext-runtime',
            'mingw-w64-ucrt-x86_64-zlib',
            'mingw-w64-ucrt-x86_64-zstd',
            'mingw-w64-ucrt-x86_64-libiconv'
          )
          foreach ($packageName in $inspectorPackages) {
            $package = @($lock.windows_toolchain.packages | Where-Object { $_.name -eq $packageName })
            if ($package.Count -ne 1) { throw "locked inspector package is missing: $packageName" }
            $packageArchive = Join-Path $downloadRoot ($packageName + '.pkg.tar.zst')
            Invoke-WebRequest -UseBasicParsing -Uri $package[0].source_url -OutFile $packageArchive
            if ((Get-FileHash -Algorithm SHA256 $packageArchive).Hash.ToLowerInvariant() -ne [string]$package[0].source_sha256) { throw "package hash mismatch: $packageName" }
            & (Get-Command tar.exe -ErrorAction Stop).Source -xf $packageArchive -C (Join-Path $inputRoot 'inspector')
            if ($LASTEXITCODE -ne 0) { throw "locked package extraction failed: $packageName" }
          }
          $objdump = Join-Path $inputRoot 'inspector\ucrt64\bin\objdump.exe'
          if (-not (Test-Path -LiteralPath $objdump -PathType Leaf)) { throw 'locked objdump is missing' }

      - name: VERIFY-2025 PE manifest DLL and benchmark gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
          $stageItem = Get-ChildItem '.ci/windows-tools-stage-artifact' -Directory -Filter 'windows_amd64' -Recurse | Select-Object -First 1
          if ($null -eq $stageItem) { throw 'downloaded Windows stage is missing windows_amd64' }
          $stage = $stageItem.FullName
          $corpusItem = Get-ChildItem '.ci/windows-tools-gate-inputs' -File -Filter ([string]$lock.corpus.name) -Recurse | Select-Object -First 1
          $objdumpItem = Get-ChildItem '.ci/windows-tools-gate-inputs' -File -Filter 'objdump.exe' -Recurse | Select-Object -First 1
          if ($null -eq $corpusItem -or $null -eq $objdumpItem) { throw 'locked gate inputs are incomplete' }
          $corpus = $corpusItem.FullName
          $objdump = $objdumpItem.FullName
          & ./scripts/ci/windows_tools_gate.ps1 -StageRoot $stage -ManifestPath (Join-Path $stage 'manifest.json') -LockPath (Join-Path $PWD 'tools/lock.json') -CorpusPath $corpus -ObjdumpPath $objdump
          if (-not $?) { throw 'VERIFY-2025 gate failed' }
          Write-Output 'VERIFY-2025 passed: PE/manifest/DLL allowlist, locked versions, and real smoke workloads; performance_valid=false; route/backtrace unsupported; NextTrace not bundled'

      - name: VERIFY-2025 ecs.exe native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          go build -trimpath -o ecs.exe ./cmd/ecs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath ecs.exe -PathType Leaf)) { throw 'ecs.exe build failed' }
          function Invoke-Ecs {
            param([Parameter(Mandatory, Position = 0)][string[]]$Arguments)
            $output = @(& .\ecs.exe @Arguments 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "ecs.exe $($Arguments -join ' ') failed" }
            return $output
          }

          function Get-JsonPropertyValue {
            param(
              [Parameter(Mandatory)][object]$Object,
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][string]$Context
            )
            if ($null -eq $Object) { throw "$Context JSON object is null while reading '$Name'" }
            $objects = @($Object)
            if ($objects.Count -ne 1) { throw "$Context expected one JSON object while reading '$Name', got $($objects.Count)" }
            $properties = @($objects[0].PSObject.Properties | Where-Object { $_.Name -ieq $Name })
            if ($properties.Count -ne 1) {
              $available = @($objects[0].PSObject.Properties | ForEach-Object { $_.Name }) -join ', '
              throw "$Context missing JSON property '$Name'; available properties: $available"
            }
            if ($null -eq $properties[0].Value) { throw "$Context JSON property '$Name' is null" }
            return $properties[0].Value
          }

          function Get-SystemFieldRaw {
            param(
              [Parameter(Mandatory)][object]$Result,
              [Parameter(Mandatory)][string]$Key
            )
            $fields = @(Get-JsonPropertyValue -Object $Result -Name 'fields' -Context 'system result')
            $fieldMatches = @($fields | Where-Object { [string]$_.key -eq $Key })
            if ($fieldMatches.Count -ne 1) { throw "system JSON must contain one field named $Key" }
            $value = Get-JsonPropertyValue -Object $fieldMatches[0] -Name 'value' -Context "system JSON field $Key"
            $raw = [string](Get-JsonPropertyValue -Object $value -Name 'raw' -Context "system JSON field $Key value")
            if ([string]::IsNullOrWhiteSpace($raw)) { throw "system JSON field $Key is empty" }
            return $raw
          }

          function Convert-PositiveMachineBytes {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<number>[0-9]+(?:\.[0-9]+)?)\s*(?<unit>B|KiB|MiB|GiB|TiB|PiB)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable byte value: $Raw" }
            $number = [double]::Parse($match.Groups['number'].Value, [Globalization.CultureInfo]::InvariantCulture)
            $exponent = switch ($match.Groups['unit'].Value) {
              'B' { 0 }
              'KiB' { 1 }
              'MiB' { 2 }
              'GiB' { 3 }
              'TiB' { 4 }
              'PiB' { 5 }
              default { throw "$Name has an unknown byte unit: $Raw" }
            }
            $bytes = $number * [math]::Pow(1024, $exponent)
            if ([double]::IsNaN($bytes) -or [double]::IsInfinity($bytes) -or $bytes -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $bytes
          }

          function Convert-PositiveMachineSeconds {
            param(
              [Parameter(Mandatory)][string]$Raw,
              [Parameter(Mandatory)][string]$Name
            )
            $match = [regex]::Match($Raw, '^\s*(?<seconds>[0-9]+(?:\.[0-9]+)?)\s*$')
            if (-not $match.Success) { throw "$Name is not a parseable seconds value: $Raw" }
            $seconds = [double]::Parse($match.Groups['seconds'].Value, [Globalization.CultureInfo]::InvariantCulture)
            if ([double]::IsNaN($seconds) -or [double]::IsInfinity($seconds) -or $seconds -le 0) {
              throw "$Name is not positive: $Raw"
            }
            return $seconds
          }

          function Assert-WindowsSystemFacts {
            param([Parameter(Mandatory)][object]$Report)
            $schemaVersion = [string](Get-JsonPropertyValue -Object $Report -Name 'schema_version' -Context 'system report')
            if ($schemaVersion -ne 'ecs.report/v1') { throw "system report has unexpected schema_version: $schemaVersion" }
            $results = @(Get-JsonPropertyValue -Object $Report -Name 'results' -Context 'system report')
            $systemMatches = @($results | Where-Object { [string]$_.id -eq 'system' })
            if ($systemMatches.Count -ne 1) { throw 'system JSON has no unique system result' }
            $system = $systemMatches[0]
            $fieldsProperty = @($system.PSObject.Properties | Where-Object { $_.Name -ieq 'fields' })
            if ($fieldsProperty.Count -ne 1) {
              $status = [string](Get-JsonPropertyValue -Object $system -Name 'status' -Context 'system result')
              $evidence = Get-JsonPropertyValue -Object $system -Name 'evidence' -Context 'system result'
              $evidenceValid = Get-JsonPropertyValue -Object $evidence -Name 'valid' -Context 'system evidence'
              $evidenceExpected = Get-JsonPropertyValue -Object $evidence -Name 'expected' -Context 'system evidence'
              $evidenceUnit = [string](Get-JsonPropertyValue -Object $evidence -Name 'unit' -Context 'system evidence')
              $failureProperty = @($system.PSObject.Properties | Where-Object { $_.Name -ieq 'failures' })
              $failureText = '<missing>'
              if ($failureProperty.Count -eq 1) {
                $failureItems = @($failureProperty[0].Value)
                if ($failureItems.Count -eq 0) {
                  $failureText = '<empty>'
                } else {
                  $failureText = @($failureItems | ForEach-Object {
                    [string](Get-JsonPropertyValue -Object $_ -Name 'message' -Context 'system failure')
                  }) -join ' | '
                }
              }
              throw "system JSON has no structured facts; status=$status evidence.valid=$evidenceValid evidence.expected=$evidenceExpected evidence.unit=$evidenceUnit failures=$failureText"
            }
            $os = Get-SystemFieldRaw -Result $system -Key 'os'
            if ($os -notmatch '(?i)^Windows(?:\s+Server)?\b') { throw "system OS is not Windows: $os" }
            if ((Get-SystemFieldRaw -Result $system -Key 'arch') -ne 'amd64') { throw 'system arch is not amd64' }
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'memory_total') -Name 'memory_total')
            [void](Convert-PositiveMachineBytes -Raw (Get-SystemFieldRaw -Result $system -Key 'disk_total') -Name 'disk_total')
            [void](Convert-PositiveMachineSeconds -Raw (Get-SystemFieldRaw -Result $system -Key 'uptime_seconds') -Name 'uptime_seconds')
            $measurements = @(Get-JsonPropertyValue -Object $system -Name 'measurements' -Context 'system result')
            $logicalMatches = @($measurements | Where-Object { [string]$_.key -eq 'logical_cpus' })
            if ($logicalMatches.Count -ne 1) { throw 'system JSON must contain one logical_cpus measurement' }
            $logicalCPUs = [double](Get-JsonPropertyValue -Object $logicalMatches[0] -Name 'value' -Context 'logical_cpus measurement')
            if ([double]::IsNaN($logicalCPUs) -or [double]::IsInfinity($logicalCPUs) -or $logicalCPUs -le 0) {
              throw "logical_cpus is not positive: $logicalCPUs"
            }
          }

          if (((Invoke-Ecs @('--version')) -join "`n") -notmatch '(?i)ecs\s') { throw '--version failed' }
          $list = (Invoke-Ecs @('list')) -join "`n"
          if ($list -notmatch 'system') { throw 'list failed' }
          $plan = ((Invoke-Ecs @('plan', '--profile', 'standard')) -join "`n") | ConvertFrom-Json
          if ([string]$plan.profile -ne 'standard' -or [string]$plan.schema_version -ne 'ecs.plan/v1') { throw 'standard plan failed' }
          function Assert-EcsLoopbackLatencyReport {
            param(
              [Parameter(Mandatory)][string]$Root,
              [Parameter(Mandatory)][string]$Language
            )
            $reportItem = Get-ChildItem -LiteralPath $Root -Filter '*.json' -File -Recurse | Select-Object -First 1
            if ($null -eq $reportItem) { throw "loopback $Language JSON report was not written" }
            $report = Get-Content -Raw -LiteralPath $reportItem.FullName | ConvertFrom-Json
            if ([string]$report.schema_version -ne 'ecs.report/v1') {
              throw "loopback $Language JSON has unexpected schema_version: $($report.schema_version)"
            }
            $latencyMatches = @($report.results | Where-Object { [string]$_.id -eq 'latency' })
            if ($latencyMatches.Count -ne 1) { throw "loopback $Language JSON has no unique latency result" }
            $icmpMeasurements = @($latencyMatches[0].measurements | Where-Object {
              [string]$_.key -match '^icmp_.*_loopback_ipv4$' -and [string]$_.method -eq 'icmp-echo-v1'
            })
            if ($icmpMeasurements.Count -eq 0) {
              throw "loopback $Language JSON has no native ICMP measurement"
            }
            $lossMatches = @($latencyMatches[0].measurements | Where-Object { [string]$_.key -eq 'icmp_loss_percent_loopback_ipv4' -and [string]$_.method -eq 'icmp-echo-v1' })
            if ($lossMatches.Count -ne 1 -or [double]$lossMatches[0].value -ne 0) {
              throw "loopback $Language JSON did not report zero native ICMP loss"
            }
            if (@($latencyMatches[0].measurements | Where-Object { [string]$_.key -match '^icmp_' -and [string]$_.method -ne 'icmp-echo-v1' }).Count -ne 0) {
              throw "loopback $Language JSON contains an ICMP measurement with an unexpected method"
            }
          }

          $systemRoot = Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-system'
          [void](Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'json', '--output', $systemRoot, '--no-color'))
          $systemFile = Get-ChildItem $systemRoot -File -Filter '*.json' -Recurse | Select-Object -First 1
          if ($null -eq $systemFile) { throw 'system JSON runtime failed' }
          $systemReport = Get-Content -Raw $systemFile.FullName | ConvertFrom-Json
          Assert-WindowsSystemFacts -Report $systemReport
          $textRoot = Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-text'
          [void](Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', $textRoot, '--no-color'))
          $textFile = Get-ChildItem $textRoot -File -Filter '*.md' -Recurse | Select-Object -First 1
          if ($null -eq $textFile -or $textFile.Length -eq 0) { throw 'system text runtime failed' }
          $redirected = Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-redirected.txt'
          & .\ecs.exe run --lang en --only system --yes --format md --output (Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-text') *> $redirected
          if ($LASTEXITCODE -ne 0) { throw 'redirected ecs.exe run failed' }
          if ((Get-Content -Raw $redirected) -match "`e\[") { throw 'redirected output contains ANSI escape sequences' }
          $env:NO_COLOR = ''
          try {
            $noColorOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-no-color')))
            if (($noColorOutput -join "`n") -match "`e\[") { throw 'NO_COLOR did not suppress ANSI output' }
          } finally { Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue }
          $noColorFlagOutput = @(Invoke-Ecs @('run', '--lang', 'en', '--only', 'system', '--yes', '--format', 'md', '--output', (Join-Path $env:RUNNER_TEMP 'ecs-verify-2025-no-color-flag'), '--no-color'))
          if (($noColorFlagOutput -join "`n") -match "`e\[") { throw '--no-color did not suppress ANSI output' }
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          try {
            $port = $listener.LocalEndpoint.Port
            foreach ($language in @('en-US', 'zh-CN')) {
              $latencyRoot = Join-Path $env:RUNNER_TEMP ("ecs-verify-2025-loopback-$language")
              [void](Invoke-Ecs @('run', '--lang', $language, '--only', 'latency', '--exposure', 'any', '--ip-version', '4', '--latency-attempts', '2', '--latency-targets', "loopback=127.0.0.1:$port", '--yes', '--format', 'json', '--output', $latencyRoot, '--no-color'))
              Assert-EcsLoopbackLatencyReport -Root $latencyRoot -Language $language
            }
          } finally { $listener.Stop() }
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPLoopback$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2025 TestWindowsNativeICMPLoopback failed' }
          go test -tags=windows ./internal/probe -run '^TestWindowsNativeICMPDeadlineDoesNotHang$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2025 TestWindowsNativeICMPDeadlineDoesNotHang failed' }
          go test ./internal/probe -run '^TestProbeCommandWindowsProcessTree$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2025 TestProbeCommandWindowsProcessTree failed' }
          go test ./internal/ui -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'VERIFY-2025 internal/ui tests failed' }
          Write-Output 'VERIFY-2025 ecs.exe runtime passed: version/list/plan, system JSON, native loopback ICMP, process-tree cancellation, TTY/redirect, NO_COLOR, and --no-color'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-gate-inputs-2025
          path: .ci/windows-tools-gate-inputs
          if-no-files-found: error
          retention-days: 7

  package:
    name: PACKAGE windows_amd64
    needs: [verify-2022, verify-2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: tools-artifacts

      - name: Normalize the verified Windows stage
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          source_dir=$(find tools-artifacts -type d -name windows_amd64 -print -quit)
          test -n "$source_dir"
          test -s "$source_dir/manifest.json"
          mkdir -p tools-stage/windows_amd64
          cp -a "$source_dir/." tools-stage/windows_amd64/
          chmod +x tools-stage/windows_amd64/bin/*

      - name: Package the Windows benchmark bundle
        run: |
          set -euo pipefail
          rm -rf .ci/windows-tools-dist .ci/windows-main-binaries .ci/silesia-source .ci/windows-corpus
          mkdir -p .ci/windows-tools-dist/bundle .ci/windows-tools-dist/main .ci/windows-tools-dist/bootstrap .ci/silesia-source
          ./scripts/package.sh --tools-stage tools-stage --target windows_amd64
          test -s dist/ecs-tools_windows_amd64.zip
          grep -F 'ecs-tools_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs-tools_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/bundle/

          VERSION=phase8-e2e COMMIT="${GITHUB_SHA}" OUTPUT_DIR=.ci/windows-main-binaries \
            ./scripts/cross.sh --target windows_amd64
          ./scripts/package.sh --binaries-dir .ci/windows-main-binaries --target windows_amd64
          test -s dist/ecs_windows_amd64.zip
          grep -F 'ecs_windows_amd64.zip' dist/checksums.txt
          cp dist/ecs_windows_amd64.zip dist/checksums.txt .ci/windows-tools-dist/main/

          corpus_source=$(jq -er '.corpus.source_url' tools/lock.json)
          corpus_source_sha=$(jq -er '.corpus.source_sha256' tools/lock.json)
          corpus_name=$(jq -er '.corpus.name' tools/lock.json)
          corpus_archive=$(jq -er '.corpus.archive' tools/lock.json)
          corpus_bytes=$(jq -er '.corpus.bytes' tools/lock.json)
          corpus_sha=$(jq -er '.corpus.sha256' tools/lock.json)
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output .ci/silesia-source/silesia.zip "$corpus_source"
          printf '%s  %s\n' "$corpus_source_sha" .ci/silesia-source/silesia.zip | sha256sum --check --status
          unzip -q .ci/silesia-source/silesia.zip -d .ci/silesia-source/extracted
          mkdir -p .ci/windows-corpus
          while IFS= read -r member; do
            cat ".ci/silesia-source/extracted/$member" >> ".ci/windows-corpus/$corpus_name"
          done < <(jq -er '.corpus.order[]' tools/lock.json)
          test "$(wc -c < ".ci/windows-corpus/$corpus_name")" -eq "$corpus_bytes"
          test "$(sha256sum ".ci/windows-corpus/$corpus_name" | cut -d' ' -f1)" = "$corpus_sha"
          tar -C .ci/windows-corpus --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -czf ".ci/windows-tools-dist/bundle/$corpus_archive" "$corpus_name"
          (cd .ci/windows-tools-dist/bundle && sha256sum "$corpus_archive" >> checksums.txt)

          cp run.ps1 install.ps1 .ci/windows-tools-dist/bootstrap/
          printf '%s\n' "$GITHUB_SHA" > .ci/windows-tools-dist/CURRENT_COMMIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-windows-tools-dist
          path: .ci/windows-tools-dist
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  integration-windows:
    name: ECS-INTEGRATION-${{ matrix.server }}
    needs: [verify-2022, verify-2025]
    runs-on: windows-${{ matrix.server }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        server: ['2022', '2025']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-stage-windows_amd64
          path: ${{ runner.temp }}/ecs-windows-tools-stage-artifact

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-windows-tools-gate-inputs-${{ matrix.server }}
          path: ${{ runner.temp }}/ecs-windows-tools-gate-inputs-${{ matrix.server }}

      - name: Windows ECS frozen-tool integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-PathEvidence {
            param([AllowNull()][string]$Value)
            $present = $null -ne $Value
            $text = if ($present) { $Value } else { '' }
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $digest = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
            return [ordered]@{
              present = $present
              length = $text.Length
              sha256 = $digest
              value = $text
            }
          }

          function Get-PathSnapshot {
            $processPath = [Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::Process)
            return [ordered]@{
              process = Get-PathEvidence $processPath
              machine = Get-PathEvidence (Get-RawWindowsPath -Target Machine)
              user = Get-PathEvidence (Get-RawWindowsPath -Target User)
            }
          }

          function Write-PathSnapshotEvidence {
            param(
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][object]$Snapshot
            )
            Write-Host ("PATH evidence ${Label}: " + ($Snapshot | ConvertTo-Json -Compress))
          }

          function Get-PathSnapshotDifferences {
            param(
              [Parameter(Mandatory)][object]$Expected,
              [Parameter(Mandatory)][object]$Actual
            )
            $differences = @()
            foreach ($scope in @('process', 'machine', 'user')) {
              $expectedValue = $Expected[$scope]
              $actualValue = $Actual[$scope]
              if ($expectedValue.present -ne $actualValue.present -or
                  $expectedValue.length -ne $actualValue.length -or
                  $expectedValue.sha256 -cne $actualValue.sha256 -or
                  $expectedValue.value -cne $actualValue.value) {
                $differences += ("{0}: before(length={1},sha256={2}) after(length={3},sha256={4})" -f
                  $scope, $expectedValue.length, $expectedValue.sha256, $actualValue.length, $actualValue.sha256)
              }
            }
            return $differences
          }

          function Get-RawWindowsPath {
            param([Parameter(Mandatory)][EnvironmentVariableTarget]$Target)
            $registryRoot = if ($Target -eq [EnvironmentVariableTarget]::Machine) {
              [Microsoft.Win32.Registry]::LocalMachine
            } else {
              [Microsoft.Win32.Registry]::CurrentUser
            }
            $subKeyName = if ($Target -eq [EnvironmentVariableTarget]::Machine) {
              'SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
            } else {
              'Environment'
            }
            $registryKey = $registryRoot.OpenSubKey($subKeyName, $false)
            if ($null -eq $registryKey) { return $null }
            try {
              $value = $registryKey.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              if ($null -eq $value) { return $null }
              return [string]$value
            } finally {
              $registryKey.Dispose()
            }
          }

          $pathBefore = Get-PathSnapshot
          Write-PathSnapshotEvidence -Label 'before integration' -Snapshot $pathBefore
          $stageRoot = $null
          $corpusRoot = $null
          $sandboxRoot = $null
          $stageArtifactRoot = Join-Path $env:RUNNER_TEMP 'ecs-windows-tools-stage-artifact'
          $gateInputsRoot = Join-Path $env:RUNNER_TEMP ('ecs-windows-tools-gate-inputs-' + '${{ matrix.server }}')
          $pathBeforeWorkload = $null
          $testExitCode = 1
          $testError = $null
          $cleanupErrors = @()
          $restrictedProcessExitCode = 1
          $standardUserLog = $null
          try {
            $stageItems = @(Get-ChildItem -LiteralPath $stageArtifactRoot -Directory -Filter 'windows_amd64' -Recurse)
            if ($stageItems.Count -ne 1) { throw 'downloaded Windows stage is missing or ambiguous' }
            $sourceStage = $stageItems[0].FullName
            $stageRoot = Join-Path $env:RUNNER_TEMP ('ecs frozen tools stage 数据 ' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
            foreach ($item in @(Get-ChildItem -LiteralPath $sourceStage -Force)) {
              Copy-Item -LiteralPath $item.FullName -Destination $stageRoot -Recurse -Force
            }
            $toolBin = Join-Path $stageRoot 'bin'
            if (-not (Test-Path -LiteralPath $toolBin -PathType Container)) { throw 'staged bundle bin directory is missing' }
            $manifestPath = Join-Path $stageRoot 'manifest.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'staged bundle manifest.json is missing' }
            $licensesRoot = Join-Path $stageRoot 'LICENSES'
            if (-not (Test-Path -LiteralPath $licensesRoot -PathType Container)) { throw 'staged bundle LICENSES directory is missing' }
            $stageFiles = @(Get-ChildItem -LiteralPath $stageRoot -File -Recurse -Force)
            if ($stageFiles.Count -eq 0) { throw 'staged bundle contains no regular files' }
            foreach ($stageFile in $stageFiles) {
              $stageFile.IsReadOnly = $true
            }
            $stageFiles = @(Get-ChildItem -LiteralPath $stageRoot -File -Recurse -Force)
            foreach ($stageFile in $stageFiles) {
              if (-not $stageFile.IsReadOnly) { throw "staged bundle regular file is writable: $($stageFile.FullName)" }
            }
            $licenseFiles = @(Get-ChildItem -LiteralPath $licensesRoot -File -Recurse -Force)
            if ($licenseFiles.Count -eq 0) { throw 'staged bundle LICENSES directory contains no regular files' }
            if (-not (Get-Item -LiteralPath $manifestPath).IsReadOnly) { throw 'staged bundle manifest.json is writable' }
            foreach ($tool in @('zstd.exe', 'npb-ep.exe', 'npb-ft.exe', 'openssl.exe', 'stream.exe', 'fio.exe')) {
              $toolPath = Join-Path $toolBin $tool
              if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) { throw "staged bundle is missing $tool" }
              if (-not (Get-Item -LiteralPath $toolPath).IsReadOnly) { throw "staged bundle $tool is writable" }
            }

            $lock = Get-Content -Raw 'tools/lock.json' | ConvertFrom-Json
            $corpusItems = @(Get-ChildItem -LiteralPath $gateInputsRoot -File -Filter ([string]$lock.corpus.name) -Recurse)
            if ($corpusItems.Count -ne 1) { throw 'fixed zstd corpus is missing or ambiguous' }
            $corpusRoot = Join-Path $env:RUNNER_TEMP ('ecs frozen corpus ' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $corpusRoot | Out-Null
            $corpusPath = Join-Path $corpusRoot ([string]$lock.corpus.name)
            Copy-Item -LiteralPath $corpusItems[0].FullName -Destination $corpusPath -Force

            $sandboxRoot = Join-Path $env:RUNNER_TEMP ('ecs integration sandbox ' + [guid]::NewGuid().ToString('N'))
            $tempRoot = Join-Path $sandboxRoot 'temp with spaces'
            $homeRoot = Join-Path $sandboxRoot 'home with spaces'
            $cacheRoot = Join-Path $sandboxRoot 'cache with spaces'
            $cliRoot = Join-Path $sandboxRoot 'ecs cli executable'
            $cliOutputRoot = Join-Path $sandboxRoot 'ecs cli JSON output'
            $cliDiskPath = Join-Path $sandboxRoot 'fio cli workload with spaces'
            $hostileCliRoot = Join-Path $sandboxRoot 'hostile cli PATH'
            New-Item -ItemType Directory -Force -Path $tempRoot, $homeRoot, $cacheRoot, (Join-Path $cacheRoot 'mod'), $cliRoot, $cliOutputRoot, $cliDiskPath, $hostileCliRoot | Out-Null
            $env:TEMP = $tempRoot
            $env:TMP = $tempRoot
            $env:TMPDIR = $tempRoot
            $env:HOME = $homeRoot
            $env:USERPROFILE = $homeRoot
            $env:GOCACHE = $cacheRoot
            $env:GOMODCACHE = Join-Path $cacheRoot 'mod'
            $env:ECS_TOOL_BIN = $toolBin
            $env:ECS_ZSTD_CORPUS = $corpusPath
            $goPath = (Get-Command go.exe -ErrorAction Stop).Source
