              if ($null -eq $savedGoToolchain) { Remove-Item Env:GOTOOLCHAIN -ErrorAction SilentlyContinue } else { $env:GOTOOLCHAIN = $savedGoToolchain }
            }
            foreach ($name in @('zstd.exe', 'openssl.exe', 'fio.exe')) {
              Copy-Item -LiteralPath $hostileBinary -Destination (Join-Path $hostileCliRoot $name) -Force
            }
            $cliReportPath = Join-Path $cliOutputRoot 'standard-user-cli.json'

            $ordinaryScript = Join-Path $sandboxRoot 'standard user integration.ps1'
            Set-Content -LiteralPath $ordinaryScript -Encoding utf8NoBOM -Value @'
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Start-Transcript -LiteralPath $env:ECS_PHASE1_LOG -Force | Out-Null

          function Get-Phase1Hash {
            param([Parameter(Mandatory)][string]$Text)
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($Text))).Replace('-', '').ToLowerInvariant())
            } finally {
              $sha.Dispose()
            }
          }

          function Get-RawPhase1Path {
            param([Parameter(Mandatory)][EnvironmentVariableTarget]$Target)
            $root = if ($Target -eq [EnvironmentVariableTarget]::Machine) { [Microsoft.Win32.Registry]::LocalMachine } else { [Microsoft.Win32.Registry]::CurrentUser }
            $subKey = if ($Target -eq [EnvironmentVariableTarget]::Machine) { 'SYSTEM\CurrentControlSet\Control\Session Manager\Environment' } else { 'Environment' }
            $key = $root.OpenSubKey($subKey, $false)
            if ($null -eq $key) { return $null }
            try {
              $value = $key.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              if ($null -eq $value) { return $null }
              return [string]$value
            } finally {
              $key.Dispose()
            }
          }

          function Get-Phase1RegistryEvidence {
            param([Parameter(Mandatory)][string]$SubKey)
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($SubKey, $false)
            if ($null -eq $key) {
              return [ordered]@{ present = $false; length = 0; sha256 = (Get-Phase1Hash '') }
            }
            try {
              $values = foreach ($name in @($key.GetValueNames() | Sort-Object)) {
                $kind = $key.GetValueKind($name).ToString()
                $value = $key.GetValue($name, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                '{0}|{1}|{2}' -f $name, $kind, ([string]$value)
              }
              $serialized = @($values) -join [Environment]::NewLine
              return [ordered]@{ present = $true; length = $serialized.Length; sha256 = (Get-Phase1Hash $serialized) }
            } finally {
              $key.Dispose()
            }
          }

          function Get-Phase1PathEvidence {
            param([AllowNull()][string]$Value)
            $present = $null -ne $Value
            $text = if ($present) { $Value } else { '' }
            return [ordered]@{ present = $present; length = $text.Length; sha256 = (Get-Phase1Hash $text); value = $text }
          }

          function Get-Phase1PathSnapshot {
            return [ordered]@{
              process = Get-Phase1PathEvidence ([Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::Process))
              machine = Get-Phase1PathEvidence (Get-RawPhase1Path -Target Machine)
              user = Get-Phase1PathEvidence (Get-RawPhase1Path -Target User)
            }
          }

          function Compare-Phase1PathSnapshot {
            param([Parameter(Mandatory)][object]$Expected, [Parameter(Mandatory)][object]$Actual)
            $differences = @()
            foreach ($scope in @('process', 'machine', 'user')) {
              $before = $Expected[$scope]
              $after = $Actual[$scope]
              if ($before.present -ne $after.present -or $before.length -ne $after.length -or $before.sha256 -cne $after.sha256 -or $before.value -cne $after.value) {
                $differences += ('{0}: before(length={1},sha256={2}) after(length={3},sha256={4})' -f $scope, $before.length, $before.sha256, $after.length, $after.sha256)
              }
            }
            return $differences
          }

          if (-not ('EcsPhase1TokenEvidence' -as [type])) {
            Add-Type -TypeDefinition (@(
              'using System;'
              'using System.ComponentModel;'
              'using System.Runtime.InteropServices;'
              ''
              'public static class EcsPhase1TokenEvidence'
              '{'
              '    private const int TokenElevationTypeInformation = 18;'
              '    private const int TokenElevationInformation = 20;'
              ''
              '    [DllImport("advapi32.dll", SetLastError = true)]'
              '    private static extern bool GetTokenInformation(IntPtr token, int informationClass, IntPtr information, int informationLength, out int returnLength);'
              ''
              '    private static int ReadInformation(IntPtr token, int informationClass)'
              '    {'
              '        IntPtr buffer = Marshal.AllocHGlobal(sizeof(int));'
              '        try'
              '        {'
              '            int returnLength;'
              '            if (!GetTokenInformation(token, informationClass, buffer, sizeof(int), out returnLength))'
              '                throw new Win32Exception(Marshal.GetLastWin32Error(), "GetTokenInformation");'
              '            return Marshal.ReadInt32(buffer);'
              '        }'
              '        finally { Marshal.FreeHGlobal(buffer); }'
              '    }'
              ''
              '    public static bool IsElevated(IntPtr token) { return ReadInformation(token, TokenElevationInformation) != 0; }'
              '    public static int ElevationType(IntPtr token) { return ReadInformation(token, TokenElevationTypeInformation); }'
              '}'
            ) -join [Environment]::NewLine)
          }

          function Get-Phase1TokenEvidence {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            try {
          $principal = New-Object -TypeName Security.Principal.WindowsPrincipal -ArgumentList $identity
              $elevationType = [EcsPhase1TokenEvidence]::ElevationType($identity.Token)
              $typeName = switch ($elevationType) { 1 { 'Default'; break } 2 { 'Full'; break } 3 { 'Limited'; break } default { "Unknown($elevationType)" } }
              return [pscustomobject]@{
                User = [string]$identity.Name
                AdministratorGroupMembership = [bool]$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
                TokenElevated = [bool][EcsPhase1TokenEvidence]::IsElevated($identity.Token)
                ElevationType = [int]$elevationType
                ElevationTypeName = $typeName
              }
            } finally { $identity.Dispose() }
          }

          function Invoke-Phase1CLI {
            param([Parameter(Mandatory)][string]$FilePath, [Parameter(Mandatory)][string[]]$Arguments, [Parameter(Mandatory)][string]$WorkingDirectory)
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $FilePath
            $start.WorkingDirectory = $WorkingDirectory
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $Arguments) { [void]$start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            try {
              if (-not $process.Start()) { throw "could not start $FilePath" }
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit(45 * 60 * 1000)) {
                & taskkill.exe /PID $process.Id /T /F | Out-Host
                throw 'ecs.exe timed out after 2700 seconds'
              }
              $process.WaitForExit()
              return [pscustomobject]@{
                ExitCode = $process.ExitCode
                Stdout = $stdoutTask.GetAwaiter().GetResult()
                Stderr = $stderrTask.GetAwaiter().GetResult()
              }
            } finally { $process.Dispose() }
          }

          $token = Get-Phase1TokenEvidence
          Write-Output ('standard-user token evidence: user={0}; administrator_group_membership={1}; token_elevated={2}; token_elevation_type={3}; restricted_token=true; administrator_sid_disabled=true' -f $token.User, $token.AdministratorGroupMembership, $token.TokenElevated, $token.ElevationTypeName)
          if ($token.AdministratorGroupMembership -or $token.TokenElevated -or $token.ElevationType -eq 2) {
            throw 'integration workload did not start under a non-administrator standard-user token'
          }

          $env:TEMP = $env:ECS_PHASE1_TEMP
          $env:TMP = $env:ECS_PHASE1_TEMP
          $env:TMPDIR = $env:ECS_PHASE1_TEMP
          $env:HOME = $env:ECS_PHASE1_HOME
          $env:USERPROFILE = $env:ECS_PHASE1_HOME
          $env:GOCACHE = $env:ECS_PHASE1_CACHE
          $env:GOMODCACHE = $env:ECS_PHASE1_MODCACHE
          $env:ECS_TOOL_BIN = $env:ECS_PHASE1_TOOL_BIN
          $env:ECS_ZSTD_CORPUS = $env:ECS_PHASE1_CORPUS
          $env:ECS_WINDOWS_CLI_REPORT = $env:ECS_PHASE1_CLI_REPORT
          $env:ECS_WINDOWS_SANDBOX_ROOT = $env:ECS_PHASE1_SANDBOX
          $env:ECS_WINDOWS_CLI_DISK_PATH = $env:ECS_PHASE1_CLI_DISK
          $env:GOTOOLCHAIN = 'local'
