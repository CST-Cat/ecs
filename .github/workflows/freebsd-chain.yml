name: freebsd-chain

# per-target FreeBSD 工具链构建链：由 freebsd-tools.yml 并行调用两次
# （target=freebsd_amd64 与 freebsd_arm64）。每个目标内部保持两条真正独立的
# 支路并行：C-TOOLS（SYSROOT → C-DEPS → C build）∥ GNU（SDK gate → bench），
# 最后 MERGE → VERIFY。C-DEPS 与 GNU BENCH 不再作为只为传递状态而存在的独立
# job；其 lock/下载/验证步骤仍在同一 build job 内完整执行并复用工作目录。
#
# per-target FreeBSD toolchain chain, called in parallel for amd64 and arm64.
# The two independent branches remain parallel: C-TOOLS (SYSROOT → C-DEPS →
# C build) ∥ GNU (SDK gate → benchmark), followed by MERGE → VERIFY. The
# original lock and verification gates remain, but no longer create a second
# job only to wait and download the same inputs.
# 静态检查与整体依赖（legacy-absent / linux-static / workflow-static）由调用方
# freebsd-tools.yml 承担。
# VERIFY 之后的 REAL GATE 由 freebsd-gate.yml 负责。把 VM gate 从本链拆出后，
# Bundle 可以让 PACKAGE/E2E 与 REAL GATE 共享同一份已验证 stage 并行执行。
# 构建逻辑全部在 scripts/，本 workflow 只做编排；所有构建都在 ubuntu-24.04
# amd64 宿主交叉完成，无 VM 参与 builder；永久禁止：FreeBSD VM builder。
#
# 构建输出不使用共享 cache（与 main 一致）：GNU SDK 来自 immutable Release
# `ci-freebsd-gnu-sdk-v1.3`（lock 钉 SHA256，见 freebsd_gnu_openmp_sdk.sh），
# 其余产物每次冷构建；VM builder 永久禁止。
#
# 注意：不放 concurrency 块——freebsd-tools.yml 会用两个 job 并行调用本
# workflow，concurrency 分组会让两条链互相互斥。

on:
  workflow_call:
    inputs:
      target:
        description: 'FreeBSD target to build: freebsd_amd64 or freebsd_arm64'
        required: true
        type: string

permissions:
  contents: read

jobs:
  c-tools:
    name: C-TOOLS (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FREEBSD_C_SYSROOT_DIR: .ci/freebsd-c-preflight/sysroot
      FREEBSD_C_SYSROOT_WORK_DIR: .ci/freebsd-c-preflight/sysroot-work
      FREEBSD_C_DEPS_PREFIX: .ci/freebsd-c-preflight/deps
      FREEBSD_C_DEPS_WORK_DIR: .ci/freebsd-c-preflight/deps-work
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Install clang/lld and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm file xz-utils zstd libarchive-tools \
            autoconf automake libtool libtool-bin pkg-config \
            make git curl jq perl

      - name: Install and probe FreeBSD sysroot (${{ inputs.target }})
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_sysroot.sh \
            --target ${{ inputs.target }} \
            --sysroot-dir "$FREEBSD_C_SYSROOT_DIR" \
            --work-dir "$FREEBSD_C_SYSROOT_WORK_DIR"

      - name: Assert the sysroot lock is release-pinned
        run: |
          set -euo pipefail
          release=$(jq -er '.freebsd_release' tools/freebsd-sysroot.lock.json)
          test "$release" = "15.1-RELEASE"
          for target in freebsd_amd64 freebsd_arm64; do
            url=$(jq -er --arg t "$target" '.targets[$t].base_txz_url' tools/freebsd-sysroot.lock.json)
            case "$url" in
              *15.1-RELEASE*) ;;
              *) echo "target $target is not pinned to 15.1-RELEASE: $url" >&2; exit 1 ;;
            esac
            case "$url" in
              *latest*|*stable*|*current*)
                echo "target $target uses a rolling URL: $url" >&2
                exit 1
                ;;
            esac
          done

      - name: Fetch and verify immutable target dependencies (${{ inputs.target }})
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_target_deps.sh \
            --target ${{ inputs.target }} \
            --prefix "$FREEBSD_C_DEPS_PREFIX" \
            --work-dir "$FREEBSD_C_DEPS_WORK_DIR"

      - name: Assert target dependencies use the immutable snapshot
        run: |
          set -euo pipefail
          if jq -e '.. | objects | select(has("snapshot_url")) | .snapshot_url' \
            tools/freebsd-target-deps.lock.json | grep -E 'latest|Hashed'; then
            echo 'lock contains rolling package URLs' >&2
            exit 1
          fi
          test "$(jq -er '.snapshot.id' tools/freebsd-target-deps.lock.json)" = 'ci-freebsd-deps-v1'

      - name: Print builder params
        run: bash scripts/build_tools_freebsd_c.sh --target ${{ inputs.target }} --print-params

      - name: Build five C-tools for ${{ inputs.target }}
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_c.sh \
            --target ${{ inputs.target }} \
            --stage-root "$PWD/.ci/freebsd-c-tools-stage" \
            --jobs "$(nproc)"

      - name: Upload C-tools stage fragment
        uses: actions/upload-artifact@v7
        with:
          name: ecs-freebsd-c-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-c-tools-stage/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7

  gnu-sdk:
    name: GNU SDK (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FREEBSD_GNU_SYSROOT_DIR: .ci/gnu-sdk-work/sysroot
      FREEBSD_GNU_SYSROOT_WORK_DIR: .ci/gnu-sdk-work/sysroot-work
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Install toolchain build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev \
            texinfo file xz-utils curl jq zstd clang lld llvm

      - name: Print GNU SDK lock
        run: bash scripts/ci/freebsd_gnu_openmp_sdk.sh --target ${{ inputs.target }} --print-lock

      # 纯门禁：按 lock 钉 URL 下载 prebuilt 快照 → SHA256 校验 → 解包 →
      # 全部既有断言与 5 项 probe。不产出 artifact：probe 验证过的字节由
      # SHA256 钉死，GNU BENCH 直接从 immutable Release 消费同一字节。
      - name: Gate the pinned GNU SDK snapshot (${{ inputs.target }})
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd_gnu_openmp_sdk.sh \
            --target ${{ inputs.target }} \
            --prefix "$PWD/.ci/gnu-sdk/${{ inputs.target }}" \
            --work-dir "$PWD/.ci/gnu-sdk-work" \
            --jobs "$(nproc)"

      # The gate leaves the exact SHA-pinned SDK in this job's workspace. The
      # benchmark consumes that directory directly, so the SDK is not fetched
      # and unpacked a second time in a downstream job.
      - name: Print builder params
        run: bash scripts/build_tools_freebsd_gnu.sh --target ${{ inputs.target }} --print-params

      - name: Build NPB EP/FT + STREAM for ${{ inputs.target }}
        run: |
          set -euo pipefail
          bash scripts/build_tools_freebsd_gnu.sh \
            --target ${{ inputs.target }} \
            --sdk-prefix "$PWD/.ci/gnu-sdk/${{ inputs.target }}" \
            --stage-root "$PWD/.ci/freebsd-gnu-tools-stage"

      - name: Upload GNU tools stage fragment
        uses: actions/upload-artifact@v7
        with:
          name: ecs-freebsd-gnu-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-gnu-tools-stage/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7

  merge:
    name: MERGE (${{ inputs.target }})
    needs: [c-tools, gnu-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Install merge dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Stage 3 C-tools fragment
        uses: actions/download-artifact@v8
        with:
          name: ecs-freebsd-c-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-c-tools-stage/${{ inputs.target }}

      - name: Download Stage 5 GNU tools fragment
        uses: actions/download-artifact@v8
        with:
          name: ecs-freebsd-gnu-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-gnu-tools-stage/${{ inputs.target }}

      - name: Merge C + GNU fragments into the final stage
        run: |
          set -euo pipefail
          bash scripts/ci/merge_freebsd_tools_stage.sh \
            --target ${{ inputs.target }} \
            --c-fragment "$PWD/.ci/freebsd-c-tools-stage/${{ inputs.target }}" \
            --gnu-fragment "$PWD/.ci/freebsd-gnu-tools-stage/${{ inputs.target }}" \
            --stage-root "$PWD/.ci/freebsd-tools-stage"

      - name: Upload merged FreeBSD tools stage
        uses: actions/upload-artifact@v7
        with:
          name: ecs-freebsd-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-tools-stage/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 7

  verify:
    name: VERIFY (${{ inputs.target }})
    needs: [merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y file binutils jq

      - name: Download merged FreeBSD tools stage
        uses: actions/download-artifact@v8
        with:
          name: ecs-freebsd-tools-stage-${{ inputs.target }}
          path: .ci/freebsd-tools-stage/${{ inputs.target }}

      - name: Verify the merged FreeBSD tools stage
        run: |
          set -euo pipefail
          bash scripts/verify_tools_stage.sh \
            --target ${{ inputs.target }} \
            --stage-root "$PWD/.ci/freebsd-tools-stage"
