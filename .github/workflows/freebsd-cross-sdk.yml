name: freebsd-cross-sdk

on:
  push:
    branches: ["bsd"]
    paths:
      - ".github/workflows/freebsd-cross-sdk.yml"
      - "scripts/ci/freebsd_cross_sdk.sh"
      - "tools/freebsd-cross-sdk.lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-cross-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-sdk:
    name: arm64 SDK (FreeBSD amd64 host)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start FreeBSD 15.1 amd64 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: "4"
          mem: "8192"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y \
              aarch64-binutils bash ca_root_nss curl gmake gmp jq libiconv \
              mpc mpfr perl5 qemu-user-static texinfo
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: HOST CONTRACT
        id: host_contract
        shell: freebsd {0}
        run: |
          set -eu
          [ "$(uname -s)" = FreeBSD ]
          [ "$(uname -m)" = amd64 ]
          pkg info -e 'aarch64-binutils-*'
          command -v qemu-aarch64-static
          printf 'build_host=%s/%s\n' "$(uname -s)" "$(uname -m)"
          printf 'target=FreeBSD/aarch64\n'
          printf 'binutils_package=%s\n' "$(pkg query '%n-%v' aarch64-binutils)"
          printf 'execution_model=host-native cross build; qemu-user only for finished target probes\n'

      - name: SYSROOT
        id: sdk_sysroot
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' sysroot"

      - name: TOOLCHAIN
        id: sdk_toolchain
        timeout-minutes: 90
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk JOBS=4 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' toolchain"

      - name: DEPS
        id: sdk_deps
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' deps"

      - name: PROBE
        id: sdk_probe
        timeout-minutes: 10
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk \
            ECS_TARGET_RUNNER=qemu-aarch64-static \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' probe"

      - name: Cross SDK summary
        if: always()
        env:
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          HOST_OUTCOME: ${{ steps.host_contract.outcome }}
          SYSROOT_OUTCOME: ${{ steps.sdk_sysroot.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.sdk_toolchain.outcome }}
          DEPS_OUTCOME: ${{ steps.sdk_deps.outcome }}
          PROBE_OUTCOME: ${{ steps.sdk_probe.outcome }}
        run: |
          set -eu
          failed=0
          for item in \
            "VM=$VM_OUTCOME" \
            "HOST=$HOST_OUTCOME" \
            "SYSROOT=$SYSROOT_OUTCOME" \
            "TOOLCHAIN=$TOOLCHAIN_OUTCOME" \
            "DEPS=$DEPS_OUTCOME" \
            "PROBE=$PROBE_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            if [ "$outcome" = success ]; then
              printf '[PASS] %s\n' "$name"
            else
              printf '[FAIL] %s (%s)\n' "$name" "$outcome" >&2
              failed=1
            fi
          done
          exit "$failed"
