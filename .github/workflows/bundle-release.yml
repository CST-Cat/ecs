name: bundle-release

# 独立发布九个平台目标的 benchmark bundle。Bundle 不参与 ECS application release。
#
# Linux 的七个目标在目标架构容器里构建；FreeBSD 的两个目标在真实 FreeBSD VM 里
# 构建，复用 scripts/ci/freebsd_tools.sh 这条已被 freebsd-tools.yml 验证过的路径，
# 而不是把构建定义抄成第二份。assemble 只做搬运和打包：它不重新构建任何工具。
#
# FreeBSD 目标在打包之前必须过两道真实客户机验收，缺一不可：
#   arm64-gate    cross 出来的 freebsd_arm64 fio 在真实 FreeBSD/aarch64 上跑
#                 posixaio QD32/QD64（qemu-user 建不起 fio 需要的 shm 段）。
#   artifact-e2e  用 scripts/package.sh 真正产出的发布布局驱动真实 run.sh：
#                 校验 SHA-256、解包 ecs、解析 Bundle 基址、暂存固定工具、
#                 跑真实基准。编译通过不等于发布物可用。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: bundle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools:
    name: tools (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_arm64, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { target: linux_armv7, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { target: linux_386, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_s390x, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_riscv64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_ppc64le, runner: ubuntu-24.04, runner_arch: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Verify runner architecture
        env:
          EXPECTED: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          actual=$(uname -m)
          case "$EXPECTED:$actual" in
            x86_64:x86_64 | arm64:aarch64 | arm64:arm64) ;;
            *)
              echo "expected $EXPECTED runner, got $actual" >&2
              exit 1
              ;;
          esac

      - name: Build tools in the target container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_tools_container.sh --target '${{ matrix.target }}' --stage-root .ci-tools-stage

      - name: Validate the staged tools
        run: |
          set -euo pipefail
          validate_args=(--target '${{ matrix.target }}' --stage-root .ci-tools-stage)
          if [[ '${{ matrix.target }}' == linux_amd64 ]]; then
            validate_args+=(--keep-corpus)
          fi
          ./scripts/verify_tools_stage.sh "${validate_args[@]}"

      - name: Collect the architecture stage
        run: |
          set -euo pipefail
          mkdir -p artifact
          sudo cp -a ".ci-tools-stage/${{ matrix.target }}" artifact/
          sudo chown -R "$(id -u):$(id -g)" artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-tools-stage-${{ matrix.target }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # freebsd_amd64 builds natively inside a FreeBSD/amd64 guest. freebsd_arm64 is a
  # host-native cross build on that same guest: the compilers run natively on
  # amd64 and qemu-user only executes finished arm64 ELF smoke binaries. Both use
  # scripts/ci/freebsd_tools.sh, the same entry point freebsd-tools.yml validates.
  freebsd-tools:
    name: freebsd tools (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd_amd64
            cross: "0"
            packages: >-
              autoconf automake bash binutils ca_root_nss concurrencykit curl
              gcc14 git gmake go help2man jq libtool luajit m4 perl5 pkgconf
          - target: freebsd_arm64
            cross: "1"
            packages: >-
              aarch64-binutils autoconf automake bash ca_root_nss curl git
              gmake gmp go help2man jq libiconv libtool m4 mpc mpfr perl5
              pkgconf qemu-user-static texinfo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Start FreeBSD 15.1 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: "4"
          mem: "8192"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y ${{ matrix.packages }}
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = amd64 ] || {
            printf 'guest architecture mismatch: target=${{ matrix.target }} expected=amd64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          ncpu=$(sysctl -n hw.ncpu)
          [ "$ncpu" -ge 2 ] || {
            printf 'VM CPU contract violated: target=${{ matrix.target }} expected>=2 actual=%s\n' "$ncpu" >&2
            exit 1
          }
          printf 'target=${{ matrix.target }}\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$ncpu"
          if [ "${{ matrix.cross }}" = "1" ]; then
            pkg info -e 'aarch64-binutils-*'
            command -v qemu-aarch64-static
            printf 'execution_model=host-native cross build; qemu-user only for finished target probes\n'
          else
            printf 'execution_model=native FreeBSD/amd64 guest; compiler runs in guest\n'
          fi

      - name: Cross SDK (freebsd_arm64 only)
        if: matrix.cross == '1'
        id: cross_sdk
        timeout-minutes: 90
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_CROSS_SDK_ROOT=/tmp/ecs-freebsd-arm64-sdk JOBS=4 \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_cross_sdk.sh' all"

      - name: Build and verify the FreeBSD tool stage
        id: freebsd_build
        shell: freebsd {0}
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = "1" ]; then
            extra="ECS_FREEBSD_CROSS_SDK=/tmp/ecs-freebsd-arm64-sdk ECS_TARGET_RUNNER=qemu-aarch64-static"
          else
            extra=""
          fi
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            ECS_FREEBSD_TARGET=${{ matrix.target }} $extra \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_tools.sh' all"

      - name: Export the FreeBSD stage
        id: freebsd_export
        shell: freebsd {0}
        run: |
          set -eu
          stage=/tmp/ecs-freebsd-tools-stage
          [ -d "$stage/${{ matrix.target }}/bin" ] || {
            echo "stage is missing: $stage/${{ matrix.target }}" >&2
            exit 1
          }
          rm -rf "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          cp -a "$stage" "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage"
          # copyback preserves workspace ownership on the Linux host.
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/.ci/freebsd-tools-stage/${{ matrix.target }}/bin" -type f | sort

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-tools-stage-${{ matrix.target }}
          path: .ci/freebsd-tools-stage
          if-no-files-found: error
          retention-days: 7

      - name: FreeBSD tools summary
        if: always()
        env:
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          SDK_OUTCOME: ${{ steps.cross_sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.freebsd_build.outcome }}
          EXPORT_OUTCOME: ${{ steps.freebsd_export.outcome }}
        run: |
          failed=0
          for item in \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "SDK=$SDK_OUTCOME" \
            "BUILD_AND_VERIFY=$BUILD_OUTCOME" \
            "EXPORT=$EXPORT_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"

  # 真实 FreeBSD/aarch64 客户机：cross 出来的 freebsd_arm64 fio 在 amd64 宿主上
  # 只能做 ELF 身份校验，qemu-user 建不起 fio 需要的 shm 段。这个 job 是缺失的
  # 功能验收，也是打包前必须通过的门禁——没有它，一个在真机上跑不起来的 fio
  # 可以一路发布出去。
  arm64-gate:
    name: real arm64 fio gate
    needs: freebsd-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the freebsd_arm64 tools stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-tools-stage-freebsd_arm64
          path: .ci/freebsd-tools-stage

      - name: HOST CONTRACT
        id: host_contract
        run: |
          set -eu
          host_arch=$(uname -m)
          [ "$host_arch" = x86_64 ] || {
            printf 'host architecture mismatch: target=freebsd_arm64 gate expected=x86_64 actual=%s\n' "$host_arch" >&2
            exit 1
          }
          stage_bin=".ci/freebsd-tools-stage/freebsd_arm64/bin"
          # Artifact download may drop the executable bit.
          chmod -R a+rX .ci/freebsd-tools-stage
          chmod a+x "$stage_bin"/* || true
          [ -x "$stage_bin/fio" ] || {
            printf 'downloaded stage is missing executable fio under %s\n' "$stage_bin" >&2
            ls -la "$stage_bin" >&2 || true
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'gate=real FreeBSD/aarch64 VM fio functional smoke\n'

      - name: Start FreeBSD 15.1 aarch64 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: aarch64
          cpu: "2"
          mem: "4096"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y bash ca_root_nss file jq
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = arm64 ] || {
            printf 'guest architecture mismatch: target=freebsd_arm64 expected=arm64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          printf 'target=freebsd_arm64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$(sysctl -n hw.ncpu)"
          printf 'phase_contract=FIO_FUNCTIONAL\n'

      - name: FIO FUNCTIONAL
        id: fio_gate
        timeout-minutes: 10
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_arm64_gate.sh' \
              --stage-root '$GITHUB_WORKSPACE/.ci/freebsd-tools-stage' \
              --target freebsd_arm64"

      - name: arm64 gate summary
        if: always()
        env:
          HOST_CONTRACT_OUTCOME: ${{ steps.host_contract.outcome }}
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          FIO_OUTCOME: ${{ steps.fio_gate.outcome }}
        run: |
          failed=0
          for item in \
            "HOST_CONTRACT=$HOST_CONTRACT_OUTCOME" \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "FIO_FUNCTIONAL=$FIO_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"

  # 发布物级端到端：布局由 scripts/ci/freebsd_artifact_layout.sh 在 Linux 主机上
  # 用 scripts/package.sh 生成（与真实发布同源），再在真实 FreeBSD/amd64 客户机里
  # 交给真实 run.sh 消费。这一步之后，被发布的就是被运行过的字节。
  artifact-e2e:
    name: artifact E2E (freebsd_amd64)
    needs: freebsd-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Download the freebsd_amd64 tools stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecs-tools-stage-freebsd_amd64
          path: .ci/freebsd-tools-stage

      - name: Build the FreeBSD release layout
        run: |
          set -euo pipefail
          # Artifact download may drop the executable bit; package.sh only needs
          # read access and re-applies 0755 itself.
          chmod -R a+rX .ci/freebsd-tools-stage
          bash ./scripts/ci/freebsd_artifact_layout.sh \
            --stage-root "$PWD/.ci/freebsd-tools-stage" \
            --layout "$PWD/.ci/freebsd-artifact-layout" \
            --target freebsd_amd64

      - name: Start FreeBSD 15.1 VM
        id: freebsd_vm
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          cpu: "2"
          mem: "4096"
          sync: rsync
          copyback: false
          cache-after-prepare: true
          custom-shell-name: freebsd
          prepare: |
            pkg install -y bash ca_root_nss jq
            pw useradd ecsci -m -s /bin/sh
            chown -R ecsci:ecsci "$GITHUB_WORKSPACE"

      - name: VM CONTRACT
        id: vm_contract
        shell: freebsd {0}
        run: |
          set -eu
          guest_arch=$(uname -m)
          [ "$guest_arch" = amd64 ] || {
            printf 'guest architecture mismatch: target=freebsd_amd64 expected=amd64 actual=%s\n' "$guest_arch" >&2
            exit 1
          }
          [ -s "$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout/ecs-release/ecs_freebsd_amd64.tar.gz" ] || {
            echo 'release layout did not reach the guest' >&2
            exit 1
          }
          printf 'target=freebsd_amd64\n'
          printf 'guest_uname=%s\n' "$guest_arch"
          printf 'guest_ncpu=%s\n' "$(sysctl -n hw.ncpu)"
          printf 'phase_contract=ARTIFACT_E2E\n'

      - name: ARTIFACT E2E
        id: artifact_e2e
        timeout-minutes: 20
        shell: freebsd {0}
        run: |
          set -eu
          su -m ecsci -c \
            "HOME=/home/ecsci PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin \
            /usr/local/bin/bash '$GITHUB_WORKSPACE/scripts/ci/freebsd_artifact_e2e.sh' \
              --layout '$GITHUB_WORKSPACE/.ci/freebsd-artifact-layout' \
              --target freebsd_amd64"

      - name: artifact E2E summary
        if: always()
        env:
          VM_OUTCOME: ${{ steps.freebsd_vm.outcome }}
          VM_CONTRACT_OUTCOME: ${{ steps.vm_contract.outcome }}
          E2E_OUTCOME: ${{ steps.artifact_e2e.outcome }}
        run: |
          failed=0
          for item in \
            "VM=$VM_OUTCOME" \
            "VM_CONTRACT=$VM_CONTRACT_OUTCOME" \
            "ARTIFACT_E2E=$E2E_OUTCOME"; do
            name=${item%%=*}
            outcome=${item#*=}
            case "$outcome" in
              success) printf '[PASS] %s\n' "$name" ;;
              skipped) printf '[SKIP] %s\n' "$name" ;;
              *) printf '[FAIL] %s (%s)\n' "$name" "$outcome"; failed=1 ;;
            esac
          done
          exit "$failed"

  assemble:
    needs: [tools, freebsd-tools, arm64-gate, artifact-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ecs-tools-stage-*
          path: tools-artifacts

      - name: Normalize the downloaded tools stages
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p tools-stage
          for target in "${ECS_TARGET_IDS[@]}"; do
            source_dir="tools-artifacts/ecs-tools-stage-${target}/${target}"
            stage_dir="tools-stage/${target}"
            test -d "$source_dir"
            mkdir -p "$stage_dir"
            cp -a "$source_dir/." "$stage_dir/"
            chmod +x "$stage_dir/bin/"*
          done

      - name: Package the bundle
        run: ./scripts/package.sh --tools-stage tools-stage --all-targets

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-dist
          path: dist

      - name: Read the bundle release tag
        id: bundle
        run: |
          set -euo pipefail
          bundle=$(<tools/BUNDLE)
          printf 'tag=%s\n' "$bundle" >>"$GITHUB_OUTPUT"

      - name: Publish the bundle release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          VERSION: Unreleased
          REVISION: ${{ github.sha }}
        run: |
          ./scripts/release/publish.sh \
            --kind bundle \
            --tag "$TAG" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --dist dist
