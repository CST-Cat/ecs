name: bundle-release

# 独立发布 benchmark bundle。Bundle 不参与 ECS application release。
#
# FreeBSD 路径：唯一 FreeBSD build path 是
# freebsd-tools.yml，通过 workflow_call 整体复用（同 run 内 artifact 按名可
# 取）；本 workflow 不构建 FreeBSD tools，也不复制任何 builder 逻辑。
#
# 唯一 DAG（FreeBSD 链与 Linux 七目标链并行；publish 硬依赖全部前置）：
#   tools ×7（Linux，目标架构容器构建）
#   FREEBSD BUILD（workflow_call 复用 freebsd-tools.yml：SYSROOT→C-DEPS→
#     C-TOOLS ∥ GNU SDK→GNU BENCH→MERGE→VERIFY×2）
#     ├─ REAL GATE AMD64 ∥ REAL GATE ARM64
#     └─ PACKAGE（scripts/ci/freebsd_artifact_layout.sh 每个目标调用真
#         scripts/package.sh）→ ARTIFACT E2E AMD64 ∥ ARTIFACT E2E ARM64
#     （REAL GATE 与 PACKAGE/E2E 在同一 reusable workflow 内并行，均消费
#      已通过 VERIFY 的 stage；VM 真实执行，不重新构建任何东西）
#   WINDOWS BUILD（workflow_call 复用 windows-tools.yml：LOCK/CHECK→BUILD→
#     VERIFY×2→PACKAGE→E2E×2）
#   → ASSEMBLE（十个平台目标的 stage 由 scripts/package.sh --all-targets
#     一次打包，统一 checksums）
#   → REHEARSAL / PUBLISH。
#
# 触发语义与 release.yml 一致：workflow_dispatch 永远是全链彩排，即使运行 ref
# 选中了 bundle-v* tag；正式发布必须同时是 push 事件与 refs/tags/bundle-v*，
# 且触发 tag 必须精确等于 tools/BUNDLE。彩排会通过 publish.sh --check-only
# 验证 Bundle notes 与最终资产清单，但不会访问或修改 GitHub Release/tag。
#
# FreeBSD 消费者基础设施（全部复用，不重新实现）：
#   scripts/ci/freebsd_artifact_layout.sh
#   scripts/ci/freebsd_artifact_e2e.sh

on:
  push:
    tags: ["bundle-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: bundle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # FreeBSD 唯一 build path：整体复用生产 workflow，含 structural verify、
  # 两个真实 VM gate、Bundle PACKAGE 和两个 artifact E2E。这里不重复逻辑。
  freebsd-build:
    name: FREEBSD BUILD
    permissions:
      contents: read
    uses: ./.github/workflows/freebsd-tools.yml
    with:
      run_bundle_e2e: true

  # Windows 唯一 build path：整体复用 windows-tools.yml，包含两个真实 runner
  # 的 gate、打包和 artifact E2E；本 workflow 不复制任何 Windows builder 逻辑。
  windows-build:
    name: WINDOWS BUILD
    permissions:
      contents: read
    uses: ./.github/workflows/windows-tools.yml

  tools:
    name: tools (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_arm64, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { target: linux_armv7, runner: ubuntu-24.04-arm, runner_arch: arm64 }
          - { target: linux_386, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_s390x, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_riscv64, runner: ubuntu-24.04, runner_arch: x86_64 }
          - { target: linux_ppc64le, runner: ubuntu-24.04, runner_arch: x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Verify runner architecture
        env:
          EXPECTED: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          actual=$(uname -m)
          case "$EXPECTED:$actual" in
            x86_64:x86_64 | arm64:aarch64 | arm64:arm64) ;;
            *)
              echo "expected $EXPECTED runner, got $actual" >&2
              exit 1
              ;;
          esac

      - name: Build tools in the target container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_tools_container.sh --target '${{ matrix.target }}' --stage-root .ci-tools-stage

      - name: Validate the staged tools
        run: |
          set -euo pipefail
          validate_args=(--target '${{ matrix.target }}' --stage-root .ci-tools-stage)
          if [[ '${{ matrix.target }}' == linux_amd64 ]]; then
            validate_args+=(--keep-corpus)
          fi
          ./scripts/verify_tools_stage.sh "${validate_args[@]}"

      - name: Collect the architecture stage
        run: |
          set -euo pipefail
          mkdir -p artifact
          sudo cp -a ".ci-tools-stage/${{ matrix.target }}" artifact/
          sudo chown -R "$(id -u):$(id -g)" artifact

      - uses: actions/upload-artifact@v7
        with:
          name: ecs-tools-stage-${{ matrix.target }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  # ASSEMBLE 等待两个 reusable workflow 返回；它们内部已经等待 VERIFY、REAL
  # GATE、PACKAGE 和两个 ARTIFACT E2E。十个目标的打包仍只
  # 由 scripts/package.sh 完成。
  assemble:
    needs: [tools, freebsd-build, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/download-artifact@v8
        with:
          pattern: ecs-tools-stage-*
          path: tools-artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: ecs-freebsd-tools-stage-*
          path: tools-artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: ecs-windows-tools-stage-*
          path: tools-artifacts

      - name: Normalize the downloaded tools stages
        run: |
          set -euo pipefail
          source scripts/lib/common.sh
          mkdir -p tools-stage
          for target in "${ECS_LINUX_TARGET_IDS[@]}"; do
            source_dir="tools-artifacts/ecs-tools-stage-${target}/${target}"
            stage_dir="tools-stage/${target}"
            test -d "$source_dir"
            mkdir -p "$stage_dir"
            cp -a "$source_dir/." "$stage_dir/"
            chmod +x "$stage_dir/bin/"*
          done
          for target in "${ECS_FREEBSD_TARGET_IDS[@]}"; do
            source_dir="tools-artifacts/ecs-freebsd-tools-stage-${target}"
            stage_dir="tools-stage/${target}"
            test -d "$source_dir/bin"
            test -s "$source_dir/manifest.json"
            mkdir -p "$stage_dir"
            cp -a "$source_dir/." "$stage_dir/"
            chmod +x "$stage_dir/bin/"*
          done
          for target in "${ECS_WINDOWS_TARGET_IDS[@]}"; do
            source_dir=$(find "tools-artifacts/ecs-windows-tools-stage-${target}" -type d -name "$target" -print -quit)
            stage_dir="tools-stage/${target}"
            test -n "$source_dir"
            test -s "$source_dir/manifest.json"
            mkdir -p "$stage_dir"
            cp -a "$source_dir/." "$stage_dir/"
            chmod +x "$stage_dir/bin/"*
          done

      - name: Package the bundle
        # 十个平台目标一次打包：Linux 七个 + FreeBSD 两个 + Windows amd64，统一 checksums。
        run: ./scripts/package.sh --tools-stage tools-stage --all-targets

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-dist
          path: dist
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # workflow_dispatch 专用的发布边界彩排。Bundle 已经有 tools/BUNDLE 作为确切
  # 候选版本，因此这里能够连对应 BUNDLE_NOTES 双语章节一起验证；check-only 在
  # 任何 gh 操作之前返回，最终制品只留在 Actions artifact 中。
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/download-artifact@v8
        with:
          name: bundle-dist
          path: dist
      - name: Validate publication boundary without remote mutation
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(<tools/BUNDLE)
          ./scripts/release/publish.sh \
            --kind bundle \
            --tag "$tag" \
            --version "$tag" \
            --revision "$REVISION" \
            --dist dist \
            --check-only
          {
            echo '### Bundle release rehearsal passed'
            echo
            echo "- Candidate Bundle: \`$tag\`"
            echo "- Candidate commit: \`$REVISION\`"
            echo '- Git tag created: **no**'
            echo '- GitHub Release created/edited: **no**'
            echo '- `bundle-dist` remains only a 7-day Actions artifact.'
          } >>"$GITHUB_STEP_SUMMARY"

  # 唯一发布出口：依赖图上经过 assemble 的全部前置（tools 与 freebsd-build；
  # 后者内部已等待 package、两个 ARTIFACT E2E 和两个 REAL GATE）。正式发布需要
  # event=push + bundle-v* ref；dispatch 即使选中 tag ref 也永远跳过。
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bundle-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/download-artifact@v8
        with:
          name: bundle-dist
          path: dist

      - name: Read and validate the bundle release tag
        id: bundle
        run: |
          set -euo pipefail
          bundle=$(<tools/BUNDLE)
          if [[ "$GITHUB_REF_NAME" != "$bundle" ]]; then
            echo "bundle trigger tag '$GITHUB_REF_NAME' does not match tools/BUNDLE '$bundle'" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$bundle" >>"$GITHUB_OUTPUT"

      - name: Publish the bundle release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          VERSION: ${{ steps.bundle.outputs.tag }}
          REVISION: ${{ github.sha }}
        run: |
          ./scripts/release/publish.sh \
            --kind bundle \
            --tag "$TAG" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --dist dist
